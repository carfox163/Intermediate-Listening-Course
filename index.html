<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发展汉语 · 中级听力 II · 听力训练</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#16202f; --ink2:#4a5670; --muted:#8b95a8;
  --line:#e5e9f2; --line2:#d6ddec;
  --accent:#3557c9; --accent2:#27409b; --accent-soft:#edf1ff;
  --amber:#a8560b; --amber-soft:#fff6e9; --amber-line:#e8c48a;
  --ok:#1f7a5a; --ok-soft:#e9f7f1;
  --radius:16px;
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  --fs:1;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{max-width:100%;overflow-x:hidden}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:calc(15px*var(--fs));-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 520px at 12% -12%, #ffffff 0%, rgba(255,255,255,0) 62%),
    radial-gradient(900px 480px at 100% 0%, #eaf0ff 0%, rgba(234,240,255,0) 58%);
}
a{color:inherit;text-decoration:none}
::selection{background:#cfd9ff}

/* ---------- 布局 ---------- */
.app{display:block;min-height:100vh}
.side{
  position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;
  overflow-y:auto;padding:24px 18px 120px;
  border-right:1px solid var(--line);background:rgba(252,253,255,.9);backdrop-filter:blur(10px);
  transition:transform .26s cubic-bezier(.4,0,.2,1),box-shadow .26s
}
.brand{display:flex;gap:11px;align-items:center;margin-bottom:20px}
.brand .mark{
  width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),#5c7ce0);color:#fff;font-family:var(--serif);
  font-size:20px;box-shadow:0 8px 18px rgba(53,87,201,.24)
}
.brand h1{font-size:14px;margin:0;font-weight:700;line-height:1.45}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.sidehead{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:1.4px;
  color:var(--muted);text-transform:uppercase;margin:18px 0 8px}
.sidehead::after{content:"";flex:1;height:1px;background:var(--line)}
.lessonbtn{
  width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;
  background:transparent;padding:9px 10px;border-radius:11px;cursor:pointer;color:var(--ink2);
  font-family:inherit;font-size:13.5px;line-height:1.35;transition:.16s;margin-bottom:2px
}
.lessonbtn:hover{background:#fff;border-color:var(--line);color:var(--ink)}
.lessonbtn .u{font-size:11.5px;font-weight:700;color:var(--muted);background:#eef1f8;border-radius:7px;
  padding:3px 7px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.lessonbtn.active{background:#fff;border-color:var(--line2);color:var(--ink);
  box-shadow:0 2px 10px rgba(22,32,47,.05)}
.lessonbtn.active .u{background:var(--accent);color:#fff}
.navlist{list-style:none;margin:6px 0 0;padding:0;position:relative}
.navlist::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--line)}
.navlist a{display:block;padding:6px 8px 6px 24px;font-size:13.5px;color:var(--ink2);border-radius:8px;position:relative}
.navlist a::before{content:"";position:absolute;left:4px;top:50%;transform:translateY(-50%);
  width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--line2)}
.navlist a:hover{color:var(--accent2)}
.navlist a.on{color:var(--accent2);font-weight:600}
.navlist a.on::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sidefoot{margin-top:24px;font-size:12px;color:var(--muted);line-height:1.9;border-top:1px dashed var(--line);padding-top:14px}
kbd{font-family:var(--sans);font-size:11px;background:#eef1f8;border:1px solid var(--line2);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink2)}

.main{min-width:0;margin-left:272px;transition:margin-left .26s cubic-bezier(.4,0,.2,1);padding-bottom:96px}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;gap:12px;align-items:center;
  padding:11px 28px;background:rgba(244,246,251,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)
}
.crumb{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.crumb b{color:var(--ink2);font-weight:600}
.spacer{flex:1}
.voicetag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.voicetag i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.voicetag.warn i{background:#d08b1f}
.iconbtn{width:34px;height:31px;border-radius:9px;border:1px solid var(--line2);background:#fff;cursor:pointer;
  color:var(--ink2);font-size:13px;display:grid;place-items:center;transition:.16s;font-family:inherit}
.iconbtn:hover{border-color:var(--accent);color:var(--accent2)}
.switch{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:#fff;
  border-radius:999px;padding:5px 12px 5px 9px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink2);transition:.16s}
.switch .dot{width:24px;height:14px;border-radius:999px;background:#dfe4ef;position:relative;transition:.2s}
.switch .dot::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch[aria-pressed="true"]{background:var(--accent-soft);border-color:#bcc9f0;color:var(--accent2)}
.switch[aria-pressed="true"] .dot{background:var(--accent)}
.switch[aria-pressed="true"] .dot::after{transform:translateX(10px)}
.menubtn{display:grid;font-size:15px}
.menubtn.on{border-color:var(--accent);color:var(--accent2);background:var(--accent-soft)}
.scrim{display:none}
/* 桌面端：收起侧栏 */
@media (min-width:981px){
  body.nav-off .side{transform:translateX(-100%);box-shadow:22px 0 46px rgba(22,32,47,.14)}
  body.nav-off .main{margin-left:0}
}
/* 悬浮的“显示全部答案” */
.fab{position:fixed;right:24px;bottom:24px;z-index:46;transition:bottom .22s}
.fab .switch{padding:9px 15px 9px 11px;font-size:12.5px;color:var(--ink);font-weight:600;
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  box-shadow:0 10px 26px rgba(22,32,47,.15),0 2px 6px rgba(22,32,47,.05)}
.fab .switch:hover{border-color:var(--accent);color:var(--accent2)}
.fab .switch[aria-pressed="true"]{background:var(--accent-soft);border-color:#bcc9f0;color:var(--accent2)}
body.has-player .fab{bottom:92px}
@media (max-width:760px){
  .fab{right:14px;bottom:16px}
  body.has-player .fab{bottom:82px}
  .fab .switch{padding:8px 12px 8px 10px;font-size:12px}
}
@media (max-width:560px){
  .voicetag{display:none}          /* 课首已有语音 chip，窄屏不重复占位 */
  .crumb{font-size:12px}
}

.wrap{width:100%;padding:30px 40px 40px;max-width:none}
@media (min-width:1600px){ .wrap{padding:36px 56px 40px} }
@media (max-width:980px){
  .app{display:block}
  .main{margin-left:0}
  .side{position:fixed;z-index:60;left:0;top:0;width:280px;transform:translateX(-100%);
    transition:transform .25s;background:#fcfdff;box-shadow:0 0 40px rgba(0,0,0,.14)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(18,24,38,.34);z-index:55}
  .topbar{padding:9px 14px;gap:8px;flex-wrap:wrap}
  .menubtn{display:grid}
  .wrap{padding:20px 16px 30px}
  .voicetag{max-width:46vw;font-size:11.5px;padding:4px 9px}
  .crumb{font-size:12.5px}
}

/* ---------- 课首 ---------- */
/* ---------- 目录首页 ---------- */
body.onhome #lessonnavbox{display:none}
body.onhome .fab{display:none}
.homebtn{
  width:100%;display:flex;align-items:center;gap:9px;margin:0 0 14px;padding:9px 12px;
  border:1px solid var(--line2);background:#fff;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:13.5px;color:var(--ink2);transition:.16s
}
.homebtn:hover{border-color:var(--accent);color:var(--accent2);background:var(--accent-soft)}
.homebtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.homebtn svg{width:13px;height:13px;fill:currentColor;flex:0 0 auto}
.brand{cursor:pointer}

.home-hero{
  position:relative;overflow:hidden;border:1px solid #dfe6f4;border-radius:22px;padding:34px 38px 30px;
  background:linear-gradient(135deg,#eef3ff 0%,#f7f9fe 52%,#fdfdff 100%);
  box-shadow:0 10px 30px rgba(22,32,47,.06);margin-bottom:34px
}
.home-hero::after{
  content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(53,87,201,.10),rgba(53,87,201,0) 70%)
}
.home-brand{display:flex;gap:26px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.home-logo{
  height:88px;width:auto;background:#fff;border:1px solid var(--line2);border-radius:16px;
  padding:8px 14px;box-shadow:0 6px 18px rgba(22,32,47,.08);flex:0 0 auto
}
.home-titles{min-width:0;flex:1 1 320px}
.home-kicker{font-size:13px;letter-spacing:2.2px;text-transform:uppercase;color:var(--accent);font-weight:700}
.home-title{
  font-family:var(--serif);font-size:clamp(26px,3.4vw,38px);line-height:1.22;margin:8px 0 10px;font-weight:600;
  letter-spacing:-.3px;color:var(--ink)
}
.home-sub{margin:0;font-size:14.5px;line-height:1.9;color:var(--ink2);max-width:64ch}
.home-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;position:relative;z-index:1}
.home-stats .stat{
  display:flex;align-items:baseline;gap:7px;background:rgba(255,255,255,.86);border:1px solid #e2e8f4;
  border-radius:999px;padding:7px 16px
}
.home-stats .stat b{font-family:var(--serif);font-size:20px;color:var(--accent2);font-weight:700}
.home-stats .stat span{font-size:13.5px;color:var(--muted)}

.home-sec{margin-bottom:30px}
.home-sechead{
  display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--accent);margin:0 0 14px
}
.home-sechead .line{flex:1;height:1px;background:linear-gradient(90deg,#cfd9f2,transparent)}
.home-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.ucard{
  position:relative;display:block;text-decoration:none;color:inherit;overflow:hidden;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px 18px;
  transition:.2s;box-shadow:0 1px 2px rgba(22,32,47,.03)
}
.ucard:hover{border-color:#bcc9f0;transform:translateY(-3px);box-shadow:0 12px 28px rgba(22,32,47,.09)}
.uc-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.uc-no{
  font-family:var(--serif);font-size:13.5px;font-weight:700;letter-spacing:.6px;color:#fff;background:var(--accent);
  border-radius:9px;padding:5px 11px;flex:0 0 auto;font-variant-numeric:tabular-nums
}
.uc-book{font-size:12.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:700}
.uc-t{font-family:var(--serif);font-size:21px;line-height:1.35;margin:0 0 6px;font-weight:600;color:var(--ink)}
.uc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.uc-meta span{font-size:12.5px;color:var(--ink2);background:#f2f5fc;border-radius:6px;padding:3px 9px}
.uc-go{display:flex;align-items:center;gap:7px;margin-top:15px;font-size:13.5px;font-weight:600;color:var(--accent2)}
.uc-go i{font-style:normal;transition:transform .2s}
.ucard:hover .uc-go i{transform:translateX(5px)}

.home-tips{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:24px 26px;margin-top:6px}
.home-tips h4{font-family:var(--serif);font-size:18px;margin:0 0 14px;font-weight:600}
.tipgrid{display:grid;gap:18px 24px;grid-template-columns:repeat(2,minmax(0,1fr))}
.tip{border-left:2px solid var(--accent);padding-left:13px}
.tip b{display:block;font-size:13.5px;margin-bottom:5px;color:var(--ink)}
.tip p{margin:0;font-size:13.5px;line-height:1.85;color:var(--muted)}
.footer{margin:34px 0 8px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.9}
@media (max-width:820px){
  .home-hero{padding:24px 20px}
  .home-logo{height:66px}
  .home-grid{grid-template-columns:1fr}
  .tipgrid{grid-template-columns:1fr}
}

/* ---------- 课首 ---------- */
.hero{margin:4px 0 26px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin-bottom:12px}
.eyebrow .line{flex:1;height:1px;background:linear-gradient(90deg,#c9d5f5,transparent)}
.hero h2{font-family:var(--serif);font-size:clamp(26px,3.6vw,38px);line-height:1.25;margin:0 0 8px;font-weight:600;letter-spacing:-.3px}
.hero .sub{color:var(--muted);font-size:13.5px;margin:0}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.chip b{color:var(--accent2)}

/* ---------- 区块 ---------- */
.sec{margin:34px 0 0;scroll-margin-top:76px}
.sechead{display:flex;align-items:baseline;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.sechead .sn{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--accent);
  background:var(--accent-soft);border-radius:6px;padding:3px 8px}
.sechead h3{font-size:17.5px;margin:0;font-weight:700;letter-spacing:.2px}
.sechead .sen{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.sechead .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;border:1px solid var(--line2);
  background:#fff;color:var(--ink2);border-radius:999px;padding:6px 13px;cursor:pointer;transition:.16s}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);color:#fff}
.btn.small{padding:4px 11px;font-size:12.5px}
.btn svg{width:10px;height:11px;fill:currentColor}
.note{font-size:12.5px;color:var(--muted)}

/* ---------- 畅所欲言 ---------- */
.warm{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;
  box-shadow:0 1px 2px rgba(22,32,47,.03)}
.warm .wp{display:flex;gap:10px;font-size:14.5px;line-height:1.9;color:var(--ink);margin:6px 0}
.warm .wp .n{flex:0 0 auto;color:var(--accent);font-weight:700;font-size:13px;padding-top:4px;min-width:14px}
.warm .opts{margin:8px 0 4px;display:grid;gap:6px;max-width:460px}
.warm .opt{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.75;color:var(--ink2);
  width:fit-content;min-width:190px;max-width:100%}
.warm .opt .k{flex:0 0 auto;width:19px;height:19px;border-radius:5px;border:1px solid var(--line2);background:#f7f9fd;
  font-size:11.5px;font-weight:700;color:var(--muted);display:grid;place-items:center;margin-top:2px}
.warm .opt .tx{flex:0 1 auto}
.warm .opt .bx{flex:0 0 auto;width:17px;height:17px;border:1.5px solid var(--line2);border-radius:4px;margin-top:3px;margin-left:6px;cursor:pointer;display:grid;place-items:center;font-size:12px;color:var(--accent);transition:.15s}
.warm .opt .bx:hover{border-color:var(--accent);background:var(--accent-soft)}
.warm .opt .bx.ticked{border-color:var(--accent);background:var(--accent-soft)}
.warm .opt .bx.ticked::after{content:'✓';font-weight:700}
.warm .wtab{width:100%;border-collapse:collapse;margin:10px 0 2px;font-size:13.5px}
.warm .wtab th,.warm .wtab td{border:1px solid var(--line);padding:8px 10px;text-align:left;color:var(--ink2)}
.warm .wtab th{background:#f7f9fd;font-weight:600;color:var(--ink)}
.warm .wpair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 30px;margin:10px 0 6px;max-width:440px}
.warm .wpair .pc{display:flex;gap:9px;align-items:center;font-size:14.5px;line-height:2;color:var(--ink)}
.warm .wpair .pc .i{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);background:#f7f9fd;
  color:var(--muted);font-size:10.5px;display:grid;place-items:center;font-family:var(--sans)}
@media (max-width:560px){ .warm .wpair{gap:2px 16px;max-width:none} }

/* ---------- 词汇 ---------- */
.vtable{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.vrow{display:grid;grid-template-columns:1.15fr .95fr .6fr 1.9fr;gap:12px;padding:11px 18px;
  border-top:1px solid #f0f3f9;font-size:14px;align-items:baseline}
.vrow:first-child{border-top:0;background:#f7f9fd;font-size:12px;letter-spacing:1px;color:var(--muted);
  font-weight:700;text-transform:uppercase;padding:9px 18px}
.vrow .w{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink)}
.vrow .p{color:var(--muted);font-size:13px}
.vrow .pos{color:var(--accent2);font-size:12.5px}
.vrow .def{color:var(--ink2);font-size:13.5px}
.rd{cursor:pointer;border-radius:6px;transition:background .14s,box-shadow .14s}
.rd:hover{background:#f3f6ff;box-shadow:0 0 0 4px #f3f6ff}
.rd.reading{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft);color:var(--accent2)}
#warm-read .ic-stop{display:none}
#warm-read.primary .ic-play{display:none}
#warm-read.primary .ic-stop{display:inline}
.vrow .w.rd:hover{color:var(--accent2)}

/* ---------- 课文 ---------- */
.paras{display:grid;gap:10px}
.para{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:0 14px;align-items:start;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 16px 16px 14px;
  transition:.18s;position:relative;overflow:hidden}
.para:hover{border-color:var(--line2);box-shadow:0 4px 14px rgba(22,32,47,.05)}
.para::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.2s}
.para.playing{border-color:#c3d0f2;background:linear-gradient(90deg,#f3f6ff,rgba(243,246,255,0) 72%);
  box-shadow:0 6px 20px rgba(53,87,201,.10)}
.para.playing::before{background:var(--accent)}
.pno{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;padding-top:4px;
  font-variant-numeric:tabular-nums}
.para.playing .pno{color:var(--accent)}
.ptext{font-family:var(--serif);font-size:calc(17px*var(--fs));line-height:1.95;letter-spacing:.2px;
  color:var(--ink);margin:0;cursor:pointer}
.para.ishead{background:#fbfcff;border-style:dashed}
.ptext.ptitle{font-weight:700;font-size:calc(18px*var(--fs));letter-spacing:.3px}
.pbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:#fff;cursor:pointer;
  display:grid;place-items:center;padding:0;transition:.16s;flex:0 0 auto;margin-top:1px}
.pbtn svg{width:11px;height:11px;fill:var(--accent)}
.pbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.para.playing .pbtn{background:var(--accent);border-color:var(--accent)}
.para.playing .pbtn svg{fill:#fff}

/* ---------- 练习 ---------- */
.exsec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(22,32,47,.03)}
.exhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.exhead h4{font-family:var(--serif);font-size:16.5px;margin:0;font-weight:600}
.exhead .tag{font-size:11.5px;color:var(--accent2);background:var(--accent-soft);border-radius:6px;padding:2px 8px;letter-spacing:.5px}
.exinstr{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.7}
.items{list-style:none;margin:14px 0 0;padding:0;counter-reset:it}
.items>li{position:relative;padding:11px 0 11px 32px;border-top:1px solid #f0f3f9;font-size:15px;line-height:1.8}
.items>li:first-child{border-top:0}
.items>li::before{counter-increment:it;content:counter(it);position:absolute;left:0;top:12px;width:21px;height:21px;
  border-radius:6px;background:#f0f3f9;color:var(--muted);font-size:12px;display:grid;place-items:center;font-weight:700}
.q{font-family:var(--serif);font-size:15.5px;line-height:1.85;color:var(--ink)}
.q .blank{margin-left:4px}
.ask{margin-top:6px;font-size:13px;color:var(--muted);border-left:2px solid #e2e8f3;padding-left:10px;line-height:1.7;font-family:var(--sans)}

/* 空白 / 答案 */
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:2.9em;height:1.45em;
  border-bottom:1.5px dashed #b9c3d8;margin:0 3px;cursor:pointer;color:transparent;font-size:.95em;
  vertical-align:baseline;border-radius:4px 4px 0 0;transition:.16s;position:relative;padding:0 4px;user-select:none}
.blank:hover{background:#f6f8ff;border-bottom-color:var(--accent)}
.blank.on{color:var(--amber);border-bottom-color:var(--amber-line);background:var(--amber-soft);
  font-weight:600;animation:pop .22s ease}
.blank.tf{min-width:1.9em}
.blank.multi{min-width:1.9em}
.blank.mc{min-width:1.9em;font-family:var(--sans);font-weight:700}
/* 多选题里 × 表示“课文未提及”，用灰色区分于选中的 √ */
.blank.multi.on[data-a="×"]{color:#8a93a6;background:#f1f3f8;border-bottom-color:#c3cbd9}
/* 无法逐格给出答案时：虚线框仅作留白，不可点击 */
.blank.ghost{cursor:default;border-bottom-style:dotted;border-bottom-color:#cfd6e4;color:transparent}
.blank.ghost:hover{background:transparent;border-bottom-color:#cfd6e4}
.blank.cand{min-width:auto;padding:0 .3em;color:#6b7690;border-bottom-style:dotted;border-bottom-color:#b9c4d8;letter-spacing:.02em}
.blank.cand:hover{color:#3a465e}
.blank.cand.on{color:var(--amber);letter-spacing:0}
.ahl{color:var(--amber);font-weight:600;background:var(--amber-soft);border-radius:4px;padding:0 2px}
/* 填表题单元格 */
.ftab{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.ftab th,.ftab td{border:1px solid #e6ebf5;padding:9px 11px;text-align:left;line-height:1.7;vertical-align:top}
.ftab th{background:#f7f9fd;font-weight:600;color:var(--ink);font-size:13.5px}
.ftab td:first-child,.ftab th:first-child{background:#fbfcfe;font-weight:600;white-space:nowrap}
.ftab td .blank{min-width:4em;margin:0}
/* 参考答案（原文照录） */
.rawans{margin-top:12px;padding-top:12px;border-top:1px dashed #e2e8f4}
.rawq{margin-top:12px;font-size:14.5px;line-height:1.95;color:var(--ink2)}
.rawq .rl{padding:1px 0}
.rawq.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 20px}
.rawq.cols .rqh{grid-column:1/-1;margin-bottom:4px;color:var(--ink)}
.rawans .rawtog{padding:6px 12px;font-size:12.5px}
.rawbody{display:none;margin-top:10px;padding:12px 14px;background:var(--amber-soft);border:1px solid var(--amber-line);
  border-radius:10px;font-size:14px;line-height:1.95;color:var(--ink2)}
.rawans.on .rawbody{display:block}
.rawbody .rl{padding:2px 0}
.rawbody .rl+.rl{border-top:1px solid rgba(214,163,90,.18)}
@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}

/* 选择题 */
.opts{display:grid;gap:5px;margin-top:8px}
.optline{display:flex;gap:9px;font-size:14.5px;line-height:1.75;color:var(--ink2);border-radius:8px;padding:2px 4px}
.optline .k{flex:0 0 auto;font-weight:700;color:var(--muted);font-size:13.5px;min-width:16px}
.optline.correct{background:var(--ok-soft);color:var(--ok);font-weight:600}
.optline.correct .k{color:var(--ok)}
.ansline{margin-top:9px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ansline .lab{letter-spacing:.5px}
.ansline .derived{font-size:11.5px;color:#b07a2a;background:var(--amber-soft);border-radius:5px;padding:1px 6px}

/* 句式练习 */
.groups{display:grid;gap:12px;margin-top:12px}
.grp{border:1px solid #eef2f9;border-radius:11px;padding:12px 14px;background:#fbfcfe}
.grp .gno{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:6px}
.grp ol{margin:0;padding-left:20px}
.grp li{font-family:var(--serif);font-size:15px;line-height:1.9;color:var(--ink2);margin:2px 0}
.grp .src{margin-top:7px;font-size:12.5px;color:var(--muted);line-height:1.7;border-left:2px solid #e2e8f3;padding-left:9px;font-family:var(--sans)}

/* 连线 */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.mcol{display:grid;gap:7px}
.mitem{display:flex;align-items:center;gap:8px;font-size:14.5px;line-height:1.7;background:#fbfcfe;
  border:1px solid #eef2f9;border-radius:9px;padding:7px 11px}
.mitem .t{flex:1}
.mitem .blank{min-width:4.5em}
.mitem.right{color:var(--ink2)}
.mtable{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
.mtable td{border:1px solid var(--line);padding:8px 10px;vertical-align:top}
.mtable td:first-child{background:#f7f9fd;width:42%;color:var(--ink)}

/* 词库 */
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 2px;padding:11px 13px;background:#f7f9fd;
  border:1px dashed #d6dfef;border-radius:11px}
.bank span{font-family:var(--serif);font-size:14px;color:var(--ink2);background:#fff;border:1px solid var(--line);
  border-radius:7px;padding:2px 10px}

/* ---------- 播放器 ---------- */
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;
  align-items:center;gap:14px;padding:10px 22px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  box-shadow:0 -6px 24px rgba(22,32,47,.06)
}
.player.show{display:flex}
.pmain{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;
  display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 16px rgba(53,87,201,.28);transition:.16s}
.pmain:hover{background:var(--accent2)}
.pmain svg{width:16px;height:16px;fill:#fff}
.pnav{width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:#fff;cursor:pointer;
  display:grid;place-items:center;color:var(--ink2);flex:0 0 auto}
.pnav:hover{border-color:var(--accent);color:var(--accent2)}
.pnav svg{width:12px;height:12px;fill:currentColor}
.pinfo{flex:0 0 auto;min-width:118px}
.pinfo .t1{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.pinfo .t2{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.pbar{flex:1;height:5px;border-radius:999px;background:#e8edf7;overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7a94ea);border-radius:999px;transition:width .3s}
.prate{display:flex;gap:4px;flex:0 0 auto}
.prate button{border:1px solid var(--line2);background:#fff;border-radius:7px;font-family:inherit;font-size:12px;
  color:var(--ink2);padding:4px 8px;cursor:pointer}
.prate button.on{background:var(--accent-soft);border-color:#bcc9f0;color:var(--accent2);font-weight:600}
.pwave{flex:0 0 auto;display:flex;align-items:flex-end;gap:2px;height:22px}
.pwave i{width:3px;background:#c9d4ee;border-radius:2px;height:30%}
.pwave i:nth-child(2){height:60%}.pwave i:nth-child(3){height:95%}.pwave i:nth-child(4){height:45%}
.pwave i:nth-child(5){height:75%}.pwave i:nth-child(6){height:35%}.pwave i:nth-child(7){height:65%}
.player.playing .pwave i{animation:wv .9s ease-in-out infinite}
.player.playing .pwave i:nth-child(2){animation-delay:.1s}
.player.playing .pwave i:nth-child(3){animation-delay:.2s}
.player.playing .pwave i:nth-child(4){animation-delay:.3s}
.player.playing .pwave i:nth-child(5){animation-delay:.15s}
.player.playing .pwave i:nth-child(6){animation-delay:.25s}
.player.playing .pwave i:nth-child(7){animation-delay:.05s}
@keyframes wv{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1.15)}}
@media (max-width:760px){
  .player{padding:8px 12px;gap:9px}
  .pinfo{min-width:82px}
  .prate{display:none}
  .pwave{display:none}
}
@media (max-width:980px){
  .vrow{grid-template-columns:1.05fr .85fr 1.5fr;gap:8px;padding:10px 12px}
  .vrow .pos{display:none}
  .vrow:first-child span:nth-child(3){display:none}
  .vrow .def{font-size:12.5px}
  .hero h2{font-size:24px}
  .sechead .right{width:100%;margin-left:0}
  .warm .opt .tx{flex:1 1 auto}
}
@media print{
  .side,.topbar,.player,.fab{display:none!important}
  .app{display:block}
  .main{margin-left:0}
  .wrap{padding:0}
  .blank{color:var(--ink);border-bottom:0}
}
</style>
</head>

<script id="data" type="application/json">[{"no":1,"title":"还是回来好","warm":{"blocks":[{"t":"p","n":"1","text":"你了解中国农村吗？"},{"t":"p","n":"2","text":"请就你了解的中国农村生活，在你认为合适的选项后面画√。"},{"t":"opt","k":"A","text":"鸟语花香，景色优美。"},{"t":"opt","k":"B","text":"空气新鲜。"},{"t":"opt","k":"C","text":"干活很累，收入不多。"},{"t":"opt","k":"D","text":"不能上网。"},{"t":"opt","k":"E","text":"生活单调，没意思。"},{"t":"opt","k":"F","text":"干活比较累，收入还行。"},{"t":"opt","k":"G","text":"教育水平较低。"},{"t":"opt","k":"H","text":"吃东西方便，吃的东西健康、便宜。"},{"t":"opt","k":"I","text":"其他，请写下来："},{"t":"p","n":"3","text":"根据大家的选择讨论：中国农村的生活到底怎么样？"}],"table":null},"vocab":[{"w":"记忆","p":"jìyì","pos":"（名）","def":"memory"},{"w":"亲戚","p":"qīnqi","pos":"（名）","def":"relative"},{"w":"读书","p":"dúshū","pos":"（动）","def":"to study, to attend school"},{"w":"整天","p":"zhěngtiān","pos":"（名）","def":"whole day, all day long"},{"w":"梦想","p":"mèngxiǎng","pos":"（动）","def":"to dream"},{"w":"从……起……","p":"cóng……qǐ……","pos":"","def":"from...on, since"},{"w":"偶尔","p":"ǒu'ěr","pos":"（副）","def":"occasionally, once in a while"},{"w":"毕业","p":"bìyè","pos":"（动）","def":"to graduate"},{"w":"榜样","p":"bǎngyàng","pos":"（名）","def":"example, model"},{"w":"养鸡场","p":"yǎng jī chǎng","pos":"","def":"chicken farm"},{"w":"村民","p":"cūnmín","pos":"（名）","def":"villager"},{"w":"议论","p":"yìlùn","pos":"（动）","def":"to talk to comment"},{"w":"纷纷","p":"fēnfēn","pos":"（形）","def":"numerous and confused, profuse"},{"w":"一心一意","p":"yì xīn yí yì","pos":"（成）","def":"wholeheartedly"},{"w":"后悔","p":"hòuhuǐ","pos":"（动）","def":"to regret"}],"text":["我的家在农村。在我的记忆中，我们家人都是农民，我爷爷奶奶是农民，爸爸妈妈还是农民，我们家的亲戚朋友也是农民。我们村读书最多的是小学的王老师，一共读了九年书。爸妈整天对我和哥哥说：\"长大了好好读书，考上大学，就变成城里人了。\"","变成城里人，是我和哥哥的梦想，是爸爸妈妈、爷爷奶奶的梦想，也是我们那儿所有人的梦想。我和哥哥从上学的第一天起，就为实现这个伟大的梦想努力学习。","哥哥从小学习好是有名的，每次考试不是第一就是第二，偶尔失败，也就是第三名，一直到大学毕业，哥哥都是我们那里孩子学习的榜样。","大家一直以为，哥哥大学毕业以后当然会留在城市工作，要不然辛辛苦苦读那么多年书干什么？可谁都没想到，哥哥大学一毕业就回了家，自己办起了养鸡场。村民们都很吃惊：辛辛苦苦读完了大学，为什么不在城市工作，还要回到农村呢？大家议论纷纷，说什么的都有。对所有的议论，哥哥就像没听见一样，什么话也不说，一心一意办他的养鸡场。","哥哥的鸡场越办越好，第一年收回了成本，第二年开始赚钱，一些村民也成了养鸡场的工人，虽然挣钱不是很多，却不用跑到很远的地方去找工作，在家就能挣钱，还能照顾家、照顾孩子。后来，又有村民来找哥哥，想跟他学养鸡，也办养鸡场。哥哥对他们特别热情，教得特别认真。","大家的议论慢慢变了，说大学毕业生还是回来好，像哥哥这样的大学生，毕业以后没有忘记农村，比那些读了书就再也不回头的农村孩子好多了。","我问哥哥，读完大学又回到农村不后悔吗？哥哥对我说：小时候是想离开农村，考大学的时候才认真地想将来干什么。他觉得，如果上了学都不回来了，农村什么时候才能发展起来呀？农村需要知识，需要文化。有知识、有文化的年轻人，在农村应该要有发展。这时候我才明白，哥哥为什么上了农业大学。我觉得哥哥说得对。"],"comp":[{"q":"村民一开始为什么对哥哥大学毕业回家这件事感到吃惊？","opts":[{"k":"A","t":"哥哥学习成绩一直很差，大家以为他不能顺利毕业"},{"k":"B","t":"大家觉得辛苦读大学的目的就是留在城市工作"},{"k":"C","t":"哥哥没有提前告诉家人自己要回家创业"},{"k":"D","t":"大家担心哥哥办养鸡场会赔掉所有钱"}],"a":"B","derived":true},{"q":"哥哥回到农村之后做了什么事情？","opts":[{"k":"A","t":"在村里的小学当老师，教大家读书识字"},{"k":"B","t":"建立养鸡场，还热心教村民养鸡技术"},{"k":"C","t":"劝说村里年轻人都不要去城里打工"},{"k":"D","t":"帮村里向外界筹集资金发展旅游业"}],"a":"B","derived":true},{"q":"哥哥选择回到农村发展最主要的想法是什么？","opts":[{"k":"A","t":"在城市很难找到合适的工作，只能回乡"},{"k":"B","t":"父母强烈要求他回到家乡照顾家人"},{"k":"C","t":"农村需要知识文化，年轻人可以在农村发展"},{"k":"D","t":"他不喜欢城市里快节奏的生活方式"}],"a":"C","derived":true},{"q":"村民后来对哥哥的看法发生了怎样的变化？","opts":[{"k":"A","t":"认为大学毕业生回乡发展是一件很好的事"},{"k":"B","t":"觉得哥哥赚的钱太少，不值得"},{"k":"C","t":"认为哥哥不应该把养鸡技术教给其他人"},{"k":"D","t":"觉得哥哥的做法不会帮助农村发展"}],"a":"A","derived":true},{"q":"根据课文内容，下面哪一项说法是正确的？","opts":[{"k":"A","t":"哥哥考试永远都是第一名，从来没有得过第三名"},{"k":"B","t":"哥哥的养鸡场第二年就收回成本，开始赚钱"},{"k":"C","t":"在哥哥的养鸡场工作的村民，可以在家挣钱照顾家庭"},{"k":"D","t":"哥哥小时候就下定决心，大学毕业后一定要回农村"}],"a":"C","derived":true}],"exercises":[{"type":"pattern","title":"一、句式练习：整天；不是……就是……；偶尔；要不然；什么……也/都……","groups":[{"no":"第一组","sentences":["那时候，我喜欢文学，整天幻想着当作家。","他整天忙着给病人看病，没有建立自己的家庭。","抽时间去健身，比整天玩儿游戏强多了。"],"src":"课文例句：爸妈整天对我和哥哥说:\"长大了好好读书，考上大学，就变成城里人了。\""},{"no":"第二组","sentences":["他每天这会儿不是在教室就是在图书馆。","不是你去就是我去，咱俩谁去都行，听你的。","他们那个旅行团不是今天走就是明天走，反正就是这两天。"],"src":"课文例句：哥哥从小学习好是有名的，每次考试不是第一就是第二，......"},{"no":"第三组","sentences":["我们除了偶尔打几下乒乓球外，很少参加体育活动。","他的电话常常打不通，偶尔打通了，也只说几句话。","四月份偶尔出现高温天气是正常的。"],"src":"课文例句：哥哥从小学习好是有名的，每次考试不是第一就是第二，偶尔失败，也就是第三名。"},{"no":"第四组","sentences":["我们得坐出租车去，要不然该迟到了。","谢谢你提醒我，要不然我还不会去买票呢。","你可以把它当包裹寄走，要不然就得自己送去。"],"src":"课文例句：哥哥大学毕业以后当然会留在城市工作，要不然辛辛苦苦读那么多年书干什么?"},{"no":"第五组","sentences":["他病了，什么东西也不 记忆**)中，我们家人都是农民，我爷爷奶奶是农民，爸爸妈妈还是农民，我们家(**亲戚**)朋友也是农民。","问:用最简单的话说一说这句话是什么意思。","2.变成城里人，是我和哥哥的(**梦想**)，是爸爸妈妈、爷爷奶奶的梦想，也是我们那儿(**所有人**)的梦想。","问:用最简单的话说一说这句话是什么意思。","3.哥哥大学一(**毕业**)就回了家，自己办起了养鸡场。村民们都很(**吃惊**):辛辛苦苦读完了大学，为什么不在城市工作，还要回到农村呢?","问:村民们为什么吃惊?","4.哥哥的鸡场越办越好，第一年收回了成本，第二年开始(**赚钱**)，一些村民也(**成了**)养鸡场的工人，虽然挣钱不是很多，却不用(**跑到**)很远的地方去找工作，在家就能挣钱，还能照顾家、照顾孩子。","问:用最简单的话说一说哥哥的养鸡场的情况。","5.大家的(**议论**)慢慢变了，说大学毕业生还是回来好，像哥哥这样的大学生，毕业以后没有忘了农村，比那些读了书就再也(**不回头**)的农村孩子好多了。","问:如今村民们是怎么想的?"]}},{"type":"fill","title":"七、选词填空","items":[{"n":1,"q":"最近天气特别不好,（　　）刮风（　　）下雨。","extra":[],"text":"最近天气特别不好,（　　）刮风（　　）下雨。"},{"n":2,"q":"我只想随便逛逛,（　　）东西（　　）不想买。","extra":[],"text":"我只想随便逛逛,（　　）东西（　　）不想买。"},{"n":3,"q":"我们得提前买票,（　　）就买不到卧铺了。","extra":[],"text":"我们得提前买票,（　　）就买不到卧铺了。"},{"n":4,"q":"我看他（　　）日本人（　　）韩国人，反正不是中国人。","extra":[],"text":"我看他（　　）日本人（　　）韩国人，反正不是中国人。"},{"n":5,"q":"工作很忙的他（　　）回家看看父母，父母高兴得像孩子一样。","extra":[],"text":"工作很忙的他（　　）回家看看父母，父母高兴得像孩子一样。"},{"n":6,"q":"她（　　）都在忙，可是很快乐。","extra":[],"text":"她（　　）都在忙，可是很快乐。"},{"n":7,"q":"他最近怎么了?（　　）不高兴。","extra":[],"text":"他最近怎么了?（　　）不高兴。"},{"n":8,"q":"他以为生了大病，结果（　　）事（　　）没有。","extra":[],"text":"他以为生了大病，结果（　　）事（　　）没有。"},{"n":9,"q":"肯定是小梅告诉他的,（　　）他怎么知道?","extra":[],"text":"肯定是小梅告诉他的,（　　）他怎么知道?"},{"n":10,"q":"他（　　）只吃不运动，很快就变胖了。","extra":[],"text":"他（　　）只吃不运动，很快就变胖了。"}],"bank":["整天","不是……就是……","偶尔","要不然","什么……也……"],"ans":{"kind":"blanks","vals":[["不是","就是"],["什么","也"],["要不然"],["不是","就是"],["偶尔"],["整天"],["整天"],["什么","也"],["要不然"],["整天"]],"raw":["整天 不是……就是…… 偶尔 要不然 什么……也……","1.最近天气特别不好,(**不是**)刮风(**就是**)下雨。","2.我只想随便逛逛,(**什么**)东西(**也**)不想买。","3.我们得提前买票,(**要不然**)就买不到卧铺了。","4.我看他(**不是**)日本人(**就是**)韩国人，反正不是中国人。","5.工作很忙的他(**偶尔**)回家看看父母，父母高兴得像孩子一样。","6.她(**整天**)都在忙，可是很快乐。","7.他最近怎么了?(**整天**)不高兴。","8.他以为生了大病，结果(**什么**)事(**也**)没有。","9.肯定是小梅告诉他的,(**要不然**)他怎么知道?","10.他(**整天**)只吃不运动，很快就变胖了。"]}}]},{"no":2,"title":"一切都可能改变","warm":{"blocks":[{"t":"p","n":"1","text":"你有写日记的习惯吗？"},{"t":"p","n":"2","text":"参考以下选项谈一谈写日记有什么好处和坏处。"},{"t":"opt","k":"A","text":"能让我们知道过去我们在干什么。"},{"t":"opt","k":"B","text":"帮助我们发现生活。"},{"t":"opt","k":"C","text":"能帮助我们回忆，即使忘了也不要紧。"},{"t":"opt","k":"D","text":"能让人思考生活，思考人生。"},{"t":"opt","k":"E","text":"有利于心理健康。"},{"t":"opt","k":"F","text":"可能被别人偷看。"},{"t":"opt","k":"G","text":"如果有坏事发生，写日记容易让人一直记着坏事，导致心情不好。"},{"t":"note","text":"其他，请写下来：________"},{"t":"p","n":"3","text":"你同意“什么年龄的人都有自己的痛苦”这句话吗？下面的痛苦可能发生在什么年龄？跟同伴讨论一下，你们的感觉一样吗？"}],"table":{"head":["痛苦","年龄"],"rows":[["最喜欢的玩具坏了"],["作业太多"],["考试成绩不好"],["父母批评你"],["你喜欢的人不喜欢你"],["跟男/女朋友分手"],["老板批评你"],["工资低"],["你的孩子让你不满意"],["你的父母身体不好"]]}},"vocab":[{"w":"整理","p":"zhěnglǐ","pos":"（动）","def":"to put in order, to sort out"},{"w":"随手","p":"suíshǒu","pos":"（副）","def":"conveniently, without extra trouble"},{"w":"公布","p":"gōngbù","pos":"（动）","def":"to announce, to make public"},{"w":"万万","p":"wànwàn","pos":"（副）","def":"(used in the negative) absolutely"},{"w":"忍不住","p":"rěn bu zhù","pos":"","def":"cannot help (doing sth.)"},{"w":"难怪","p":"nánguài","pos":"（副）","def":"understandable, pardonable"},{"w":"亲","p":"qīn","pos":"（形）","def":"next of kin"},{"w":"惊讶","p":"jīngyà","pos":"（形）","def":"surprised, amazed, astonished"},{"w":"当年","p":"dāngnián","pos":"（名）","def":"in those years or days"},{"w":"难忘","p":"nánwàng","pos":"（形）","def":"unforgettable, memorable"},{"w":"好笑","p":"hǎoxiào","pos":"（形）","def":"funny, laughable, ridiculous"},{"w":"模模糊糊","p":"móhúhú","pos":"（形）","def":"not clear, vague"},{"w":"身影","p":"shēnyǐng","pos":"（名）","def":"person's silhouette, figure"},{"w":"美好","p":"měihǎo","pos":"（形）","def":"fine, pleasant"}],"text":["小丽整理以前的东西，发现几本过去的日记，她随手拿起一方本翻看\" 今天，老师公布了考试成绩，我万万没有想到，我竟然考了了第五名。这是我上学以来第一次没有考第一，我难过地哭了，晚饭也没有吃，我要永远记住这一天，这是我一生最大的失败和痛苦。\"","看到这里，小丽忍不住笑了。她已经不记得当时的情景了。也难怪，自从离开学校以后，这十几年经历的失败与痛苦，哪一个不比当年没有考第一一更重呢？","翻过这一页，再继续往下看。\"","今天，我非常难过。我不知道妈妈为什么那样做！她究竟是是不是我的亲妈妈？我真想离开她，离开这个家。过几天就要选择大学了，我要去外地上大学，离家远远的，我走了以后再也不回这个家！\"","看到这儿，小丽有些惊讶，努力回忆当年妈妈做了什么事让自己那么伤心难过，但是怎么也想不起来。又翻了几页，都是一些现在看来根本不算什么事，可是在当时却感到 \" 非常难过 \"、\" 非常痛苦 \"或是\" 非常难忘 \" 的事。","看了觉得很好笑，小丽放下这本日记，又拿起另一本，翻开，只见上面写着: \"给我最爱的人 -- 你的爱，将陪伴我一生！我的爱，永远不会改变！\"","看了这一句，小丽的眼前模模糊糊地出现了一个男孩儿的身影。曾经以为他就是自己的全部生命，可是离开学校以后，他们就没有再见面，她不知道道那个男生现在在哪儿，在做什么。她只知道他的爱没有陪伴自己一生，而自己的爱，也早已已改变。","这个世界上，没有什么不可以改变的。美好、快乐的事情会改变，痛苦、烦恼的事情也会改变，曾经以为不可改变的事情，许多年后，你会发现，其实很多都改变了。而改变最多的，竟然是自己。","(选自威廉・贝纳德同名文章)"],"comp":[{"q":"小丽翻看第一本日记，看到当年考第五名的记录时，她的反应是什么？","opts":[{"k":"A","t":"再次感到十分难过，吃不下晚饭"},{"k":"B","t":"忍不住笑了，已经记不清当时的情景"},{"k":"C","t":"十分惊讶，努力回想这件事的细节"},{"k":"D","t":"内心很痛苦，觉得这是人生最大失败"}],"a":"B","derived":true},{"q":"当年写日记时，小丽因为和妈妈产生矛盾，产生了什么想法？","opts":[{"k":"A","t":"打算选择离家很远的大学，再也不回家"},{"k":"B","t":"打算和妈妈好好沟通，解开心里的误会"},{"k":"C","t":"打算放弃上大学，留在家里陪伴妈妈"},{"k":"D","t":"打算尽快搬出去，不再和妈妈见面"}],"a":"A","derived":true},{"q":"关于日记里那个男孩，下面哪一项符合文章内容？","opts":[{"k":"A","t":"毕业后他们一直保持联系，感情没变"},{"k":"B","t":"小丽现在还清楚知道男孩的工作地点"},{"k":"C","t":"曾经小丽以为男孩是自己全部的生命"},{"k":"D","t":"男孩兑现承诺，他的爱陪伴小丽一生"}],"a":"C","derived":true},{"q":"读完几本旧日记，文章表达的核心观点是？","opts":[{"k":"A","t":"只有痛苦的事情会随着时间发生改变"},{"k":"B","t":"世界上大部分事情都不会轻易发生改变"},{"k":"C","t":"很多曾经以为不变的事，多年后都会改变，自身变化最大"},{"k":"D","t":"过去的伤心事，多年之后依旧让人难以释怀"}],"a":"C","derived":true}],"exercises":[{"type":"pattern","title":"一、句式练习：整理；随手；万万；忍不住；难怪","groups":[{"no":"第一组","sentences":["他整理以前的东西的时候，找到一本日记。","上台以前，他又整理了一下衣服。","你的房间太乱了，该整理了。"],"src":"课文例句：小丽整理以前的东西，发现几本过去的日记。"},{"no":"第二组","sentences":["大家要有随手关灯的习惯，这样才不浪费电。","外边太冷了，请随手关门。","他随手记下了这个电话号码。"],"src":"课文例句：小丽整理以前的东西，发现几本过去的日记，她随手拿起一本翻看。"},{"no":"第三组","sentences":["他万万没想到，自己的考试会不及格。","明天的会议非常重要，万万不能迟到。","钱不是万能的，可是没有钱是万万不能的。"],"src":"课文例句：我万万没有想到，我竟然考了第五名。"},{"no":"第四组","sentences":["他的话挺好玩儿，我忍不住笑了起来。","听了这个消息，他忍不住流下眼泪。","他忍不住大声说:\"这不公平！\""],"src":"课文例句：看到这里，小丽忍不住笑了。"},{"no":"第五组","sentences":["难怪我找不到他，原来他上星期就回国了。","小李的活儿干得特别漂亮，难怪老板要给他涨工资呢。","地铁票只要两块钱，难怪坐地铁的人这么多。","小丽为什么失败。","小丽现在的生活。","小丽过去的日记。（　　）","小丽为什么要写日记。","读了日记以后,小丽的感想。（　　）"],"src":"课文例句：也难怪，自从离开学校以后，这十几年经历的失败与痛苦，哪一个不比当年没有考第一更重呢？"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"tf","title":"三、根据课文内容，判断正误","items":[{"n":1,"q":"小丽小时候学习不好。","extra":[],"text":"小丽小时候学习不好。"},{"n":2,"q":"她因为 声","p":"língshēng","pos":"（名）","def":"tinkling or ringing of a bell"},{"w":"忧郁","p":"yōuyù","pos":"（形）","def":"melancholy, heavy-hearted"},{"w":"柔和","p":"róuhé","pos":"（形）","def":"soft, gentle, mild"},{"w":"智商","p":"zhìshāng","pos":"（名）","def":"intelligence quotient"}],"text":["§1 哪天最容易出车祸?","在英国，星期五是一周内发生车祸最多的一天，占车祸总数的17%以上。为什么周五车祸发生最多?交通事故研究中心的人说:\"因为人们都想赶紧回家，一边开车一边计划怎么安排晚上和周末的时间。\"研究结果还显示，周五发生车祸的\"高峰时间\"是下午四点到五点。但在春天，事故却多发生在星期三。周三事故多的原因是春天容易有\"周三忧郁症\"，就是说到周三的时候，人们的心情都不太好。可能人们根本没想着开车，而是在回忆上个周末的晚会呢。另外一个原因是，春天的风景经常变化，特别容易让人分神。","§2 最讨厌的发明","美国人最近把闹钟评为他们最讨厌的发明之一，实际上，闹钟并不只是把我们从美梦中吵醒，它还会损害健康。一项研究发现，被闹钟突然吵醒的人比睡到自然醒的人血压更高，心跳更快，闹钟的铃声也会增加压力，压力会带来高血压、睡眠问题和精神忧郁。专家建议，睡觉时保持和闹钟之间的距离至少1米远，如果你必须上闹钟，请用柔和一些的音乐，或者用手机里好听的音乐。其实，最好的办法还是早睡早起，别让闹钟把自己吵醒。","§3 性格与智商有关吗?","性格和智商有关吗?最近，一所大学对381名年龄为19到89岁的人进行了研究，并把参加实验的人分成三组:60岁之前组，60岁以上组和高智商组。结果发现，在60岁以前，性格开朗、喜欢学习新东西的人最聪明。60岁以后，性格开朗和智商关系并不大。对老年人来说，那些喜欢讨论问题的人可能因为更多的思考而具有更高的智商。"],"comp":[{"q":"根据课文，英国周五车祸最多的主要原因是什么？","opts":[{"k":"A","t":"周五下午四点到五点光线变差，视线不好"},{"k":"B","t":"人们想着回家，开车时规划晚上和周末的安排"},{"k":"C","t":"周五人们心情低落，患上 “周三忧郁症”"},{"k":"D","t":"周末风景变化大，容易让司机开车时分神"}],"a":"B","derived":true},{"q":"关于闹钟对人的影响，下面哪一项说法正确？","opts":[{"k":"A","t":"闹钟吵醒人只会打断美梦，不会伤害身体健康"},{"k":"B","t":"被闹钟突然叫醒的人，血压比自然醒的人更高"},{"k":"C","t":"专家建议闹钟和人的距离最好保持半米以内"},{"k":"D","t":"柔和的闹钟音乐依然会直接造成精神忧郁"}],"a":"B","derived":true},{"q":"春天星期三车祸多发，文中没有提到哪个原因？","opts":[{"k":"A","t":"周三人们心情不太好，出现 “周三忧郁症”"},{"k":"B","t":"司机开车时回想上个周末的晚会，注意力不集中"},{"k":"C","t":"春季景色变化多，容易分散开车人的注意力"},{"k":"D","t":"周三下班高峰车流量比周五更大，更容易拥堵"}],"a":"D","derived":true},{"q":"这项关于性格与智商的研究，下列描述符合原文的是？","opts":[{"k":"A","t":"研究一共调查了 381 位 60 岁以上的老年人"},{"k":"B","t":"60 岁之后，性格开朗依旧和智商有很大关系"},{"k":"C","t":"60 岁以前，开朗、爱学习新事物的人智商更高"},{"k":"D","t":"老年人智商高低完全取决于是否喜欢讨论问题"}],"a":"C","derived":true},{"q":"文章三个部分，没有讨论下面哪一个主题？","opts":[{"k":"A","t":"一周内不同时间发生交通事故的规律与原因"},{"k":"B","t":"闹钟带来的健康危害以及专家给出的建议"},{"k":"C","t":"不同年龄段性格特点和智商之间的联系"},{"k":"D","t":"不同季节里，人们睡眠质量变化的相关研究"}],"a":"D","derived":true}],"exercises":[{"type":"pattern","  from a sum of money, etc.)"}],"text":["刘强大学毕业后来到广州工作。有一天，他迷路了。为了弄清楚自己的位置，刘强找到附近一家很有名的宾馆，拿出地图来想对照一下，没想到，这么有名的宾馆却在地图上找不到。","好不容易回到住处，已是夜里12点了。刘强躺在床上想，我要是做出一张地图，把全市所有的商业单位都标上，不就满足了人们的需要吗?","第二天，他赶紧把这一想法告诉他的几个大学同学，要是在地图上标出这些商业单位，让他们出入选地图的费用，那不是能赚大钱吗?","他把这一想法做成了一个方案，方案规定每个入选的商业单位出500元。","刘强拿出几份方案到广州几个商业单位去问他们的看法，他去的第一家就是当初迷路时在地图上找不到的那家宾馆。宾馆老板听了以后很感兴趣，不仅愿意出500元钱把自己宾馆的名字标在地图上，还愿意再多加1000元，要求在名字旁边加上宾馆的形象标志。刘强拿到第一份合同，心里非常兴奋。","事实证明，刘强的想法是独特的也是成功的。除了广州之外，他又去了另一个城市，只待了一个星期，他就签下了12万元的合同。接着，他又去了另外一些经济比较发达的城市。","经过半年的努力，刘强拿到了30多万元的提成，一次迷路让他成功地得到了人生的第一桶金。","(选自小欧《迷路迷出金点子》)"],"comp":[{"q":"刘强产生制作标注商业单位地图想法的直接原因是什么？","opts":[{"k":"A","t":"他发现普通地图上找不到那家知名宾馆，迷路带来了困扰"},{"k":"B","t":"大学同学建议他做商业地图来赚取费用"},{"k":"C","t":"他想要前往经济发达城市寻找创业机会"},{"k":"D","t":"宾馆老板愿意出钱在地图上添加形象标志"}],"a":"A","derived":true},{"q":"按照刘强最初的方案，一家商业单位入选地图需要支付多少钱？","opts":[{"k":"A","t":"1000 元"},{"k":"B","t":"500 元"},{"k":"C","t":"1500 元"},{"k":"D","t":"12 万元"}],"a":"B","derived":true},{"q":"宾馆老板和刘强签订第一份合同时，额外增加费用的目的是？","opts":[{"k":"A","t":"让宾馆名字在地图上字体更大"},{"k":"B","t":"把宾馆放在地图最显眼位置"},{"k":"C","t":"在宾馆名字旁加上宾馆形象标志"},{"k":"D","t":"优先把宾馆信息印刷在首页"}],"a":"C","derived":true},{"q":"刘强在另一个城市一周时间签下的合同总金额是多少？","opts":[{"k":"A","t":"30 多万"},{"k":"B","t":"500 元"},{"k":"C","t":"12 万元"},{"k":"D","t":"1000 元"}],"a":"C","derived":true},{"q":"刘强半年通过这个项目获得了多少提成？","opts":[{"k":"A","t":"12 万元"},{"k":"B","t":"30 多万元"},{"k":"C","t":"1500 元"},{"k":"D","t":"50 万元"}],"a":"B","derived":true}],"exercises":[{"type":"pattern","title":"一、句式练习：弄清楚；没想到；好不容易；满足；规定","groups":[{"no":"第一组","sentences":["在网上买东西，一定要弄清楚网站是不是真的。","他的手机号被我弄丢了，联系不上了。","我到现在也弄不明白他为什么换工作。"],"src":"课文例句：为了弄清楚自己的位置，刘强找到附近一家很有名的宾馆。"},{"no":"第二组","sentences":["没想到在这儿碰上你了，咱们有十年没见面了吧？","我向他借钱，没想到他竟然说：\"我一分钱都没有了。\"","我给他打手机，没想到接电话的却是另一个人。"],"src":"课文例句：没想到，这么有名的宾馆却在地图上找不到。"},{"no":"第三组","sentences":["好不容易排队排到我了，火车票却卖光了。","我好不容易找到这个工作，当然要好好干了。","孩子每天上网，不爱理人，好不容易和父母聊会儿天儿，还常常吵架。"],"src":"课文例句：好不容易回到住处，已是夜里 12 点了。"},{"no":"第四组","sentences":["公司满足了他年薪二十万的要求。","虽然当上了白领，可我并不满足现在的生活。","对现在的住宿条件，我已经很满足了。"],"src":"课文例句：我要是做出一张地图，把全市所有的商业单位都标上，不就满足了人们的需要吗？"},{"no":"第五组","sentences":["学校规定，缺课三分之一的人不能参加考试。","国家规定，每年的 9 月 10 号是教师节。","在城市交通中，车辆、行人应该走规定的道路。"],"src":"课文例句：方案规定每个入选的商业单位出 500 元。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，选择课文的主要内容是什么，在括号里画√","items":[{"n":1,"q":"怎么才能不迷路。","extra":[],"text":"怎么才能不迷路。"},{"n":2,"q":"刘强挣钱的故事。","extra":[],"text":"刘强挣钱的故事。"},{"n":3,"q":"地图应该什么样。","extra":[],"text":"地图应该什么样。"}],"ans":{"kind":"seq","vals":["","√",""],"raw":["1.怎么才能不迷路。","2.刘强挣钱的故事。√","3.地图应该什么样。"]}},{"type":"tf","title":"三、根据课文内容，判断正误","items":[{"n":1,"q":"他迷路以后，没有向别人问路。","extra":[],"text":"他迷路以后，没有向别人问路。"},{"n":2,"q":"他找到宾馆，打听自己的位置。","extra":[],"text":"他找到宾馆，打听自己的位置。"},{"n":3,"q":"这是一个小宾馆，所以地图上没有。","extra":[],"text":"这是一个小宾馆，所以地图上没有。"},{"n":4,"q":"他花了很长时间才回到住的地方。","extra":[],"text":"他花了很长时间才回到住的地方。"},{"n":5,"q":"当时的地图上没有商业单位，很不方便。","extra":[],"text":"当时的地图上没有商业单位，很不方便。"},{"n":6,"q":"他想做一张地图给自己用。","extra":[],"text":"他想做一张地图给自己用。"},{"n":7,"q":"很多商业单位愿意出钱，在地图上标出自己的名字。","extra":[],"text":"很多商业单位愿意出钱，在地图上标出自己的名字。"},{"n":8,"q":"除了广州以外，他还去了别的城市。","extra":[],"text":"除了广州以外，他还去了别的城市。"},{"n":9,"q":"他卖地图，挣了30万。","extra":[],"text":"他卖地图，挣了30万。"}],"ans":{"kind":"seq","vals":["√","√","×","√","√","×","√","√","×"],"raw":["1.他迷路以后，没有向别人问路。(√)","2.他找到宾馆，打听自己的位置。(√)","3.这是一个小宾馆，所以地图上没有。(×)","4.他花了很长时间才回到住的地方。(√)","5.当时的地图上没有商业单位，很不方便。(√)","6.他想做一张地图给自己用。(×)","7.很多商业单位愿意出钱，在地图上标出自己的名字。(√)","8.除了广州以外，他还去了别的城市。(√)","9.他卖地图，挣了30万。(×)"]}},{"type":"order","title":"四、故事排序","items":[{"n":1,"q":"刘强迷路了。","extra":[],"text":"刘强迷路了。"},{"n":2,"q":"他找到一个有名的宾馆。","extra":[],"text":"他找到一个有名的宾馆。"},{"n":3,"q":"他在地图上找这个宾馆，可是没找到。","extra":[],"text":"他在地图上找这个宾馆，可是没找到。"},{"n":4,"q":"他想做一个标有商业单位的地图。","extra":[],"text":"他想做一个标有商业单位的地图。"},{"n":5,"q":"他设计了地图的方案。","extra":[],"text":"他设计了地图的方案。"},{"n":6,"q":"方案规定入选的商业单位出500元。","extra":[],"text":"方案规定入选的商业单位出500元。"},{"n":7,"q":"他找到了宾馆老板，老板愿意出钱。","extra":[],"text":"他找到了宾馆老板，老板愿意出钱。"},{"n":8,"q":"他签了更多的合同。","extra":[],"tex 5,"title":"母亲不在家的日子","warm":{"blocks":[{"t":"p","n":"1","text":"在你们家，下面这些词语常常跟谁有关系？为什么？"},{"t":"p","n":"","text":"唠叨　睡懒觉　做饭　打扫卫生　看报纸　上网　看电视　买菜　玩儿游戏"},{"t":"p","n":"2","text":"你会做简单的中国菜吗，比如西红柿炒鸡蛋？做这个菜很简单，一共用不了5分钟。下面是这个菜的菜谱，请选词填空："},{"t":"p","n":"","text":"西红柿　鸡蛋　盐　油　炒"},{"t":"p","n":"","text":"在锅里放（　　），油热了以后，把打好的（　　）放进去炒，然后把切成小块的（　　）放进锅里继续（　　），最后放一点儿（　　）。"}],"table":null},"vocab":[{"w":"整整","p":"zhěngzhěng","pos":"（副）","def":"whole, full"},{"w":"唠叨","p":"láodao","pos":"（动）","def":"to nag, to be garrulous"},{"w":"睡懒觉","p":"shuì lǎnjiào","pos":"","def":"to get up late, to sleep late"},{"w":"冰箱","p":"bīngxiāng","pos":"（名）","def":"refrigerator"},{"w":"炒","p":"chǎo","pos":"（动）","def":"to stir-fry"},{"w":"团团转","p":"tuántuánzhuàn","pos":"（形）","def":"to run around in circles, fig. frantically busy"},{"w":"餐桌","p":"cānzhuō","pos":"（名）","def":"dining table"},{"w":"抽屉","p":"chōuti","pos":"（名）","def":"drawer"},{"w":"锁","p":"suǒ","pos":"（动）","def":"to lock"},{"w":"炸","p":"zhá","pos":"（动）","def":"to deep-fry"},{"w":"盼望","p":"pànwàng","pos":"（动）","def":"to yearn for, to look forward to"},{"w":"担忧","p":"dānyōu","pos":"（动）","def":"to worry, to be anxious"},{"w":"儿行千里母担忧","p":"ér xíng qiān lǐ mǔ dānyōu","pos":"","def":"When the child is away, the mother will pray"},{"w":"酒杯","p":"jiǔbēi","pos":"（名）","def":"wine cup, wine glass"}],"text":["父母要去旅游，一听这消息，弟弟高兴得不得了，在家里从来什么活儿也不干的他，为父母整整忙了两天，连路上的水果、食品都准备好了。","母亲终于走了，也带走了二十多年来最使我们烦恼的唠叨。弟弟高兴得第一天就睡了个大懒觉，醒了就躺在床上不起来，我也高兴得把音乐声放到最大。","晚饭，我问弟弟想吃什么，他说\"随便\"。我打开冰箱，发现母亲为我们准备的一冰箱蔬菜里，我只会做西红柿炒鸡蛋。西红柿放到锅里，我却在屋里急得团团转，没盐了，这可怎么办?正要关火让弟弟去买盐，电话铃响了，原来是母亲，她告诉我们，她已平安到达，刚下飞机不久，盐放在餐桌的抽屉里。","晚上正要上床休息，电话又一次响了，还是母亲，告诉我别忘了关好房门。我急忙跑到门口去锁门，心里却很奇怪，母亲怎么知道我马虎得连房门也会忘记关呢?","第二天还是西红柿炒鸡蛋，弟弟的情绪已经不是很高。第三天，弟弟买来炸鸡和香肠，再加上我的西红柿炒鸡蛋，饭菜也十分丰富，我们俩却谁也高兴不起来，连话也不想多说，屋里静静的，这时真想有个人能在身边唠叨。","电话铃两天没响了，不知道为什么我的心里空空的。","第四天一大早，我刚醒，就听到电话铃大声响起来，我和弟弟几乎同时跳起来，真的是妈妈，她说今天下午北京有雨，让我们别忘了带雨衣，还说雨中骑车要注意安全，我的眼睛一下子就湿了。","我们开始仔细算着母亲回来的日子，盼望着电话铃的响声，有时候电话竟会一天不响。已经是第九天了，这天弟弟拿着一块面包，看着餐桌上的西红柿炒鸡蛋，突然，连作文都写不好的他读出了两句诗:\"儿行千里母担忧，母行千里儿更愁。\"","电话响了，是母亲，告诉我们明天上午到家，安静了好几天的屋里突然有了不一样的感觉，弟弟情绪很高地打开一瓶啤酒，手握酒杯，我们俩用力一碰，说:\"为妈妈明天回家，干杯!\""],"comp":[{"q":"一开始听说父母要去旅游，弟弟为什么忙了两天准备东西？","opts":[{"k":"A","t":"弟弟一直很勤快，经常帮家里准备出行物品"},{"k":"B","t":"弟弟因为母亲要出门，内心十分开心"},{"k":"C","t":"父母要求弟弟必须帮忙准备路上的食物"},{"k":"D","t":"弟弟想跟着父母一起出去旅游"}],"a":"B","derived":true},{"q":"做饭时 “我” 发现没有盐，最后盐在哪里找到？","opts":[{"k":"A","t":"在冰箱的储物格里面"},{"k":"B","t":"在厨房的柜子里"},{"k":"C","t":"在餐桌的抽屉里"},{"k":"D","t":"在门口的置物架上"}],"a":"C","derived":true},{"q":"到了第三天，饭菜很丰富，但 “我” 和弟弟为什么开心不起来？","opts":[{"k":"A","t":"炸鸡和香肠的味道不好"},{"k":"B","t":"想念母亲，希望有人在身边唠叨"},{"k":"C","t":"连续吃西红柿炒鸡蛋吃腻了"},{"k":"D","t":"担心母亲在外旅游遇到危险"}],"a":"B","derived":true},{"q":"弟弟说出 “儿行千里母担忧，母行千里儿更愁”，这句话主要表达了什么？","opts":[{"k":"A","t":"弟弟埋怨母亲出门旅游很久不回家"},{"k":"B","t":"弟弟体会到自己十分牵挂外出的母亲"},{"k":"C","t":"弟弟觉得这句诗写得非常优美"},{"k":"D","t":"弟弟希望母亲不要再打电话打扰他们"}],"a":"B","derived":true},{"q":"母亲打电话告知他们明天上午到家之后，姐弟二人是什么反应？","opts":[{"k":"A","t":"心情激动，举杯庆祝母亲归来"},{"k":"B","t":"十分平静，继续安静地吃饭"},{"k":"C","t":"有点失望，觉得母亲回来太早"},{"k":"D","t":"连忙收拾屋子等待母亲"}],"a":"A","derived":true}],"exercises":[{"type":"pattern","title":"一、句式练习：……得不得了；随便；马虎；……不起来；唠叨","groups":[{"no":"第一组","sentences":["他考上了满意的大学，全家高兴得不得了。","我这几天都没睡好，现在困得不得了。","现在找工作难得不得了，你别换了。"],"src":"课文例句：父母要去旅游，一听这消息，弟弟高兴得不得了。"},{"no":"第二组","sentences":["A：你想喝点儿什么？","A：咱们什么时候去看电影啊？","时间不多了，咱们随便吃点儿吧。"],"src":"课文例句：晚饭，我问弟弟想吃什么，他说\"随便\"。"},{"no":"第三组","sentences":["他太马虎了，又把钥匙丢了。","这件事非常重要，千万不能马虎。","他做错了很多题，大部分是因为马虎。"],"src":"课文例句：母亲怎么知道我马虎得连房门也会忘记关呢？"},{"no":"第四组","sentences":["我见过他，可是他的名字却想不起来了。","考试虽然结束了，可是他却轻松不起来。","看到别人都比他强，他就高兴不起来了。"],"src":"课文例句：饭菜十分丰富，我们俩却谁也高兴不起来。"},{"no":"第五组","sentences":["90% 以上的孩子认为妈妈太唠叨。","你别唠叨了行不行，你都说过一百遍了！","他总是唠叨，真不想理他了。"],"src":"课文例句：屋里静静的，这时真想有个人能在身边唠叨。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"tf","title":"三、根据课文第一段内容，判断正误","items":[{"n":1,"q":"弟弟平时在家不干活。","extra":[],"text":"弟弟平时在家不干活。"},{"n":2,"q":"弟弟告诉妈妈要准备点儿水果和食品。","extra":[],"text":"弟弟告诉妈妈要准备点儿水果和食品。"},{"n":3,"q":"\"我们\"一直很烦母亲的唠叨。","extra":[],"text":"\"我们\"一直很 :"（名）","def":"household duties"},{"w":"理所当然","p":"lǐ suǒ dāng rán","pos":"（成）","def":"as a matter of course"},{"w":"本领","p":"běnlǐng","pos":"（名）","def":"skill, ability, capability"}],"text":["①（旁白）最近社会上又有人建议妇女走回家庭，做全职太太，我想对这件事大家都有（发言权）。","女 A：我觉得全职太太不错。记得我（怀孕）的时候，每天（早出晚归），挤公共汽车，再上一天班，把我累得跟什么似的。有了孩子以后更是每天忙得团团转，那时候我就想，做个全职太太多好啊，可以给家人和孩子更多的照顾。","女 B：我就不同意你的说法，还是有份工作心里（踏实），生活也（充实），不会（无聊）。做全职太太当然（清闲）一些，可我觉得，人是一种很奇怪的动物，闲的时候多了，就会觉得无聊，人活着最怕这种无聊的感觉了。","② 女 C：我工作就是为了挣钱，能过上高质量的生活。现在我老公收入很高，已经能满足我们了，我就没必要工作了。全职太太把更多的（精力）放到家庭上，使家变得更舒服，难道这不是一种聪明的选择吗？现在全职太太中（能）人也不少，买（股票）的、玩儿电脑的、写书的，我看也不一定夫妻两个都在外边忙。","男：如果女的不工作，当全职太太，男人会觉得妻子做的一切（家务都是理所当然）的。时间长了，女性离开了社会，就不敢再走出家门了。这时候，要是男人有了什么变化，那妻子应该怎么办？所以，我觉得，有人不想上班了，家里要是有条件，当全职太太也可以。等你没条件做全职太太了，还是得去上班，所以即使你现在在家当全职太太，也最好不要忘了学习一点儿（本领）。"],"comp":[{"q":"女 A 为什么觉得做全职太太不错？","opts":[{"k":"A","t":"全职太太可以在家买股票、写书"},{"k":"B","t":"上班怀孕带孩子非常劳累，想更好照顾家人孩子"},{"k":"C","t":"有工作内心才会踏实，生活充实不无聊"},{"k":"D","t":"丈夫收入高，足够支撑全家高质量生活"}],"a":"B","derived":true},{"q":"女 B 反对做全职太太，她的主要看法是什么？","opts":[{"k":"A","t":"长期脱离社会，之后很难再外出工作"},{"k":"B","t":"全职太太把精力放在家里是聪明的选择"},{"k":"C","t":"有工作心里踏实，空闲太久容易感到无聊"},{"k":"D","t":"男人容易把家务看作理所当然的事情"}],"a":"C","derived":true},{"q":"女 C 认为自己不用外出工作的前提是？","opts":[{"k":"A","t":"自己掌握多种本领，可以随时外出就业"},{"k":"B","t":"丈夫收入很高，能满足家庭高质量生活需求"},{"k":"C","t":"全职太太不会与社会脱节，不怕生活变化"},{"k":"D","t":"夫妻二人不需要都在外边忙碌打拼"}],"a":"B","derived":true},{"q":"男士对全职太太提出最重要的提醒是哪一项？","opts":[{"k":"A","t":"全职太太在家可以学习电脑、炒股写书"},{"k":"B","t":"只要家庭条件好，就可以一直做全职太太"},{"k":"C","t":"做全职太太也要坚持学习本领，以备后续需要上班"},{"k":"D","t":"全职太太的家务劳动会得到家人认可尊重"}],"a":"C","derived":true},{"q":"根据课文，下面哪一项表述符合男士的观点？","opts":[{"k":"A","t":"女性一旦成为全职太太，就再也不能走出家门"},{"k":"B","t":"部分男性会觉得全职太太承担家务是理所应当"},{"k":"C","t":"夫妻中只需要一方在外工作，是最明智的选择"},{"k":"D","t":"全职太太空闲时间多，很容易产生无聊的情绪"}],"a":"B","derived":true}],"exercises":[{"type":"pattern","title":"一、句式练习：累得跟什么似的；无聊；没必要；理所当然；有条件","groups":[{"no":"第一组","sentences":["每天加班，把我累得跟什么似的。","他实现了自己的愿望，高兴得跟什么似的。","那个商店可别去，东西贵得跟什么似的。"],"src":"课文例句：每天早出晚归，挤公共汽车，再上一天班，把我累得跟什么似的。"},{"no":"第二组 的了。","6.我们想给每个人一间办公室，可是目前还没有这个(**条件**)。","7.这本书很(**无聊**)，你别看了。","8.我每天加班，发点儿奖金是(**理所当然**)的。","9.最近工作特别多，每天都忙得(**跟什么似的**)。"]}}]},{"no":8,"title":"最好的老师","warm":{"blocks":[{"t":"p","n":"1","text":"下面的东西是否存在？跟同学们讨论一下。"},{"t":"p","n":"","text":"外星人　（　　）"},{"t":"p","n":"","text":"飞碟　（　　）"},{"t":"p","n":"","text":"灵魂　（　　）"},{"t":"p","n":"","text":"世界末日　（　　）"},{"t":"p","n":"2","text":"下面的说法是真的吗？猜一猜。"},{"t":"p","n":"","text":"中指的指甲比其他指甲长得快。　（　　）"},{"t":"p","n":"","text":"蚊子有22个牙。　（　　）"},{"t":"p","n":"","text":"一个人每年要消耗一吨的食物和饮料。　（　　）"},{"t":"p","n":"","text":"地球在冬天转得慢，夏天转得快。　（　　）"},{"t":"p","n":"","text":"睡觉的房子越冷，做噩梦的可能性也就越大。　（　　）"},{"t":"p","n":"","text":"多吃糖比吸烟危害更大。　（　　）"}],"table":null},"vocab":[{"w":"骨头","p":"gǔtou","pos":"（名）","def":"bone"},{"w":"大鸭蛋","p":"dà yādàn","pos":"","def":"(as a score,etc.) duck's egg, goose egg, zero"},{"w":"反复","p":"fǎnfù","pos":"（副）","def":"repeatedly, again and again"},{"w":"灭绝","p":"mièjué","pos":"（动）","def":"to die out"},{"w":"遗迹","p":"yíjì","pos":"（名）","def":"historical remains, traces, vestiges"},{"w":"绘声绘色","p":"huì shēng huì sè","pos":"（成）","def":"vivid, true to life"},{"w":"毛","p":"máo","pos":"（名）","def":"hair, feather"},{"w":"光滑","p":"guānghuá","pos":"（形）","def":"smooth, glossy, sleek"},{"w":"老鹰","p":"lǎoyīng","pos":"（名）","def":"hawk, eagle"},{"w":"盲目","p":"mángmù","pos":"（形）","def":"blind, lacking insight, ignorant"},{"w":"既然","p":"jìrán","pos":"（连）","def":"since, as, now that"},{"w":"成绩单","p":"chéngjìdān","pos":"（名）","def":"school report, report card."}],"text":["二十年前，惠特森先生是我们自然科学课的老师。在给我们上的第一节课上，他介绍了一种会飞的猫，他一边讲，一边给我们看一块骨头。我们认认真真地做着笔记。接着，惠特森先生对我们进行了一次小测验。","但是，当两天后我拿到改过了的卷子时，立刻就傻了眼，没有一道题是对的，我考了一个零分。这绝对弄错了!每道题惠特森先生课上都讲过，我每个字都做了笔记，我的答案和笔记没有什么不同。同时我发现，班上所有的同学跟我一样，都得了一个\"大鸭蛋\"。这到底是怎么回事?","惠特森先生说，很简单，会飞的猫完全是他编出来的，根本就没有这种动物。","不用说，我们大家都很生气，这是什么考试?这是什么老师?惠特森先生说，我们应该早就发现这里边的问题了。因为那节课上，他给我们看会飞的猫的骨头时，反复强调，这种动物早就灭绝了，而且没有留下一点儿遗迹。但是他却绘声绘色地跟我们讲，这种会飞的猫眼睛是多么亮，毛是多么光滑，飞起来简直像老鹰一样快。然而，既然一点儿遗迹都没有留下，怎么会有骨头呢?他又是怎么知道会有这种动物的呢?我们没有一个人提出这个问题。惠特森先生说，实际上，他给我们看的只是一只普通的猫的骨头。盲目相信是我们得\"大鸭蛋\"的原因，既然错在我们，他就要把我们的这次零分的成绩登记到成绩单上去。他希望这次经历能让我们知道，老师和课本也有可能犯错误，实际上，每个人都有可能犯错误。","二十多年过去了，惠特森先生的课还对我有着很大的影响，那就是：不论什么情况，我们都要用自己的大脑分析问题。","(选自邓迪编译的同名文章)"],"comp":[{"q":"惠特森先生在第一节课上向学生介绍的 “会飞的猫” 是什么？","opts":[{"k":"A","t":"一种已经灭绝、没有留下遗迹的真实动物"},{"k":"B","t":"惠特森先生编造出来的动物"},{"k":"C","t":"和老鹰一样外形的猫科动物"},{"k":"D","t":"只存在于古老传说中的动物"}],"a":"B","derived":true},{"q":"全班同学测验都得了零分，根本原因是什么？","opts":[{"k":"A","t":"惠特森先生批改试卷出现失误"},{"k":"B","t":"学生上课没有认真记笔记"},{"k":"C","t":"学生盲目相信老师所说的内容，没有独立思考质疑"},{"k":"D","t":"“会飞的猫” 知识点太难，学生无法理解"}],"a":"C","derived":true},{"q":"惠特森先生展示给学生的骨头实际是什么？","opts":[{"k":"A","t":"会飞的猫的化石骨头"},{"k":"B","t":"老鹰的骨头"},{"k":"C","t":"普通猫的骨头"},{"k":"D","t":"不知名远古动物骨头"}],"a":"C","derived":true},{"q":"惠特森先生希望学生通过这次经历明白什么道理？","opts":[{"k":"A","t":"自然科学考试很容易得零分"},{"k":"B","t":"老师和课本也可能出错，每个人都可能犯错，要独立思考"},{"k":"C","t":"已经灭绝的动物不会留下任何骨头"},{"k":"D","t":"上课一定要认真做好课堂笔记"}],"a":"B","derived":true},{"q":"二十多年之后，惠特森先生这堂课带给作者最重要的影响是？","opts":[{"k":"A","t":"不再相信自然科学相关知识"},{"k":"B","t":"遇到事情要依靠自己的大脑分析问题"},{"k":"C","t":"每次考试都要仔细检查试卷"},{"k":"D","t":"对所有老师讲的内容都要生气质疑"}],"a":"B","derived":true}],"exercises":[{"type":"pattern","title":"一、句式练习：编；反复；早就；简直；盲目","groups":[{"no":"第一组","sentences":["这件事不是真的，是他编的。","他为了骗钱，编了好多理由。","这是你编出来吓人的吧。"],"src":"课文例句：会飞的猫完全是他编出来的，根本就没有这种动物。"},{"no":"第二组","sentences":["父母反复跟孩子说学习多么重要，孩子都听烦了。","他最近总是反复感冒，真应该注意一下身体了。","经过反复讨论，大家同意这么办。"],"src":"课文例句：他给我们看会飞的猫的骨头时，反复强调，这种动物早就灭绝了。"},{"no":"第三组","sentences":["这件事我早就知道了，你怎么还不知道呀？","他早就结婚了，孩子都上学了。","他早就回国了，我们还给他开了一个告别晚会呢。"],"src":"课文例句：这种动物早就灭绝了，而且没有留下一点儿遗迹。"},{"no":"第四组","sentences":["12 岁就上了大学，他简直是超人！","今天简直太冷了，只有零下 10 度。","他不是在走，简直是在跑！"],"src":"课文例句：这种会飞的猫……飞起来简直像老鹰一样快。"},{"no":"第五组","sentences":["不发展不行，盲目发展也不行。","我们不能盲目乐观。","别人说的话，不要盲目相信。"],"src":"课文例句：盲目相信是我们得“大鸭蛋”的原因。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，在括号中正确的选项后画√","items":[{"n":1,"q":"这个故事发生在(现在　过去)。","extra":[],"text":"这个故事发生在(现在　过去)。"},{"n":2,"q":"作者现在是(成人　学生)。","extra":[],"text":"作者现在是 ,"1.经过(**反复**)考虑，他决定放弃这个工作。","2.这是我在报纸上看的，不是我(**编**)的。","3.我累得(**简直**)连饭也不想吃。","4.要是知道留学生也能参加运动会，我(**早就**)报名了。","5.我们要好好研究以后再决定，千万不能(**盲目**)决定。","6.考试很难，不过我(**早就**)准备好了。","7.他发现自己只考了零分，立刻(**傻眼**)了。","8.这都是真的，不是(**编**)出来的。","9.上飞机以前，他(**反复**)告诉我，要注意安全。","10.我(**简直**)不能相信自己的眼睛。"]}},{"type":"cloze","title":"八、填空","items":[{"n":1,"q":"（　　）年以前，地球上共有（　　）种不同的动物和植物，现在还活着的只有大约（　　）种，灭绝率（　　）。（　　）年以来，灭绝了（　　）种动物，其中（　　）是人类造成的。","extra":[],"text":"（　　）年以前，地球上共有（　　）种不同的动物和植物，现在还活着的只有大约（　　）种，灭绝率（　　）。（　　）年以来，灭绝了（　　）种动物，其中（　　）是人类造成的。"}],"ans":{"kind":"raw","text":["(**30亿**)年以前，地球上共有(**5亿**)种不同的动物和植物，现在还活着的只有大约(**200万**)种，灭绝率(**99.6%**)。(**1600**)年以来，灭绝了(**130万**)种动物，其中(**75%**)是人类造成的。"],"raw":["(**30亿**)年以前，地球上共有(**5亿**)种不同的动物和植物，现在还活着的只有大约(**200万**)种，灭绝率(**99.6%**)。(**1600**)年以来，灭绝了(**130万**)种动物，其中(**75%**)是人类造成的。"]}}]},{"no":9,"title":"为了一个梦","warm":{"blocks":[{"t":"p","n":"1","text":"你了解中国的打工者吗？他们的生活状况怎么样？他们的收入怎么样？"},{"t":"p","n":"2","text":"在大城市，打工者常常做哪些工作？"},{"t":"p","n":"","text":"收废品　卖菜　清洁工　保姆　小时工　建筑工人　出租司机　保安　售货员　服务员　工人　厨师　公司职员　学校老师　政府公务员"}],"table":null},"vocab":[{"w":"吉他","p":"jítā","pos":"（名）","def":"guitar"},{"w":"普通话","p":"pǔtōnghuà","pos":"（名）","def":"putonghua, Mandarin Chinese"},{"w":"哑巴","p":"yǎba","pos":"（名）","def":"dumb person, mute, dummy"},{"w":"初中","p":"chūzhōng","pos":"（名）","def":"junior high school"},{"w":"吃力","p":"chīlì","pos":"（形）","def":"exhausting, laborsome"},{"w":"熟练","p":"shúliàn","pos":"（形）","def":"adept, skilled, skillful, proficient"},{"w":"酒吧","p":"jiǔbā","pos":"（名）","def":"bar (room)"},{"w":"幸运","p":"xìngyùn","pos":"（形）","def":"fortunate, lucky"},{"w":"调","p":"diào","pos":"（动）","def":"to transfer, to shift"},{"w":"前台","p":"qiántái","pos":"（名）","def":"reception desk"},{"w":"缘故","p":"yuángù","pos":"（名）","def":"reason, cause"},{"w":"珍惜","p":"zhēnxī","pos":"（动）","def":"to treasure, to value, to cherish"},{"w":"小费","p":"xiǎofèi","pos":"（名）","def":"tip (money)"},{"w":"报考","p":"bǎokǎo","pos":"（动）","def":"to sign up for an examination"},{"w":"理想","p":"lǐxiǎng","pos":"（名）","def":"ideal, dream, aspiration"}],"text":["两年前，我告别父母，背上简单的行李和我最喜欢的吉他，坐上火车，来到北京，成了一名打工者。","刚来时，我被介绍到一家工厂工作。因为说不好普通话，怕别人笑话，去餐厅吃饭都不好意思开口，只好用手指着要买的饭菜，卖菜的师傅还以为我是个哑巴呢。最难的是找工作，我只是初中毕业，没有读过高中，学习技术相当吃力，每天下班后都觉得非常累。","一年以后，由于我的努力和同事们的帮助，我不仅学会了普通话，还成了一个熟练的技术工人。看到自己的进步，我有说不出的高兴。","后来，经朋友介绍，我又来到一个酒吧洗杯子。我拼命干活，很少说话；不但动作快，而且非常小心，就怕摔坏了杯子。","没过几天，我又幸运地被调到前台当了一名服务员。能在这个酒吧当上服务员是很不容易的，老板对服务员的工作要求很高，不准出错儿，每个服务员都要经过严格的训练。这里的女服务员也都是从外地来的，也许是因为这个缘故吧，她们对我特别照顾，这使我非常感动，更加珍惜这份工作。","我不愿意收客人的小费，总觉得那是不应该收的。有一次，有位客人给我一百元小费，我怎么也不收，弄得他很失望。客人走了之后，同事们都开玩笑地说我是“猪脑袋”。","两年很快过去了。我已经存了一笔钱。再坚持半年的时间，我就可以用这笔钱报考一所艺术学校，学习音乐知识，实现我的理想了。那时，我家乡的小山上又会响起好听的吉他声。"],"comp":[{"q":"主人公刚来北京的时候，在餐厅吃饭为什么只用手指饭菜？","opts":[{"k":"A","t":"他不会写字，没法点餐"},{"k":"B","t":"普通话说不好，害怕被别人笑话"},{"k":"C","t":"他是哑巴，不能开口说话"},{"k":"D","t":"餐厅规定只能用手指点餐"}],"a":"B","derived":true},{"q":"主人公一年之后，在工厂取得了什么变化？","opts":[{"k":"A","t":"他考上了艺术学校"},{"k":"B","t":"他学会普通话，成为熟练技术工人"},{"k":"C","t":"他跳槽去酒吧当服务员"},{"k":"D","t":"他存够了上学需要的钱"}],"a":"B","derived":true},{"q":"酒吧老板对服务员的工作有什么要求？","opts":[{"k":"A","t":"必须主动收取客人的小费"},{"k":"B","t":"干活要少说话，动作要快"},{"k":"C","t":"要求很高，不能出错，需要严格训练"},{"k":"D","t":"优先招聘初中毕业的外地年轻人"}],"a":"C","derived":true},{"q":"客人给主人公一百元小费，主人公是怎么做的？","opts":[{"k":"A","t":"收下小费，之后被同事夸奖"},{"k":"B","t":"坚决不收，让客人很失望"},{"k":"C","t":"收下一半，退回剩下的钱"},{"k":"D","t":"收下小费，用来买吉他"}],"a":"B","derived":true},{"q":"主人公的梦想是什么？","opts":[{"k":"A","t":"留在北京酒吧长期做服务员"},{"k":"B","t":"攒钱回到家乡工厂当技术工人"},{"k":"C","t":"报考艺术学校学习音乐，实现理想"},{"k":"D","t":"在老家小山开一家酒吧"}],"a":"C","derived":true}],"exercises":[{"type":"pattern","title":"一、句式练习：怕别人笑话；吃力；有说不出的高兴；拼命；不准","groups":[{"no":"第一组","sentences":["学外语，要大胆说话，不能怕别人笑话。","他普通话说得不好，同学都笑话他。","他穿着破牛仔裤上街，没人笑话他。"],"src":"课文例句：因为说不好普通话，怕别人笑话，去餐厅吃饭都不好意思开口。"},{"no":"第二组","sentences":["他刚上大学的时候，听不懂老师讲课，觉得很吃力。","因为不喜欢，这个活我干起来很吃力。","老板看他工作很吃力，就给他换了一个活儿。"],"src":"课文例句：我只是初中毕业，没有读过高中，学习技术相当吃力。"},{"no":"第三组","sentences":["看到自己终于成功了，他有说不出的高兴。","朋友们都去旅行了，他一个人有说不出的寂寞。","就要出国留学了，他有说不出的兴奋。"],"src":"课文例句：看到自己的进步，我有说不出的高兴。"},{"no":"第四组","s ,["吃力"],["笑话"],["拼命"],["说不出的"],["说不出的"]],"raw":["告别 笑话 吃力 说不出的 拼命 不准 理想","1.教学楼里(**不准**)抽烟，厕所里也不行。","2.我的(**理想**)就是过不一样的生活。","3.三年前，我(**告别**)家人来中国留学。","4.运动会上，他(**拼命**)跑，得了第一名。","5.您(**不准**)我上网，也(**不准**)我看电视，我还有没有自由啦?","6.刚开始工作时，他感到很(**吃力**)，熟悉了以后就好了。","7.我不喜欢唱卡拉OK，唱得不好，别人会(**笑话**)我的。","8.他想换工作，父母(**拼命**)反对。","9.客人给他小费，可是他没收，客人真有(**说不出的**)失望。","10.儿子都三十多了，还没女朋友，父母有(**说不出的**)着急。"]}}]},{"no":10,"title":"怎么称呼陌生人","warm":{"blocks":[{"t":"p","n":"1","text":"跟同学讨论一下下面几个问题，从“可能的称呼”中选一个，然后问问老师，你们的称呼是否合适。"},{"t":"opt","k":"A","text":"你去同学家，怎么称呼同学的父亲、母亲？"},{"t":"opt","k":"B","text":"你去老师家，怎么称呼老师的爱人、父母和孩子？"},{"t":"opt","k":"C","text":"你去饭馆，怎么称呼服务员？"},{"t":"opt","k":"D","text":"你去商店，怎么称呼售货员？"},{"t":"p","n":"","text":"可能的称呼：先生　太太　女士　小姐　大姐　叔叔　阿姨　爷爷　奶奶　服务员　师傅　售货员　同志"},{"t":"p","n":"2","text":"读一读下面的新闻“‘同志’走了”，你有什么想法？"},{"t":"p","n":"","text":"“同志”走了"},{"t":"p","n":"","text":"公交车的售票员怎么称呼乘客？最近，公交集团规定，年轻乘客将被称为“先生”、“小姐”和“乘客”，年少乘客称为“同学”、“学生”，年幼乘客则被称为“小朋友”。对年长乘客的称呼分别是“老师傅”、“老先生”，然后才是“老同志”，“同志”被排在最后一个，这个过时的称呼正在远离我们。"}],"table":null},"vocab":[{"w":"称呼","p":"chēnghu","pos":"（动/名）","def":"to call, to address"},{"w":"陌生","p":"mòshēng","pos":"（形）","def":"strange, unfamiliar"},{"w":"一来……／二来……","p":"yī lái……／èr lái……","pos":"（句式）","def":"(sentence structure) in the first place ..., in the second place"},{"w":"过时","p":"guòshí","pos":"（形）","def":"old-fashioned, out-of-date"},{"w":"体力","p":"tǐlì","pos":"（名）","def":"physical strength"},{"w":"美女","p":"měinǚ","pos":"（名）","def":"beautiful woman, beauty"}],"text":["① 学生 1：老师，我有一个问题，向别人问路，或者在饭馆向服务员点菜的时候，应该怎么称呼他们？","老师：这个问题好。你们平时是怎么称呼的？","学生 2：在饭馆可以叫他们“服务员”。在路上呢，年轻女的可以叫“姑娘”，男的可以叫“小伙子”。我在路上听到过人们这么叫。","老师：“姑娘”和“小伙子”可不是人人都能叫的。你今年多大？","学生 2：二十三岁。","老师：一般只有岁数大的人才能叫年轻人“姑娘”和“小伙子”，比如四十岁以上的人可以叫。你们太年轻了，不行。","学生 1：老师，我能叫你“阿姨”吗？这个我也听到过。","老师：这个嘛，你不是小孩子，我也还没那么老，听到你叫我阿姨，可能会有点儿不高兴。但是对上了年纪的人，比如五六十岁的，叫阿姨，人家就会很高兴。对更老的，还可以叫“奶奶”，对男的，可以叫“爷爷”。","学生 2：那叫比我大的女人“大姐”行吗？","老师：叫“大姐”也不太合适，一来两个人根本不认识，二来前面加上个“大”字，听上去就老了，如果是个自己认为自己还很年轻的人，你叫人家大姐，估计她也不会高兴。","② 学生 1：叫“女士”或者“先生”是不是太正式了？","老师：你说得很对。问路的时候，叫人家“女士”或者“先生”肯定不合适。","学生 2：听说以前还可以称呼别人“同志”？","老师：对，这个称呼已经过时了。","学生 1：叫“师傅”行吗？我常常叫出租车司机“师傅”。","老师：师傅指的是有技术的工人，现在是对体力劳动者的称呼。如果是路上遇到的陌生人，最好别叫人家“师傅”，要不然他可能会不高兴。","学生 2：那到底怎么称呼呢？真是太难了！","学生 1：有人叫我“美女”，这个称呼合适吗？","老师：哈哈，那是中国人跟你开玩笑呢，因为你是“老外”。如果是对一个陌生的中国姑娘，一般中国人是不会叫她“美女”的。","学生 2：对年轻的女人可以叫“小姐”吗？","老师：我觉得可以。不过，现在有很多人不喜欢这个称呼。其实，我也常常不知道该怎么称呼陌生人，特别是女的。称呼年轻的容易，称呼年老的也不难，最难的是三十多到五十岁左右的，怎么称呼好像都不太合适。我有一个最简单的办法，就是不称呼他，直接说“麻烦您”或者“对不起，请问……”，你们觉得怎么样？","学生 1：这个办法好，下次我也试试。"],"comp":[{"q":"根据课文，二十三岁的学生在路上不适合叫年轻人 “姑娘”“小伙子”，原因是什么？","opts":[{"k":"A","t":"这两个称呼现在已经过时了"},{"k":"B","t":"一般只有四十岁以上年纪大的人才可以这么称呼"},{"k":"C","t":"陌生人听到这两个称呼会感到生气"},{"k":"D","t":"这两个称呼只能用来称呼饭馆里的服务人员"}],"a":"B","derived":true},{"q":"关于称呼 “大姐”，老师的看法是？","opts":[{"k":"A","t":"对陌生女性称呼大姐很合适"},{"k":"B","t":"陌生人之间叫大姐不太合适，容易让对方觉得显老"},{"k":"C","t":"三十到五十岁的女性最喜欢别人叫她大姐"},{"k":"D","t":"在路上问路时，大姐是最稳妥的称呼"}],"a":"B","derived":true},{"q":"老师认为问路时，如果不知道怎么称呼陌生人，最好的办法是什么？","opts":[{"k":"A","t":"称呼对方 “女士” 或者 “先生”"},{"k":"B","t":"直接叫 “美女”，不会出错"},{"k":"C","t":"不使用称呼，直接说 “麻烦您” 或者 “对不起，请问……”"},{"k":"D","t":"统一称呼陌生人 “师傅”"}],"a":"C","derived":true},{"q":"下列哪一项说法符合课文内容？","opts":[{"k":"A","t":"“同志” 这个称呼现在仍然经常使用"},{"k":"B","t":"对五六十岁的人称呼阿姨，对方可能会很高兴"},{"k":"C","t":"称呼陌生中国年轻女性 “美女” 是很普遍正式的叫法"},{"k":"D","t":"路上遇到任何陌生人都可以称呼 “师傅”"}],"a":"B","derived":true},{"q":"老师觉得称呼陌生人最难的是哪个年龄段的女性？","opts":[{"k":"A","t":"二十岁以下"},{"k":"B","t":"二十到三十岁"},{"k":"C","t":"三十多到五十岁左右"},{"k":"D","t":"五十岁以上"}],"a":"C","derived":true}],"exercises":[{"type":"pattern","title":"一、句式练习：称呼；一来……二来……；过时；特别是；直接","groups":[{"no":"第一组","sentences":["A：请问您怎么称呼？","应该怎么称呼老师的爱人？","“同志”这个称呼已经过时了。"],"src":"课文例句：向别人问路，或者在饭馆向服务员点菜的时候，应该怎么称呼他们？"},{"no":"第二组","sentences":["没事的时候我就看书，这一来是我的爱好，二来可以充实自己。","我住在校外，一来可以自己做饭，二来可以认识更多中国人。","我来中国留学，一来为了学汉语，二来还能旅游。"],"src":"课文例句：叫“大姐”也不太合适，一来两个人根本不认识，二来前面加上个“大”字，听上去就老了。"},{"no":"第三组","sentences":["你的手机太过时了，快换一个吧。","“男主外，女主内”这个观念早就过时了。","买黑色的吧，黑色永不过时。"],"src":"课文例句：这个称呼已经过时了。"},{"no":"第四组","sentences":["我喜欢各种运动，特别是游泳。","我觉得汉语不太难，特别是语法。","他的电影都很好看， 赔　配　培"},{"t":"p","n":"","text":"（1）我这星期很忙，下周（　　）你逛街吧。"},{"t":"p","n":"","text":"（2）他的买卖不仅没赚钱，还（　　）了几千块呢。"},{"t":"p","n":"","text":"（3）西服怎么能（　　）运动鞋呢？"},{"t":"p","n":"","text":"（4）现在（　　）养一个大学生要花多少钱？"},{"t":"p","n":"2","text":"下面是一些关于“陪读”的文章题目，说一说：哪些是赞成的？哪些是反对的？哪些观点从题目上看不出来？"},{"t":"p","n":"","text":"（1）父母陪读，对孩子长期的伤害"},{"t":"p","n":"","text":"（2）陪读，父母送给孩子的可怕礼物"},{"t":"p","n":"","text":"（3）陪读，赔掉了什么？"},{"t":"p","n":"","text":"（4）进步来自陪读"},{"t":"p","n":"","text":"（5）抱大的孩子长不大"},{"t":"p","n":"","text":"（6）父母陪读值不值？"}],"table":null},"vocab":[{"w":"陪读","p":"péidú","pos":"（动）","def":"accompany sb. studying"},{"w":"重点中学","p":"zhòngdiǎn zhōngxué","pos":"","def":"key high (middle) school"},{"w":"一落千丈","p":"yí luò qiān zhàng","pos":"（成）","def":"to have a big comedown, to go into a nose dive"},{"w":"跟踪","p":"gēnzōng","pos":"（动）","def":"to track, to follow secretly"},{"w":"网吧","p":"wǎngbā","pos":"（名）","def":"Internet bar"},{"w":"游戏","p":"yóuxì","pos":"（名）","def":"game, pastime"},{"w":"自理","p":"zìlǐ","pos":"（动）","def":"to take care of oneself"},{"w":"县城","p":"xiànchéng","pos":"（名）","def":"county town"},{"w":"要么……要么……","p":"yàome…… yàome……","pos":"","def":"either...or..."},{"w":"富裕","p":"fùyù","pos":"（形）","def":"well-to-do, well off, rich"},{"w":"租房","p":"zūfáng","pos":"（动）","def":"to rent an apartment or a house"},{"w":"赞助费","p":"zànzhùfèi","pos":"（名）","def":"sponsorship fee"}],"text":["① 18 岁的小华被上海一所有名的大学录取了，妈妈给他买了 13000 元的电脑，3000 多元的手机，1000 多元的电子词典，780 元一双的耐克鞋，1500 元的箱子。","② 妈妈还订好了机票，打定主意送儿子到上海后留下来陪读，她已经托朋友在大学附近租了一套房子。为什么要陪读呢？小华的妈妈说：小华上的中学是重点中学，初一的时候成绩在全年级排第二名，初二时，儿子的老师告诉她，她儿子从来不交作业，学习成绩一落千丈。经过对儿子的跟踪，她才知道，儿子天天放学后竟然去“黑网吧”玩儿游戏。","从此以后，她一直看着儿子，直到儿子考上大学。她说：“我去上海陪读，主要是担心儿子管不住自己会变坏，而且他从来没离开过家，自理能力很差，不会洗衣服。”","③ 有人管这样的父母叫“陪读父母”。“陪读父母”人数可不少，有从一个城市到另一个城市陪读的，有从农村到城市陪读的，还有从大城市到小县城陪读的；有父母中一个人陪读的，也有父母双双陪读的，甚至还有父母分别为两个孩子陪读的；有为大学生陪读的，也有为中小学生陪读的……这些家长要么担心这些孩子会变坏，要么担心他们生活不能自理，才放弃工作，离开家乡去陪读。","最近几年，一些富裕起来的农民在城里租房陪读的也越来越多，有不少农民把孩子转学到城里的中小学读书。住在郊区的老张为了让儿子进城上个好中学，在城里租了房，又向学校交了几万元赞助费，让爱人进城给儿子陪读。小学毕业后就干农活的老张说，自己没文化，只能干农活，但决不能让儿子这样了，拼命挣钱的目的就是培养儿子上最好的大学，将来有个好工作。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：打定主意；托；黑……；管……叫……；要么……要么……","groups":[{"no":"第一组","sentences":["我们的公司应该怎么发展？请大家一起出出主意。","毕业以后继续读书还是工作，我真拿不定主意。","她打定主意要一个人旅行，不管父母同意不同意。"],"src":"课文例句：妈妈还订好了机票，打定主意送儿子到上海后，留下来陪读。"},{"no":"第二组","sentences":["我托中国朋友帮我租房子。","找工作还得靠自己，托人不一定能找到自己满意的。","妈妈托人给我带来一些衣服。"],"src":"课文例句：她已经托朋友在大学附近租了一套房子。"},{"no":"第三组","sentences":["那不是真的出租车，是“黑车”，最好别坐。","那个店简直是黑店，卖的东西又贵，质量又不好。","很多年以前，人们去黑市换美元。"],"src":"课文例句：儿子天天放学后竟然去“黑网吧”玩儿游戏。"},{"no":"第四组","sentences":["妻子管丈夫的妈妈叫“婆婆”。","有人管外国人叫“老外”。","你们管什么样的孩子叫“问题儿童”？"],"src":"课文例句：有人管这样的父母叫“陪读父母”。"},{"no":"第五组","sentences":["你要么写作业，要么看书，不能上网。","去旅行，要么参加旅行团，要么自己去，两个方法都可以。","这个东西质量太差了，你要么给我换一个，要么退钱。"],"src":"课文例句：这些家长要么担心这些孩子会变坏，要么担心他们生活不能自理。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，选择课文的主要内容是什么，在括号里画 √","items":[{"n":1,"q":"小华考上大学的故事。","extra":[],"text":"小华考上大学的故事。"},{"n":2,"q":"上大学需要多少钱。","extra":[],"text":"上大学需要多少钱。"},{"n":3,"q":"很多父母给孩子陪读。","extra":[],"text":"很多父母给孩子陪读。"},{"n":4,"q":"陪读是学校的要求。","extra":[],"text":"陪读是学校的要求。"}],"ans":{"kind":"seq","vals":["","","√",""],"raw":["1. 小华考上大学的故事。（　）","2. 上大学需要多少钱。（　）","3. 很多父母给孩子陪读。（√）","4. 陪读是学校的要求。（　）"]}},{"type":"table","title":"三、根据课文第一段内容，边听边填表","intro":"","bank":[],"qtable":[["东西","电脑","手机","电子词典","耐克鞋","箱子"],["价格","13000 元","3000 元","1000 多元","780 元","1500 元"]],"ans":{"kind":"table","table":[["东西","电脑","手机","电子词典","耐克鞋","箱子"],["价格","13000 元","3000 元","1000 多元","780 元","1500 元"]],"bank":[]}},{"type":"mc","title":"四、根据课文第二段内容，选择正确答案（可以多选）","items":[{"n":1,"q":"关于小华，下面哪些是对的？","extra":["A. 家在上海　　B. 从来不写作业","C. 去黑网吧以后，成绩变差　D. 生活自理能力差"],"text":"关于小华，下面哪些是对的？","opts":[{"k":"A","t":"家在上海"},{"k":"B","t":"从来不写作业"},{"k":"C","t":"去黑网吧以后，成绩变差"},{"k":"D","t":"生活自理能力差"}]},{"n":2,"q":"关于小华的妈妈，下面哪些是对的？","extra":["A. 打算留在上海　　B. 打算住在大学宿舍","C. 担心小华管不住自己　　D. 打算跟踪儿子"],"text":"关于小华的妈妈，下面哪些是对的？","opts":[{"k":"A","t":"打算留在上海"},{"k":"B","t":"打算住在大学宿舍"},{"k":"C","t" 工作是你的事，所以还得自己拿（主意）。","3. 小事妻子拿（主意），大事他们俩商量。","4. 他很怕寂寞，总（托）人给他介绍女朋友。","5. 有人（管）汉堡包和披萨（叫）“垃圾食品”。","6. 我上网（订）好了宾馆，咱们直接去就行了。","7. 那是一家（黑）职业介绍所，光收钱，不给介绍工作。","8. 有的年轻人（管）父母（叫）“老爸、老妈”。","9. （要么）留在学校工作，（要么）自己开公司，当老板。","10. 我想（订）一张星期三去上海的机票。"]}}]},{"no":12,"title":"好梦成真","warm":{"blocks":[{"t":"p","n":"1","text":"跟“梦”有关的词语，你知道哪些？猜一猜下面词语的意思："},{"t":"p","n":"","text":"做梦　噩梦　白日梦　梦想成真/美梦成真/好梦成真　人生如梦　夜长梦多　梦中情人　梦寐以求　醉生梦死　如梦方醒　重温旧梦"},{"t":"p","n":"2","text":"你的“好梦”是什么？怎么让它“成真”？请填表，然后跟同学讨论一下。"}],"table":{"head":["是什么？","怎么才能“好梦成真”？"],"rows":[["我梦想的工作"],["我梦想的假期"],["我梦想的房子"],["我梦想的汽车"],["我梦想的爱人"]]}},"vocab":[{"w":"好梦成真","p":"hǎo mèng chéng zhēn","pos":"","def":"dreams come true"},{"w":"胡编乱造","p":"hú biān luàn zào","pos":"","def":"to cook up (a tale), to fabricate"},{"w":"干部","p":"gànbù","pos":"（名）","def":"leader, cadre"},{"w":"三好学生","p":"sān hǎo xuéshēng","pos":"","def":"merit student"},{"w":"钟点工","p":"zhōngdiǎn gōng","pos":"","def":"temporary worker paid by the hour"},{"w":"照例","p":"zhàolì","pos":"（副）","def":"as usual"},{"w":"打扫","p":"dǎsǎo","pos":"（动）","def":"to clean, to sweep"},{"w":"脸色","p":"liǎnsè","pos":"（名）","def":"complexion, look, facial expression"},{"w":"张望","p":"zhāngwàng","pos":"（动）","def":"to peep (through a crack, etc.)"},{"w":"贫困","p":"pínkùn","pos":"（形）","def":"poor, impoverished"},{"w":"诱惑","p":"yòuhuò","pos":"（名）","def":"temptation"},{"w":"瞪","p":"dèng","pos":"（动）","def":"to stare, to glare with displeasure"},{"w":"递给","p":"dìgěi","pos":"（动）","def":"to hand over"},{"w":"欢呼","p":"huānhū","pos":"（动）","def":"to hail, to cheer"},{"w":"惊心","p":"jīng xīn","pos":"","def":"shocked"},{"w":"举动","p":"jǔdòng","pos":"（名）","def":"activity, behavior"}],"text":["① 玲玲的家十分富裕，她的父母非常爱她，她的学习成绩从小学到初中一直是班里前几名，玲玲才十五岁就已长到一米六，苗条又美丽——不论从哪方面说，玲玲都算得上幸运。","有一天老师出了个作文题，把玲玲给难住了。","那个作文题是“好梦成真”。老师说：要写真人真事，不要胡编乱造。想要的东西玲玲都有了。连本来没特别想要的，也全都有了，比如当班干部，当三好学生，过年过节亲戚送的礼物。这样一来，玲玲还需要什么好梦？没有好梦，又怎么说好梦成真呢？","星期日的上午，玲玲苦苦想着怎么写这篇作文，想不出来，心里有点儿烦。","② 钟点工照例准时来她家打扫卫生，照例带来了刚上一年级的小女儿。钟点工的小女儿很懂事，像她妈妈一样不发出任何声音。","小女孩也不是一开始就这么懂事的，第一次来的时候，她把玲玲的玩具给弄脏了，玲玲的脸色很难看。她妈妈打了她。小女孩从此再也不敢走进玲玲的房间，最多趁玲玲不注意躲到门口张望。有什么办法，玲玲的房间太漂亮了，对贫困家庭的小孩来说，诱惑实在是太大了。","这天玲玲又从镜子里看见小女孩向她的房间里张望。玲玲心里正烦着，就回头瞪了她一眼。小女孩吓得赶紧走开。","钟点工临走时，玲玲觉得有些对不起小女孩，随手从桌上拿了两支铅笔和一块巧克力，递给她。","钟点工带着小女孩走了。没走多远，小女孩就发出一阵欢呼，接下来的一句话，让玲玲惊心。","那小孩说：“妈妈，今天大姐姐怎么会对我那么好，妈妈，我真像做梦一样！”","玲玲流下了眼泪。好梦成真原来是那么简单的事，自己无意中的一个小小举动，就让一个小孩好梦成真了。","（选自莫小米同名文章）"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：算得上；当；把……给……；脸色；趁","groups":[{"no":"第一组","sentences":["他虽然算不上最聪明的，可是却非常刻苦。","今年工作不好找，能进公司已经算得上幸运了。","儿女对他很好，身体也不错，他算得上是一个幸福的老人。"],"src":"课文例句：不论从哪方面说，玲玲都算得上幸运。"},{"no":"第二组","sentences":["他从小就想当老师，现在终于好梦成真了。","父母希望孩子能当班长，认为这是一个锻炼。","毕业以后，他当了医生。"],"src":"课文例句：连本来没特别想要的，也全都有了，比如当班干部，当三好学生。"},{"no":"第三组","sentences":["一不小心，我把刚买的手机给丢了。","学费要 1000 块钱，这可把我给吓住了。","你把我的书给放哪儿了？"],"src":"课文例句：第一次来的时候，她把玲玲的玩具给弄脏了。"},{"no":"第四组","sentences":["你的脸色不太好，是不是哪儿不舒服？","看到车撞了人，他脸色都变了。","他虽然八十多岁了，可是脸色特别好。"],"src":"课文例句：她把玲玲的玩具给弄脏了，玲玲的脸色很难看。"},{"no":"第五组","sentences":["他趁放假，去了一趟西藏。","我想趁周末把作业写完。","趁着现在没事，我打算去一趟超市。"],"src":"课文例句：小女孩从此再也不敢走进玲玲的房间，最多趁玲玲不注意躲到门口张望。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，在括号中正确的选项后画 √","items":[{"n":1,"q":"玲玲为（写一篇作文　梦想没有实现）发愁。","extra":[],"text":"玲玲为（写一篇作文　梦想没有实现）发愁。"},{"n":2,"q":"钟点工的女儿比玲玲（大　小）。","extra":[],"text":"钟点工的女儿比玲玲（大　小）。"},{"n":3,"q":"（玲玲　钟点工的女儿）是个什么都不缺的孩子。","extra":[],"text":"（玲玲　钟点工的女儿）是个什么都不缺的孩子。"},{"n":4,"q":"她们俩（是　不算是）好朋友。","extra":[],"text":"她们俩（是　不算是）好朋友。"},{"n":5,"q":"玲玲送小女孩铅笔是因为（对不起　喜欢）她。","extra":[],"text":"玲玲送小女孩铅笔是因为（对不起　喜欢）她。"}],"ans":{"kind":"seq","vals":["√","√","√","√","√"],"raw":["1. 玲玲为（写一篇作文 √　梦想没有实现　）发愁。","2. 钟点工的女儿比玲玲（大　小 √）。","3. （玲玲 √　钟点工的女儿　）是个什么都不缺的孩子。","4. 她们俩（是　不算是 √）好朋友。","5. 玲玲送小女孩铅笔是因为（对不起 √　喜欢　）她。"]}},{"type":"mc","title":"三、根据课文第一段内容，选择正确答案","items":[{"n":1,"q":"关于玲玲，下面哪一条是错的？","extra":["A. 长得漂亮　　B. 父母很爱她","C. 学习很好　　D. 想当班干部"],"text":"关于玲玲，下面哪一条是错的？","opts":[{"k":"A","t":"长得漂亮"},{"k":"B","t":"父母很爱她"},{"k":"C","t":"学习很好"},{"k":"D","t":"想当班干部"}]},{"n":2,"q":"玲玲的烦恼是什么？","e ra":[],"text":"（　　）农村的孩子（　　），能来城里读书很幸运。"}],"bank":["要求：①","请先独立填写答案","②","填好后同学之间可以讨论","③","最后听录音"],"ans":{"kind":"blanks","vals":[["脸色"],["当"],["当"],["把","给"],["算得上"],["脸色"],["趁"],["算得上"],["算不上"],["对","来说"]],"raw":["算得上/算不上　当　把……给……　脸色　趁　对……来说","要求：① 请先独立填写答案　② 填好后同学之间可以讨论　③ 最后听录音","1. 他的（脸色）很难看，像是刚生过病。","2. 小时候，我想长大以后（当）警察。","3. （当）老师的好处就是比较自由。","4. 他的解释（把）我（给）说糊涂了。","5. 我连房子都买不起，怎么（算得上）有钱人？","6. 他每次喝完酒，（脸色）就变红了。","7. 孩子（趁）父母不在家，偷偷玩儿电脑游戏。","8. 虽然她是全职太太，可她写书、炒股票，（算得上）一个能人。","9. 我跟他只是认识，（算不上）朋友。","10. （对）农村的孩子（来说），能来城里读书很幸运。"]}}]},{"no":13,"title":"关于望子成龙","warm":{"blocks":[{"t":"p","n":"1","text":"很多父母希望，孩子的理想人生是这样的：进好幼儿园→进好小学→考上好初中→考上好高中→考上好大学→找到好工作→有个好家庭→幸福人生。谈谈你的看法。"},{"t":"p","n":"2","text":"很多父母为了实现这个目标，让孩子参加课外辅导班，辅导班一般都在周六或者周日，所以即使在周末，也能看到很多孩子背着书包去“上学”，有的孩子寒暑假也要上这些辅导班。请看下面的招生广告，你能看懂吗？"},{"t":"p","n":"3","text":"下面是小学三年级数学辅导班的题目，你能做对吗？"},{"t":"p","n":"","text":"下图一共有几个三角形？"}],"table":{"head":["课程","招生对象","教材","课次/时长/收费","限招人数","学习目标","寒假暑假","春季秋季"],"rows":[["口语","5-6岁，已完成《剑桥少儿英语》","《Speaking Fun》","8次/2小时/900元","18","提高英语兴趣与表达","7.15-7.23　1.18-1.26","周六/日"]]}},"vocab":[{"w":"望子成龙","p":"wàng zǐ chéng lóng","pos":"（成）","def":"to long to see one’s son (child) become a dragon, i.e. win success in the world"},{"w":"歇","p":"xiē","pos":"（动）","def":"to have a rest, to take a rest"},{"w":"逛","p":"guàng","pos":"（动）","def":"to stroll, to wander"},{"w":"傻","p":"shǎ","pos":"（形）","def":"stupid, foolish"},{"w":"淘汰","p":"táotài","pos":"（动）","def":"to eliminate through selection or competition"},{"w":"加重","p":"jiāzhòng","pos":"（动）","def":"to increase, to make or get heavier"},{"w":"负担","p":"fùdān","pos":"（名）","def":"burden, load, encumbrance"},{"w":"高中","p":"gāozhōng","pos":"（名）","def":"senior, high school"},{"w":"出人头地","p":"chū rén tóu dì","pos":"（成）","def":"to stand out among one’s fellows, (to become outstanding)"},{"w":"落后","p":"luòhòu","pos":"（形）","def":"backward, underdeveloped"},{"w":"算了","p":"suàn le","pos":"","def":"to let it go"}],"text":["① 张艳：李霞，怎么星期六、星期天休息两天，你好像越歇越累了？","李霞：可不是嘛，我这周末两天，一天都没闲着，比上班还累。","男：都干吗去啦？","李霞：星期六上午看我爸、我妈，下午看他爸、他妈。","男：那星期天呢？","李霞：星期天儿子上课，上午上数学班，下午是外语班。孩子上课，我就得逛街，一天没休息，你说累不累。","张艳：又一个望子成龙的。现在望子成龙的太多啦。你说，咱们小时候，什么班也不上，天天玩儿，不是也长大了吗？也没比他们傻多少。","李霞：张艳，你这话我就不爱听，怎么望子成龙啦，人家都学你不学，等着淘汰呐！","张艳：那就是都望子成龙呗。","② 张艳：跟你说心里话，我们孩子从小，我就什么班也没让他上过，我不想加重孩子的负担。你看看初中生已经有多少门课了，我算了算，我们孩子初二，整整 13 门课。原来咱们上学的时候，星期六也要上课，现在他们一星期就上五天课，反而比咱们还累。你再看看孩子那作业，咱们小时候做过那么难的题吗？","男：张艳说得对。我们孩子上初三更可怜了，根本就没玩儿的时间，更不用说看电视了，老师说了，想上高中、特别是想上好高中，非得报班不可。","李霞：是呀，总不能让孩子连高中也不上吧。","男：我觉得不少家长没想让孩子出人头地，只希望将来孩子有个好点儿的工作。","李霞：这话说得对。如果咱们就生在农村，教育落后也就算了，现在不是，在大城市你不给孩子创造学习的条件，那孩子不就被淘汰了吗？","张艳：听你们俩这么说，我觉得家长也是没办法。","李霞：是啊，要不怎么别人一说我望子成龙，我就想跟他急呢。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：淘汰；负担；反而；更不用说；……算了","groups":[{"no":"第一组","sentences":["我的手机用了五年了，该淘汰了。","淘汰的电脑不能随便扔掉，不然会污染环境。","这个学校实行淘汰制，学习不好的学生就得回家。"],"src":"课文例句：人家都学你不学，等着淘汰呐！"},{"no":"第二组","sentences":["孩子的学习负担太重了，没有玩儿的时间。","学校总是说要减轻学生的负担，可是作业越来越多。","他们家工作的人少，吃饭的人多，负担可不小。"],"src":"课文例句：我们孩子从小，我就什么班也没让他上过，我不想加重孩子的负担。"},{"no":"第三组","sentences":["他从来不锻炼身体，身体反而特别好，真奇怪！","在四月一号那天骗人，人们不但不生气，反而会觉得有趣。","出国旅游的人不但没有减少，反而增加了 10%。"],"src":"课文例句：原来咱们上学的时候，星期六也要上课，现在他们一星期就上五天课，反而比咱们还累。"},{"no":"第四组","sentences":["我从来没听说过老师的故乡，更不用说去过那里了。","他本来就不喜欢吃这种传统食品，更不用说自己做了。","他连家乡都没离开过，更不用说出国了。"],"src":"课文例句：我们孩子上初三更可怜了，根本就没玩儿的时间，更不用说看电视了。"},{"no":"第五组","sentences":["这道题不会做就算了，明天问问老师。","现在人们很少写信，有事打个电话就算了。","丢了就算了，再买个新的，反正你的手机也该淘汰了。"],"src":"课文例句：如果咱们就生在农村，教育落后也就算了，现在不是，在大城市你不给孩子创造学习的条件，那孩子不就被淘汰了吗？"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，在括号中正确的选项后画 √","items":[{"n":1,"q":"一共有（两个　三个）人说话。","extra":[],"text":"一共有（两个　三个）人说话。"},{"n":2,"q":"他们谈论的是自己的（孩子　学生）。","extra":[],"text":"他们谈论的是自己的（孩子　学生）。"},{"n":3,"q":"他们都认为，孩子的学习负担（很重　不重）。","extra":[],"text":"他们都认为，孩子的学习负担（很重　不重）。"},{"n":4,"q":"他们都是（农村人　城里人）。","extra":[],"text":"他们都是（农村人　城里人）。"},{"n":5,"q":"最后，他们（找到了　没找到）解决问题的好办法。","extra":[],"text":"最后，他们（找到了　没找到）解决问题的好办法。"}],"ans":{"kind":"seq","vals":["√","√","√","√","√"],"raw":["1. 一共有（两个　三个 √） ,{"t":"p","n":"","text":"公园（　　）"},{"t":"p","n":"","text":"俱乐部（　　）"},{"t":"p","n":"","text":"电视（　　）"},{"t":"p","n":"","text":"书（　　）"},{"t":"p","n":"","text":"家（　　）"},{"t":"p","n":"","text":"网上世界（　　）"}],"table":null},"vocab":[{"w":"幼儿园","p":"yòu’éryuán","pos":"（名）","def":"kindergarten"},{"w":"播放","p":"bōfàng","pos":"（动）","def":"to broadcast, to transmit by radio"},{"w":"弹","p":"tán","pos":"（动）","def":"to play (the piano, guitar, etc.)"},{"w":"钢琴","p":"gāngqín","pos":"（名）","def":"piano"},{"w":"优","p":"yōu","pos":"（形）","def":"excellent, superior"},{"w":"孤独","p":"gūdú","pos":"（形）","def":"lonely, solitary, lonesome"},{"w":"书呆子","p":"shūdāizi","pos":"（名）","def":"bookworm, pedant"},{"w":"同龄人","p":"tónglíng rén","pos":"","def":"peer, contemporary"},{"w":"交往","p":"jiāowǎng","pos":"（动）","def":"to associate"},{"w":"尝试","p":"chángshì","pos":"（动）","def":"to try, to have a go at"},{"w":"网络","p":"wǎngluò","pos":"（名）","def":"Internet"},{"w":"资源","p":"zīyuán","pos":"（名）","def":"resource, material"},{"w":"独生子女","p":"dúshēng zǐnǚ","pos":"","def":"only child"},{"w":"伙伴","p":"huǒbàn","pos":"（名）","def":"companion, friend, pal"},{"w":"赞成","p":"zànchéng","pos":"（动）","def":"to approve, to endorse, to agree with"},{"w":"观点","p":"guāndiǎn","pos":"（名）","def":"point of view"},{"w":"限制","p":"xiànzhì","pos":"（动）","def":"to restrict, to limit, to confine"}],"text":["① 新学期开始的时候，7 岁的女孩王一凡没有像其他小朋友一样背着书包去上学，因为她正在家自学。认识她的人都惊讶地问：“不去学校上学，完全在家自学，能行吗？”","昨天，记者采访了王一凡的妈妈。","王一凡的妈妈是一家幼儿园的园长，一凡大部分的生活和学习时间就是在妈妈的办公室里度过的。记者走进办公室，只见录音机正播放着英语，一凡就坐在桌子旁，认真练习英语听力。","记者：一凡的一天是怎么过的呀？是不是一直在读书呀？","妈妈：上午在一个京剧学校练习 3 个小时的京剧，下午弹两个小时的钢琴，接下来开始学习课本，一直到晚上。全天算下来，学习课本的时间只有 4 个小时。","记者：她从什么时候就开始学习了？","妈妈：从 4 岁开始，我就指导她学习。7 岁，就学完了小学的所有课程，还参加了小学毕业考试，成绩全是优。现在，她开始学习初中课程，英语已经掌握了 2000 多单词，语文学到了初中第二册。","记者：那以后有什么打算？","妈妈：我想先让她学一年英语，然后再用六年时间学中学的课程，我希望她 14 岁考上一所外语大学。","② 记者：孩子不去学校，会不会很孤独？","妈妈：我不会把孩子培养成书呆子，其实，除了上课不在学校以外，孩子还是会跟同龄人交往的，她并不孤独。","记者：您能辅导所有的课程吗？","妈妈：现在没问题，以后要是课程难了，我会尝试“网络教育”，网上的资源太丰富了，想找什么都能找到。","对于王一凡的学习方法，朱先生发表了不同看法。","朱先生：我认为不让孩子进学校读书的做法不好，现在家里都是独生子女，本来就缺少伙伴，上学了，同龄的孩子在一起，才能学会怎么跟别人交往。如果离开学校，读再多的书，有再多的知识，也不一定有用。","记者也听到了赞成的观点。","刘女士：我很赞成这种自学的方法，我的孩子 8 岁了，现在上小学三年级，每天很早起","床去上学，中午也不能休息，晚上回家除了写作业，还是写作业，而且孩子的一些爱好在学校里也受到了限制，让人感觉教育方法有点问题。如果换一种学习方式，肯定比现在要好。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：算上；交往；本来；赞成；除了……还是……","groups":[{"no":"第一组","sentences":["我的工资不太多，可算上奖金，就不少了。","每天上 4 小时汉语课，一周算下来，有 20 小时。","他们公司很小，算上老板只有 5 个人。"],"src":"课文例句：全天算下来，学习课本的时间只有 4 个小时。"},{"no":"第二组","sentences":["我认识他，可是交往不太多。","孩子们很喜欢和同龄人交往。","只有在和平的环境下，两国人民才能正常交往。"],"src":"课文例句：除了上课不在学校以外，孩子还是会跟同龄人交往的。"},{"no":"第三组","sentences":["他本来想赚一笔钱的，没想到却赔了。","那间屋子本来就不大，四个人一起租就显得很挤了。","我本来出来得很早，可路上堵车，还是迟到了。"],"src":"课文例句：现在家里都是独生子女，本来就缺少伙伴，上学了，同龄的孩子在一起，才能学会怎么跟别人交往。"},{"no":"第四组","sentences":["对他的做法，有人赞成，有人反对。","去旅行？太好了，我举双手赞成！","我可不赞成让孩子上各种辅导班。"],"src":"课文例句：我很赞成这种自学的方法。"},{"no":"第五组","sentences":["小学生的负担真重，除了作业，还是作业。","他别的事不干，每天除了上网，还是上网。","快要高考了，妈妈除了唠叨，还是唠叨，我都烦死了。"],"src":"课文例句：晚上回家除了写作业，还是写作业。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，在括号中正确的选项后画 √","items":[{"n":1,"q":"王一凡没去上学，是因为她（在家自学　年龄太小）。","extra":[],"text":"王一凡没去上学，是因为她（在家自学　年龄太小）。"},{"n":2,"q":"她妈妈（自己　请老师）教她。","extra":[],"text":"她妈妈（自己　请老师）教她。"},{"n":3,"q":"妈妈希望她以后能上（中学　大学）。","extra":[],"text":"妈妈希望她以后能上（中学　大学）。"},{"n":4,"q":"对于在家学习，另外两个家长的看法（不一样　一样）。","extra":[],"text":"对于在家学习，另外两个家长的看法（不一样　一样）。"}],"ans":{"kind":"seq","vals":["√","√","√","√"],"raw":["1. 王一凡没去上学，是因为她（在家自学 √　年龄太小　）。","2. 她妈妈（自己 √　请老师　）教她。","3. 妈妈希望她以后能上（中学　大学 √）。","4. 对于在家学习，另外两个家长的看法（不一样 √　一样　）。"]}},{"type":"tf","title":"三、根据课文第一段内容，判断正误","items":[{"n":1,"q":"7 岁的孩子应该上小学了。","extra":[],"text":"7 岁的孩子应该上小学了。"},{"n":2,"q":"王一凡没去上学，还在上幼儿园。","extra":[],"text":"王一凡没去上学，还在上幼儿园。"},{"n":3,"q":"记者采访的时候，王一凡在练习英语听力。","extra":[],"text":"记者采访的时候，王一凡在练习英语听力。"},{"n":4,"q":"王一凡大部分时间是在家里度过的。","extra":[],"text":"王一凡大部分时间是在家里度过的。"},{"n":5,"q":"妈妈教王一凡唱京剧、弹钢琴。","extra":[],"text":"妈妈教王一凡唱京剧、弹钢琴。"},{"n":6,"q":"王一凡已经学完了小学的课程。","extra":[],"text":"王一凡已经学完了小学的课程。"},{"n":7,"q":"王一
