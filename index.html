—关门—"},{"t":"p","n":"2","text":"如果你想买衣服，你认为下面哪一项是最重要的？请排序（最重要的写1）。"},{"t":"p","n":"","text":"质量（　　）"},{"t":"p","n":"","text":"样子（　　）"},{"t":"p","n":"","text":"布料（　　）"},{"t":"p","n":"","text":"价钱（　　）"},{"t":"p","n":"","text":"牌子（　　）"},{"t":"p","n":"3","text":"你听说过“不正当竞争”（unfair competition）吗？下面哪些是“不正当竞争”？"},{"t":"p","n":"","text":"用别人的商标"},{"t":"p","n":"","text":"商店为了吸引顾客，把价值5万元的小汽车设为奖品"},{"t":"p","n":"","text":"买一送一"},{"t":"p","n":"","text":"买手机送话费"},{"t":"p","n":"","text":"偷别人的商业秘密"},{"t":"p","n":"","text":"假广告"}],"table":null},"vocab":[{"w":"西服","p":"xīfú","pos":"（名）","def":"Western-style suit"},{"w":"红火","p":"hónghuo","pos":"（形）","def":"prosperous"},{"w":"和蔼","p":"hé’ǎi","pos":"（形）","def":"kind, nice, amiable"},{"w":"布料","p":"bùliào","pos":"（名）","def":"cloth"},{"w":"规矩","p":"guīju","pos":"（名）","def":"established standard, rule"},{"w":"裁缝店","p":"cáifeng diàn","pos":"","def":"tailor’s shop"},{"w":"扣子","p":"kòuzi","pos":"（名）","def":"button"},{"w":"扣眼","p":"kòuyǎn","pos":"（名）","def":"buttonhole"},{"w":"缝","p":"féng","pos":"（动）","def":"to sew, to stitch"},{"w":"关门","p":"guān mén","pos":"","def":"to close the door, to stop operation"},{"w":"拜访","p":"bàifǎng","pos":"（动）","def":"to pay a visit, to call on"},{"w":"唯一","p":"wéiyī","pos":"（形）","def":"single, sole, only"},{"w":"原则","p":"yuánzé","pos":"（名）","def":"principle"},{"w":"震动","p":"zhèndòng","pos":"（动）","def":"to shock, to astonish"},{"w":"柜子","p":"guìzi","pos":"（名）","def":"cupboard, cabinet"}],"text":["① 在我们这座城里，提起“福记西服”，没有一个人不知道。二十多年来，生意一直很红火。其实，“福记西服”的价钱并不便宜，样子也不算时尚，甚至可以说，朱老板人虽然和蔼，做生意却有点儿奇怪。","比如有人自己拿布料上门，请老板做一套西服，布料太差的，朱老板一定拒绝。顾客要求特别的样子，老板也不接受。这样一来，推出去的生意还真不少。","有意思的是，店里的每个店员都像朱老板一样，谁接活儿，这个规矩也不变。听说这都是他们知道朱老板一件“西服上衣”的故事以后，才坚持这个规矩的。这是怎么回事呢？还得从朱老板很多年前在上海刚开裁缝店的时候说起。朱老板说：有一天来了一位顾客，拿着布料让我做一件西服，我一看布料说：“这布料太差了，做西服不值得。”顾客说：“你只管赚钱就行了，管什么布料？”我一想也对，就接了。接着，顾客又要求把扣子和扣眼缝得不一样高，我笑了笑说：“哪有这样的西服，那怎么穿哪？”顾客说：“你就这么做，只管赚钱就行了。”我又想，只要他给钱，有什么问题呢？就答应了。","② 没过多久，马路对面开了一家西服店，把我的生意全抢了。只要有客人去，那个店的老板就会拿出一件西服给他看，让对方摸摸布料，看看扣子，再看看商标——那是我的商标啊！我不得不关门了。临走时，我到对面那家店，拜访了他们的老板，原来正是来我这儿做西服的那个客人。我说：“我要走了，再也不回上海了，唯一的请求是，能不能让我买回自己做的那件西服。”他答应了，还对我说：“年轻人，钱虽然重要，原则却是更重要的啊！”我受到很大的震动。","几十年来，这件西服一直挂在“福记”的柜子里，每个店员打开柜子门拿东西都能看得到。","（选自刘墉《一件西服的传奇》）"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：甚至；拒绝；活儿；只管；临……","groups":[{"no":"第一组","sentences":["这家店越来越红火，做西服的，甚至要提前半年来排队。","最近我太忙了，甚至连给家里打电话的时间都没有了。","这不是一个地区的问题，是全国甚至全世界的问题。"],"src":"课文例句：“福记西服”的价钱并不便宜，样子也不算时尚，甚至可以说，朱老板人虽然和蔼，做生意却有点儿奇怪。"},{"no":"第二组","sentences":["他是顾客，我不好拒绝他的要求啊。","他总是不好意思拒绝别人。","他拒绝了一个高工资的工作，回到家乡去了。"],"src":"课文例句：有人自己拿布料上门，请老板做一套西服，布料太差的，朱老板一定拒绝。"},{"no":"第三组","sentences":["弟弟在家什么活儿也不干。","他们刚接了一个活儿，周末休息不了了。","司机愿意拉一个远点儿的活儿，近的活儿挣钱少。"],"src":"课文例句：店里的每个店员都像朱老板一样，谁接活儿，这个规矩也不变。"},{"no":"第四组","sentences":["不能只管挣钱，别的都不管。","他只管卖东西，从不注意东西的质量怎么样。","别只管自己吃，也得招呼客人啊。"],"src":"课文例句：你只管赚钱就行了，管什么布料？"},{"no":"第五组","sentences":["临去飞机场，我才发现没带护照。","临走的时候检查一下是不是关了电灯。","他临来北京上学的时候，去看了他的中学老师。"],"src":"课文例句：临走时，我到对面那家店，拜访了他们的老板。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"mc","title":"二、根据课文第一段内容，选择正确答案","items":[{"n":1,"q":"“福记西服”是一个什么店？","extra":["A. 服装店　　B. 裁缝店","C. 百货商店　　D. 布料店"],"text":"“福记西服”是一个什么店？","opts":[{"k":"A","t":"服装店"},{"k":"B","t":"裁缝店"},{"k":"C","t":"百货商店"},{"k":"D","t":"布料店"}]},{"n":2,"q":"下面哪一项不是“福记西服”的特点？","extra":["A. 价钱不便宜　　B. 样式不新潮","C. 老板不和蔼　　D. 做生意有点儿怪"],"text":"下面哪一项不是“福记西服”的特点？","opts":[{"k":"A","t":"价钱不便宜"},{"k":"B","t":"样式不新潮"},{"k":"C","t":"老板不和蔼"},{"k":"D","t":"做生意有点儿怪"}]},{"n":3,"q":"朱老板不做什么活儿？","extra":["A. 样式特别的　　B. 价格便宜的","C. 不时尚的　　D. 自己带布料的"],"text":"朱老板不做什么活儿？","opts":[{"k":"A","t":"样式特别的"},{"k":"B","t":"价格便宜的"},{"k":"C","t":"不时尚的"},{"k":"D","t":"自己带布料的"}]}],"ans":{"kind":"seq","vals":["B","C","A"],"raw":["1. “福记西服”是一个什么店？（B）","A. 服装店　　B. 裁缝店","C. 百货商店　　D. 布料店","2. 下面哪一项不是“福记西服”的特点？（C）","A. 价钱不便宜　　B. 样式不新潮","C. 老板不和蔼　　D. 做生意有点儿怪","3. 朱老板不做什么活儿？（A）","A. 样式特别的　　B. 价格便宜的","C. 不时尚的　　D. 自己带布料的"]}},{"type":"misc","title":"三、根据课文第一段内容，把顾客和朱老板的对话填在适当的位置","items":[],"note":"A. 你只管赚钱就行了，管什么布料？","ans":{"kind":"raw","text":["A. 你只管赚钱就行了，管什么布料？","B. 哪有这样的西服，那怎么穿哪？","C. 你就这么做，只管赚钱就行了。","D. 这布料太差了，做西服不值得。","有一天来了一位顾客，拿着布料让我做一件西服，我一看布料说：“（D）”顾客说：“（A）”我一想也对，就接了。接着，顾客又要求把扣子和扣眼缝得不一样高，我笑了笑说：“（B）”顾客说：“（C）”我又想，只要他给钱，有什么问题呢？就答应了。"],"raw":["A. 你只管赚钱就行了，管什么布料？","B. 哪有这样的西服，那怎么穿哪？","C. 你就这么做，只管赚钱就行了。","D. 这布料太差了，做西服不值得。","有一天来了一位顾客，拿着布料让我做一件西服，我一看布料说：“（D）”顾客说：“（A）”我一想也对，就接了。接着，顾客又要求把扣子和扣眼缝得不一样高，我笑了笑说：“（B）”顾客说：“（C）”我又想，只要他给钱，有什么问题呢？就答应了。"]}},{"type":"tf","title":"五、根据课文第二段内容，判断正误","items":[{"n":1,"q":"那件西服做得不好，是因为朱老板的技术不好。","extra":[],"text":"那件西服做得不好，是因为朱老板的技术不好。"},{"n":2,"q":"那位顾客故意要求朱老板做一件不合格的西服。","extra":[],"text":"那位顾客故意要求朱老板做一件不合格的西服。"},{"n":3,"q":"那件不合格的西服让朱老板的裁缝店关门了。","extra":[],"text":"那件不合格的西服让朱老板的裁缝店关门了。"},{"n":4,"q":"对门老板抢了朱老板的生意。","extra":[],"text":"对门老板抢了朱老板的生意。"},{"n":5,"q":"不合格的西服挂在对门西服店的柜子里。","extra":[],"text":"不合格的西服挂在对门西服店的柜子里。"},{"n":6,"q":"那个顾客就是开西服店的。","extra":[],"text":"那个顾客就是开西服店的。"}],"ans":{"kind":"seq","vals":["×","√","√","√","×","√"],"raw":["1. 那件西服做得不好，是因为朱老板的技术不好。（×）","2. 那位顾客故意要求朱老板做一件不合格的西服。（√）","3. 那件不合格的西服让朱老板的裁缝店关门了。（√）","4. 对门老板抢了朱老板的生意。（√）","5. 不合格的西服挂在对门西服店的柜子里。（×）","6. 那个顾客就是开西服店的。（√）"]}},{"type":"mc","title":"六、根据课文第二段内容，选择正确答案","items":[{"n":1,"q":"朱老板在什么时候听到“钱虽然重要，原则却是更重要的啊”这句话的？","extra":["A. 上海裁缝店关门时　　B. 在上海开裁缝店时","C. 当“福记西服”店老板时　D. “福记西服”关门时"],"text":"朱老板在什么时候听到“钱虽然重要，原则却是更重要的啊”这句话的？","opts":[{"k":"A","t":"上海裁缝店关门时"},{"k":"B","t":"在上海开裁缝店时"},{"k":"C","t":"当“福记西服”店老板时"},{"k":"D","t":"“福记西服”关门时"}]},{"n":2,"q":"让朱老板关门的那件西服是什么样的？","extra":["A. 布料很好　　B. 不能穿的","C. 样子新潮　　D. 没有商标"],"text":"让朱老板关门的那件西服是什么样的？","opts":[{"k":"A","t":"布料很好"},{"k":"B","t":"不能穿的"},{"k":"C","t":"样子新潮"},{"k":"D","t":"没有商标"}]},{"n":3,"q":"那个客人为什么请朱老板做一件不好的西服？","extra":["A. 跟他开玩笑　　B. 想看他懂不懂原则","C. 想抢走他的生意　　D. 想给他一个教训"],"text":"那个客人为什么请朱老板做一件不好的西服？","opts":[{"k":"A","t":"跟他开玩笑"},{"k":"B","t":"想看他懂不懂原则"},{"k":"C","t":"想抢走他的生意"},{"k":"D","t":"想给他一个教训"}]}],"ans":{"kind":"seq","vals":["A","B","C"],"raw":["1. 朱老板在什么时候听到“钱虽然重要，原则却是更重要的啊”这句话的？（A）","A. 上海裁缝店关门时　　B. 在上海开裁缝店时","C. 当“福记西服”店老板时　D. “福记西服”关门时","2. 让朱老板关 （　　）"},{"t":"p","n":"","text":"看他上什么网，然后决定是否同意（　　）"}],"table":null},"vocab":[{"w":"设置","p":"shèzhì","pos":"（动）","def":"to set (password), to set up"},{"w":"密码","p":"mìmǎ","pos":"（名）","def":"password"},{"w":"阳台","p":"yángtái","pos":"（名）","def":"balcony"},{"w":"卧室","p":"wòshì","pos":"（名）","def":"bedroom"},{"w":"存折","p":"cúnzhé","pos":"（名）","def":"deposit book, bankbook"},{"w":"破解","p":"pòjiě","pos":"（动）","def":"to crack (password)"},{"w":"修改","p":"xiūgǎi","pos":"（动）","def":"to change (password)"},{"w":"书房","p":"shūfáng","pos":"（名）","def":"study, study room"},{"w":"大吃一惊","p":"dà chī yī jīng","pos":"（成）","def":"to be greatly surprised or shocked"},{"w":"乱七八糟","p":"luànqībāzāo","pos":"（形）","def":"at sixes and sevens, in a hideous mess"},{"w":"户口本","p":"hùkǒuběn","pos":"（名）","def":"household register, residence booklet"},{"w":"费心","p":"fèixīn","pos":"（动）","def":"to give great care, to take much trouble"},{"w":"可惜","p":"kěxī","pos":"（形）","def":"unfortunate, pitiful"},{"w":"亲情","p":"qīnqíng","pos":"（名）","def":"love among family members"}],"text":["为了防止儿子随便用电脑，我们想了各种方法。把房门锁起来，他总是能找到钥匙；把房门钥匙带走，他竟然从阳台爬进我们的卧室。","没办法，我们给电脑设置了密码。我们家的存折密码都是儿子的生日，电脑密码也设置为儿子的生日。给电脑上把锁，看他还有什么办法。","星期天，我们有事出门，留下儿子一个人在家。下午回到家，儿子正坐在电脑前，眼睛玩儿得发直，连我们开门进屋都不知道。密码被他破解了。","我们赶紧修改密码。这次必须弄个又好记又让他破解不了的密码。我们决定换成他妈妈的生日来做密码。这孩子，我和他妈妈的生日，告诉他无数遍，可他就是记不住，这让我们很失望。","又一次出门，我告诉儿子，不准碰电脑。儿子说，我知道你们换了密码，想玩儿也打不开电脑啊。我觉得又好气又好笑，谁让你连爸爸妈妈的生日都记不住？","晚上回家，儿子果然安静地在做作业，呵呵，密码还是有用的。","可是，走进书房，我却大吃一惊，几只抽屉被翻得乱七八糟，就像小偷来过一样，户口本打开着。我马上明白了，看来儿子为了破解我们的密码，真是费了不少心。我相信他现在一定已经记住了我和他妈妈的生日，可惜不是因为亲情，而仅仅因为它们可能成为密码。","唉，又得改密码了。弄个简单的吧，儿子一下子就能破解；弄个复杂的吧，又担心连我们自己也会忘记。想来想去，妻子忽然说，用他奶奶名字的拼音，儿子不知道奶奶的名字，更不会想到我们会用他奶奶的名字来设置密码。","这仍然是一个简单的密码，母亲的名字只有九个拼音字母，但是，对儿子来说，这恐怕是一个他做梦也想不到的密码。","这次密码修改后，儿子果然一直没能破解。","电脑安全了，我却高兴不起来。","儿子不能破解我们的密码，无法随便打开电脑，这虽然是我的愿望，可是，他不能破解，也让我很失望。其实儿子只要对我们这个家，对自己的亲人多关注一点，我们设置的密码，就很容易破解。孩子，你很聪明，但你缺少的，是对自己亲人的了解和关心啊。","（选自孙道荣同名文章）"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：连……都……；谁让你……；费……；吧……吧；恐怕","groups":[{"no":"第一组","sentences"  water"},{"w":"白","p":"bái","pos":"（副）","def":"free of charge"},{"w":"品尝","p":"pǐncháng","pos":"（动）","def":"to taste"},{"w":"凭","p":"píng","pos":"（动）","def":"to base on, to act according to"},{"w":"泥土","p":"nítǔ","pos":"（名）","def":"earth, soil"},{"w":"市区","p":"shìqū","pos":"（名）","def":"urban district, downtown"},{"w":"楼面","p":"lóu miàn","pos":"","def":"surface of a building"},{"w":"招牌","p":"zhāopai","pos":"（名）","def":"shop sign, signboard"},{"w":"清洗","p":"qīngxǐ","pos":"（动）","def":"to clean, to wash, to launder"},{"w":"考察","p":"kǎochá","pos":"（动）","def":"to inspect, to investigate"},{"w":"破烂","p":"pòlàn","pos":"（名）","def":"junk, garbage"},{"w":"软卧","p":"ruǎnwò","pos":"（名）","def":"soft sleeper on a train"},{"w":"车厢","p":"chēxiāng","pos":"（名）","def":"railway carriage, compartment"},{"w":"愣","p":"lèng","pos":"（动）","def":"to be dumbfounded, to be dazed"}],"text":["① 两个乡下人出去打工。张欢想去上海，李念想去北京。可是在等火车时，又改变了主意，因为旁边的人说，上海人精明，外地人问路都收费；北京人心眼儿好，见到吃不上饭的人，不仅给吃的，还送旧衣服。","张欢想，还是北京好，挣不到钱也饿不死，幸亏火车还没到，不然真掉进了火坑。","李念想，还是上海好，给人带路都能挣钱，还有什么不能挣钱的？我幸亏还没上车，不然真要失去挣钱的机会了。","于是他们在退票的地方相遇了。原来要去北京的李念得到了去上海的票，要去上海的张欢得到了到北京的票。","去北京的张欢发现，北京果然好。他刚到北京的一个月，什么都没干，竟然没有饿着。不仅银行里的矿泉水可以白喝，而且大商场里欢迎品尝的点心也可以白吃。","② 去上海的李念发现，上海果然是一个可以赚钱的城市。干什么都可以赚钱。带路可以赚钱，看厕所可以赚钱，弄盆凉水让人洗脸可以赚钱。只要想点儿办法，再花点儿力气，都可以赚钱。","凭着乡下人对泥土的感情和认识，李念在郊区装了十包土，把这些土卖给不见泥土而又爱花的上海人。当天他在市区和郊区之间来回六次，赚了五十元钱。一年后，李念用卖土赚来的钱，竟然在大上海开了一间小小的花店。","后来，李念又有一个新的发现：一些商店楼面干净而招牌很脏，一打听才知道是清洗公司只洗楼面不洗招牌。他立刻抓住这一机会，办起一个清洗公司，专门清洗招牌。现在，他的公司已有150多个打工者，而且他还把公司开到了杭州和南京。","前不久，李念坐火车去北京考察清洗市场。在北京车站，一个捡破烂的人把头伸进软卧车厢，向他要一只啤酒瓶，就在递瓶时，两人都愣住了，因为五年前，他们换过一次票。","（选自刘燕敏同名文章）"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：不仅……还……；幸亏；白；凭着；打听","groups":[{"no":"第一组","sentences":["我不仅给公司拉到了活儿，还自己挣了一笔钱。","他不仅喜欢打篮球，还喜欢踢足球。","在学校外边租房子住，不仅能认识更多的朋友，还能了解中国人的生活。"],"src":"课文例句：北京人心眼儿好，见到吃不上饭的人，不仅给吃的，还送旧衣服。"},{"no":"第二组","sentences":["这次考试很难，幸亏我复习得好，要不然可能不及格。","他被车撞了，幸亏不太严重。","今天的雨可真大，幸亏我带了雨伞。"],"src":"课文例句：还是北京好，挣不到钱也饿不死，幸亏火车还没到，不然真掉进了火坑。"},{"no":"第三组","sentences":["这是赠品，白送的，不要钱。","如果您买这个电脑，我们就白给您一个电脑包。","天下没有白吃的午餐，一分努力，一分收获。"],"src":"课文例句：不仅银行里的矿泉水可以白喝，而且大商场里欢迎品尝的点心也可以白吃。"},{"no":"第四组","sentences":["张艺谋凭着他的电影得到了很多观众的喜爱。","他凭着聪明和努力找到了让人羡慕的工作。","他凭着对科学的热爱，开了一个科学网站。"],"src":"课文例句：凭着乡下人对泥土的感情和认识，李念在郊区装了十包土，把这些土卖给不见泥土而又爱花的上海人。"},{"no":"第五组","sentences":["跟您打听一下，这附近有房子出租吗？","他从朋友那儿打听到，这个公司在招人。","第一次见面，不要打听别人的收入、家庭和婚姻情况。"],"src":"课文例句：一些商店楼面干净而招牌很脏，一打听才知道是清洗公司只洗楼面不洗招牌。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"tf","title":"三、根据课文第一段内容，判断正误","items":[{"n":1,"q":"开始，张欢想去上海，李念想去北京。","extra":[],"text":"开始，张欢想去上海，李念想去北京。"},{"n":2,"q":"因为听说在北京有人送吃的、送衣服，张欢改变了去北京的打算。","extra":[],"text":"因为听说在北京有人送吃的、送衣服，张欢改变了去北京的打算。"},{"n":3,"q":"李念听说去上海问路都可以收费，李念决定不去北京，去上海。","extra":[],"text":"李念听说去上海问路都可以收费，李念决定不去北京，去上海。"},{"n":4,"q":"张欢觉得北京好，是因为在北京挣不到钱，也饿不死。","extra":[],"text":"张欢觉得北京好，是因为在北京挣不到钱，也饿不死。"},{"n":5,"q":"李念觉得上海好，是因为上海挣钱的机会多。","extra":[],"text":"李念觉得上海好，是因为上海挣钱的机会多。"},{"n":6,"q":"张欢和李念在退火车票的地方相遇了。","extra":[],"text":"张欢和李念在退火车票的地方相遇了。"},{"n":7,"q":"张欢到北京一个月什么也没干，也没饿着。","extra":[],"text":"张欢到北京一个月什么也没干，也没饿着。"},{"n":8,"q":"喝北京银行大厅里的矿泉水不收费。","extra":[],"text":"喝北京银行大厅里的矿泉水不收费。"},{"n":9,"q":"北京大商场里的点心都可以随便吃，而且不花钱。","extra":[],"text":"北京大商场里的点心都可以随便吃，而且不花钱。"}],"ans":{"kind":"seq","vals":["√","×","√","√","√","√","×","√","×"],"raw":["1. 开始，张欢想去上海，李念想去北京。（√）","2. 因为听说在北京有人送吃的、送衣服，张欢改变了去北京的打算。（×）","3. 李念听说去上海问路都可以收费，李念决定不去北京，去上海。（√）","4. 张欢觉得北京好，是因为在北京挣不到钱，也饿不死。（√）","5. 李念觉得上海好，是因为上海挣钱的机会多。（√）","6. 张欢和李念在退火车票的地方相遇了。（√）","7. 张欢到北京一个月什么也没干，也没饿着。（×）","8. 喝北京银行大厅里的矿泉水不收费。（√）","9. 北京大商场里的点心都可以随便吃，而且不花钱。（×）"]}},{"type":"tf","title":"四、根据课文第二段内容，判断正误","items":[{"n":1,"q":"李念卖花盆土一天就赚了五十块钱。","extra":[],"text":"李念卖花盆土一天就赚了五十块钱。"},{"n":2,"q":"一年后，李念就开始在花店打工了。","extra":[],"text":"一年后，李念就开始在花店打工了。"},{"n":3,"q":"后来李念在上海办起了一个小型清洗公司，专门擦洗招牌。","extra":[],"text":"后来李念在上海办起了一个小型清洗公司，专门擦洗招牌。"},{"n":4,"q":"如今，李念的公司已经发展得十分不错了。","extra":[],"text":"如今，李念的公司已经发展得十分不错了。"},{"n":5,"q":"在北京的火车站候车厅，张欢和李念又相遇了。","extra":[],"text":"在北京的火车站候车厅，张欢和李念又相遇了。"},{"n":6,"q":"再相遇时，李念在软卧车厢里。","extra":[],"te 婚"},{"t":"opt","k":"C","text":"孩子可以建议父母离婚"},{"t":"opt","k":"D","text":"应该规定离婚非法"},{"t":"opt","k":"E","text":"结婚以前人们应该签合同保证不离婚"}],"table":null},"vocab":[{"w":"提供","p":"tígōng","pos":"（动）","def":"to provide, to supply"},{"w":"僵","p":"jiāng","pos":"（形）","def":"deadlocked, reaching an impasse"},{"w":"分手","p":"fēnshǒu","pos":"（动）","def":"to break up"},{"w":"绝对","p":"juéduì","pos":"（副）","def":"absolutely, definitely"},{"w":"温馨","p":"wēnxīn","pos":"（形）","def":"warm and fragrant, cosy"},{"w":"怀念","p":"huáiniàn","pos":"（动）","def":"to cherish the memory of, to think of"},{"w":"亲手","p":"qīnshǒu","pos":"（副）","def":"with one's own hands, personally"},{"w":"上帝","p":"Shàngdì","pos":"（名）","def":"God"},{"w":"遗憾","p":"yíhàn","pos":"（形）","def":"regretful, pitiful"},{"w":"震惊","p":"zhènjīng","pos":"（动）","def":"to be shocked, to be astonished"},{"w":"陷入","p":"xiànrù","pos":"（动）","def":"to sink into, to fall into"},{"w":"沉思","p":"chénsī","pos":"（名）","def":"editation"},{"w":"深情","p":"shēnqíng","pos":"（名）","def":"deep feeling, deep affection"}],"text":["朋友开了家餐厅，叫“离婚餐厅”，是专门为“和平离婚”的人提供方便的。目的是让他们在这里友好地吃完最后一顿，然后友好地说一声“再见”。","正好，我们公司的一对夫妻闹僵了，说是也要到“离婚餐厅”吃上最后一顿，然后分手。可我绝对不希望他们分手，就和我的朋友商量好了，提前在这里准备下了“温馨”。","在他俩订好的那个小房间里正播放着好听的音乐，使人想起春天温柔的小雨。那天，他俩点好菜后，我的朋友按我设计的方案，亲自下厨房，然后端来一盘名叫“怀念”的菜，并告诉他们：“这个菜，是妻子亲手教给我的，可是，她已经不在了，到上帝那儿去了……”果然，听到这句话，那对想要离婚的夫妻吃惊地看了我朋友一眼，好像在他脸上写着一首叫做“遗憾”的诗。","当这对想要离婚的一男一女正举起酒杯，一个漂亮的小女孩儿出现在他们面前，这小女孩儿是我妹妹的女儿，当然我也告诉了她应该怎么做。她轻轻开门进去，送上一束花，对他们说：“这是我爸爸妈妈最喜欢的花，可是，他们已经离婚了。”听到这儿，那对快要离婚的夫妻感到深深的震惊，然后陷入沉思，陷入对过去的回忆……","这时，我通过电视，播出一首爱情歌曲。听着听着，奇迹出现了，那对想要离婚的男女流着眼泪站了起来，深情地看着对方。男人说：“咱们为什么要离婚呢？为了这歌，为了这菜，为了这温馨的小屋，我们应该永远在一起！”","这时，我突然出现，对他们说：“你们本来就是最好的一对。”","后来，那本来闹得挺厉害的一对还专门谢过我呢。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：专门；提供；分手；……好了；……着……着","groups":[{"no":"第一组","sentences":["这本书是专门写给小学生看的，非常容易。","你不用专门来看我。","为了参加这个会议，我专门买了一件西服。"],"src":"课文例句：朋友开了家餐厅，叫“离婚餐厅”，是专门为“和平离婚”的人提供方便的。"},{"no":"第二组","sentences":["北京的画展很多，这给我提供了不少机会。","公司为大家提供住宿和电脑。","牛羊为人类提供了肉和奶。"],"src":"课文例句：“离婚餐厅”是专门为“和平离婚”的人提 building"},{"w":"想不开","p":"xiǎng bu kāi","pos":"","def":"to take things too seriously, take a matter to heart"},{"w":"寻短见","p":"xún duǎnjiàn","pos":"","def":"to commit suicide"}],"text":["刘凯心里有了仇恨感，他来到这个城市三年了，四次失业，三次打工拿不到工资，还有两次挨了打。","刘凯现在做的这份工作是给一家广告公司挂横幅，每月的工资很少，这些钱只够他吃饭。他需要钱。每次看到老板从客户手里接过钱放进抽屉时，他的心就一个劲儿地跳。","这是一个非常危险的信号！他已经不能控制自己了！","但刘凯毕竟是一个善良的人，他在罪恶和善良之间挣扎，非常痛苦。现在，只要有一个小小的念头，就可以把他送上完全不同的道路。","这一天，他又看到老板把一大笔钱放进抽屉，当老板看到他时，对他大声喊道：“看什么看？还不去干活！”一个罪恶的念头突然产生了。他想让这胖胖的城里人受到惩罚。他准备今天晚上动手。","刘凯拿着横幅走出公司，他要继续干活，他要让胖老板看不出他有一点儿变化。","横幅需要挂在一栋高楼上，高楼有十层，他必须在天黑之前全部挂好。","不知什么时候，突然有人走上楼顶，那是一个中年男人，非常和蔼。","他说：“兄弟，你有什么想不开的？”","在城里，从来没有人叫过他“兄弟”。","刘凯呆在那里。","中年人说：“你有什么困难，看我能不能帮助你。”","刘凯更加奇怪了。","中年人说：“人这一生不容易，不能寻短见呀，你的父母会很伤心……”","刘凯忽然觉得中年人完全误会他了。他回过头来，吃惊地发现楼下站满了人。","中年人伸出手，眼里充满了爱，说：“兄弟，你过来。”","刘凯突然流泪了。他说：“我不是要寻短见，我是在挂广告横幅。”","中年人吃了一惊，但马上笑了……","刘凯被中年人带下楼的时候，他一直在流泪，他想给家里人打个电话。他想告诉家人，他在城里很好。","（选自流沙同名文章）"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：一个劲儿；控制；……什么……；想不开；误会","groups":[{"no":"第一组","sentences":["物价一个劲儿往上涨，可工资却没怎么涨。","记者采访他时，他一个劲儿地说：“对不起，我不清楚。”","他一个劲儿地问：“咱们什么时候去呀？”"],"src":"课文例句：每次看到老板从客户手里接过钱放进抽屉时，他的心就一个劲儿地跳。"},{"no":"第二组","sentences":["你应该学会控制自己的情绪，不能老发脾气。","中国实行计划生育政策，控制人口过快增长。","控制饮食，经常运动，能起到减肥的作用。"],"src":"课文例句：这是一个非常危险的信号！他已经不能控制自己了！"},{"no":"第三组","sentences":["看什么看？快去干活！","好什么好？我觉得一点儿意思都没有。","吃什么吃？饭菜都被他们吃光了。"],"src":"课文例句：看什么看？还不去干活！"},{"no":"第四组","sentences":["这么点儿事，有什么想不开的。","虽然失业了，你也别太想不开，大家一起帮你再找个好工作。","他非常坚强，怎么会因为想不开而自杀呢？"],"src":"课文例句：兄弟，你有什么想不开的？"},{"no":"第五组","sentences":["他们因为误会而分手，太可惜了。","生活习惯不一样，也会产生误会。","您别误会，我不是那个意思。"],"src":"课文例句：刘凯忽然觉得中年人完全误会他了。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，在括号中正确的选项后画√","items":[{"n":1,"q":"刘凯是（打工的　老板）。","extra":[],"text":"刘凯是（打工的　老板）。"},{"n":2,"q":"（中年人　刘凯）误会了（中年人　刘凯）。","extra":[],"text":"（中年人　刘凯）误会了（中年人　刘凯）。"},{"n":3,"q":"刘凯在（偷钱　挂横幅）的时候遇到了中年人。","extra":[],"text":"刘凯在（偷钱　挂横幅）的时候遇到了中年人。"},{"n":4,"q":"中年人以为刘凯要（挂横幅　自杀　偷钱）。","extra":["第19课 误会"],"text":"中年人以为刘凯要（挂横幅　自杀　偷钱）。 第19课 误会"} 孩子们呢，他们不会嫌电脑太旧吧？","老马：这个办法也行不通，你想啊，我这台老电脑，什么新软件都用不了，把那些过时软件交给孩子们，他们还是不能掌握新知识呀。","琳琳：你说的有道理。那就把它当垃圾扔了吧。","老马：这可万万不行，一台电脑里有700多种化学物质，很多都是有毒的，当垃圾扔了会造成污染。","琳琳：天哪，没想到电脑新的时候是个宝贝，一没用了，就变成不好处理的垃圾了。","老马：是啊，最好的办法就是电脑生产厂家对旧电脑回收利用。电脑里的塑料什么的，肯定可以再利用。","琳琳：这个办法好，中国现在有这样的厂家吗？","老马：我还没听说，要是有，我就不用为这台旧电脑发愁了。","琳琳：现在电脑的更新速度太快，我的一个朋友三年里都换了两台了，他也发愁怎么处理旧电脑呢。","老马：这还是个世界性的问题呢。昨天我看到一个报道说，美国被淘汰的电脑中也只有10%左右得到了回收利用。今后十年估计有15亿台电脑被淘汰，想想看，全世界得有多少台旧电脑啊？","琳琳：哎！我倒是觉得这里面有很大的机会。要是我能发现一种能回收利用旧电脑的方法，那我不就要赚大钱了吗？","老马：好啊，你今天就把这台旧电脑搬走吧，算我对你赚大钱的一点儿贡献。","琳琳：先别着急，在我发现这个办法以前，你的旧电脑还是先存在你家里吧。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：发愁；处理；心疼；嫌；行不通","groups":[{"no":"第一组","sentences":["快毕业了，可工作还没找到，真发愁呀。","现在，大多数中国人都不用为吃穿发愁了。","孩子的学习很让他发愁。"],"src":"课文例句：我正发愁怎么处理我那台旧的呢。"},{"no":"第二组","sentences":["我换新手机了，这个旧的怎么处理呀？","我有一些重要的事要处理，咱们回头再约时间吧。","这个问题很难处理，得多想想办法。"],"src":"课文例句：你不是也买了台新的吗？原来那台怎么处理的？"},{"no":"第三组","sentences":["别心疼钱了，该花就得花！","妈妈心疼女儿，每天都让她多睡一会儿再叫她起床。","看着他们这么浪费水，我真心疼。"],"src":"课文例句：买的时候好几千，才过两年，只卖了几百块，我心疼了半天呢。"},{"no":"第四组","sentences":["工资高的工作他嫌累，清闲的工作他又嫌工资低。","你给多少都可以，50块钱不嫌少，100块钱不嫌多。","孩子嫌妈妈啰唆，妈妈嫌孩子不认真。"],"src":"课文例句：要是捐献给贫困地区的孩子们呢，他们不会嫌电脑太旧吧？"},{"no":"第五组","sentences":["光吃肉、不吃饭的减肥方法肯定行不通。","这个理论不错，但在生活中行不通。","你的建议很好，但是不一定行得通。"],"src":"课文例句：这个办法也行不通。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，选择课文的主要内容是什么，在括号里画√（可以多选）","items":[{"n":1,"q":"怎么买电脑。","extra":[],"text":"怎么买电脑。"},{"n":2,"q":"怎么用电脑。","extra":[],"text":"怎么用电脑。"},{"n":3,"q":"怎么处理淘汰电脑。","extra":[],"text":"怎么处理淘汰电脑。"},{"n":4,"q":"淘汰电脑应该回收。","extra":[],"text":"淘汰电脑应该回收。"},{"n":5,"q":"旧电脑可以卖掉。","extra":[],"text":"旧电脑可以卖掉。"},{"n":6,"q":"电脑的价格。","extra":["第20课 怎么处理淘汰电脑"],"text":"电脑的价格。 第20课 怎么处理淘汰电脑"}],"ans":{"kind":"seq","vals":["","","√","√","√",""],"raw":["1. 怎么买电脑。（　）","2. 怎么用电脑。（　）","3. 怎么处理淘汰电脑。（√）","4. 淘汰电脑应该回收。（√）","5. 旧电脑可以卖掉。（√）","6. 电脑的价格。（　）","第20课 怎么处理淘汰电脑"]}},{"type":"multi","title":"三、听全文，在括号中正确的选项后画√","items":[{"n":1,"q":"（老马　琳琳）正在为怎么处理旧电脑发愁。","extra":[],"text":"（老马　琳琳）正在为怎么处理旧 哪儿？"},{"t":"p","n":"","text":"你有女/男朋友吗？"},{"t":"p","n":"","text":"你一个月挣多少钱？"},{"t":"p","n":"","text":"你多大了？"},{"t":"p","n":"","text":"你爸爸妈妈是干什么的？"},{"t":"p","n":"","text":"这件衣服在哪儿买的？多少钱？"},{"t":"p","n":"","text":"你为什么还不结婚？"}],"table":{"head":["能接受，因为……","不能接受，因为……"],"rows":[["别人问你工资/年龄/结婚没有"],["陌生人想跟你练习英语/日语……"],["不问你就翻看你的书/照片"],["吃饭时给你夹菜/劝酒"],["学校里，老师说你笨"],["天冷了，朋友提醒你多穿衣服"]]}},"vocab":[{"w":"分寸","p":"fēncùn","pos":"（名）","def":"proper limits for speech or action"},{"w":"题目","p":"tímù","pos":"（名）","def":"title, subject, topic"},{"w":"大方","p":"dàfang","pos":"（形）","def":"generous"},{"w":"好客","p":"hàokè","pos":"（形）","def":"hospitable"},{"w":"多余","p":"duōyú","pos":"（形）","def":"extra, spare"},{"w":"结论","p":"jiélùn","pos":"（名）","def":"conclusion"},{"w":"不安","p":"bù'ān","pos":"（形）","def":"uneasy, disturbed"},{"w":"传染","p":"chuánrǎn","pos":"（动）","def":"to infect, to be contagious"},{"w":"好心","p":"hǎoxīn","pos":"（名）","def":"kindness, good intention"},{"w":"劝酒","p":"quàn jiǔ","pos":"","def":"to urge sb. to drink more"},{"w":"夹菜","p":"jiā cài","pos":"","def":"to pick up food with chopsticks"},{"w":"自便","p":"zìbiàn","pos":"（动）","def":"at one's convenience, as one pleases"},{"w":"家长","p":"jiāzhǎng","pos":"（名）","def":"parent or guardian of a child"},{"w":"伤害","p":"shānghài","pos":"（动）","def":"to injure, to harm, to hurt"}],"text":["女：最近我看到一篇日本留学生写的作文，题目是《我看中国朋友》，文章说来中国以前就听说过，中国人大方、热情、好客。一次她生病了，也利用这个机会了解了中国人的热情。那是夏天，她得了感冒，挺厉害的，她的中国朋友看到她难受的样子，带上衣服就搬到她宿舍来住了，而她的宿舍又没有多余的床，中国朋友就直接睡在地上，为她送水、送饭、送药，照顾得非常周到。所以，日本学生得出结论，说中国人和日本人的想法真的是有区别的。日本人是这样想的：如果朋友病了，不应该去打扰她，应该让她好好休息，她想吃什么，需要什么，是朋友都要热情帮助；而作为病人呢，别人来自己的房间住也会觉得不安，因为怕自己把病传染给别人，如果是那样就更不好意思了。","男：听你讲完这事呀，我认为那位日本留学生的中国朋友的做法不能代表中国人，也不能代表中国人的热情。作为中国人，我认为那位中国学生的做法不太合适，我倒觉得日本人的想法比较好。因为跟别人在一起，做任何一件事，最重要的就是大家都觉得舒服，不能自己想怎么着就怎么着，不管别人愿意不愿意。热情当然是对的，但这么做事多少有点儿不讲分寸。","女：你这话我同意，做事是得讲分寸。不能一片好心，最后把人给弄烦了。比如在餐桌上劝酒、给别人夹菜，可能都有点儿不合适。","男：说得对，礼貌是需要的，礼貌一下，然后让别人自便最好。其实说话也是要讲分寸的。","女：比如说——？","男：比如说同样是批评学生，老师和家长就不一样，家长急了想说什么就说什么，老师就不行。有的话能说，有的话不能说，要是掌握不好分寸，伤害了孩子，不光是孩子不高兴，连家长也可能不愿意。","女：有道理，看来做事、说话都不容易，要动动脑子。","男：其实说来说去呀，分寸的意思就是，说话做事要掌握一个合适的度，多考虑考虑对方的感觉，你这么做对方是不是也愉快。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：多余；传染；代表；多少有点儿；讲……","groups":[{"no":"第一组","sentences":["我的宿舍里有一张多余的床，你可以过来住。","我在这里一切都很顺利，看来我的担心是多余的。","谁有多余的笔，我忘了带笔了。"],"src":"课文例句：她的宿舍又没有多余的床，中国朋友就直接睡在地上。"},{"no":"第二组","sentences":["很多传染病都是由动物传染给人的。","我感冒了，大家离我远点儿，别传染给你们。","快乐也是能传染的。"],"src":"课文例句：作为病人呢，别人来自己的房间住也会觉得不安，因为怕自己把病传染给别人。"},{"no":"第三组","sentences":["我代表学校欢迎各位同学！","玫瑰花代表爱情。","有一首好听的歌叫《月亮代表我的心》。"],"src":"课文例句：我认为那位日本留学生的中国朋友的做法不能代表中国人，也不能代表中国人的热情。"},{"no":"第四组","sentences":["他没能参加比赛，多少有点儿遗憾。","我怕他误会我，多少有点儿担心。","虽然他没有批评我，但多少有点儿不满意。"],"src":"课文例句：热情当然是对的，但这么做事多少有点儿不讲分寸。"},{"no":"第五组","sentences":["老师告诉刚上小学的孩子们要讲文明、讲礼貌。","一定要养成讲卫生的习惯，这样才不会得传染病。","做事要讲分寸，要不然别人会不高兴。"],"src":"课文例句：做事是得讲分寸。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，在括号中正确的选项后画√","items":[{"n":1,"q":"（对话中的女的　一个日本留学生）得了感冒。","extra":[],"text":"（对话中的女的　一个日本留学生）得了感冒。"},{"n":2,"q":"朋友搬到她的宿舍照顾她，她（很感谢　觉得不安）。","extra":[],"text":"朋友搬到她的宿舍照顾她，她（很感谢　觉得不安）。"},{"n":3,"q":"跟朋友吃饭时，（也要　不用）讲分寸。","extra":[],"text":"跟朋友吃饭时，（也要　不用）讲分寸。"},{"n":4,"q":"（父母　老师）批评孩子时更应该注意分寸。","extra":["第22课 分寸"],"text":"（父母　老师）批评孩子时更应该注意分寸。 第22课 分寸"}],"ans":{"kind":"seq","vals":["√","√","√","√"],"raw":["1. （对话中的女的　一个日本留学生√）得了感冒。","2. 朋友搬到她的宿舍照顾她，她（很感谢　觉得不安√）。","3. 跟朋友吃饭时，（也要√　不用）讲分寸。","4. （父母　老师√）批评孩子时更应该注意分寸。","第22课 分寸"]}},{"type":"tf","title":"三、根据课文内容，判断正误","items":[{"n":1,"q":"日本留学生认为中国人比日本人热情。","extra":[],"text":"日本留学生认为中国人比日本人热情。"},{"n":2,"q":"日本留学生得到中国朋友的帮助，很感激她。","extra":[],"text":"日本留学生得到中国朋友的帮助，很感激她。"},{"n":3,"q":"日本留学生担心把感冒传染给中国朋友。","extra":[],"text":"日本留学生担心把感冒传染给中国朋友。"},{"n":4,"q":"这个中国朋友的做法代表了中国人的热情。","extra":[],"text":"这个中国朋友的做法代表了中国人的热情。"},{"n":5,"q":"这个中国朋友的做法有点儿没分寸。","extra":[],"text":"这个中国朋友的做法有点儿没分寸。"},{"n":6,"q":"在餐桌上也要讲分寸。","extra":[],"text":"在餐桌上也要讲分寸。"},{"n":7,"q":"一个劲儿劝人喝酒是没分寸的。","extra":[],"text":"一个劲儿劝人喝酒是没分寸的。"},{"n":8,"q":"在餐桌上不给别人夹菜是不礼貌的。","extra":[],"text":"在餐桌上不给别人夹菜是不礼貌的。"},{"n":9,"q":"老师批评学生，学生和家长都不高兴。","extra":[],"text":"老师批评学生，学生和家长都不高兴。"},{"n":10,"q":"过分热情也是没分寸的表现。","extra":[],"text":"过分热情也是没分寸的表现。"},{"n":11,"q":"讲分寸就是说话做事要让双方都愉快。","extra":[],"text":"讲分寸就是说话做事要让双方都愉快。"}],"ans":{"kind":"seq","vals":["×","×","√","×","√","√","√","×","×","√","√"],"raw":["1. 日本留学生认为中国人比日本人热情。（×）","2. 日本留学生得到中国朋友的帮助，很感激她。（×）","3. 日本留学生担心把感冒传染给中国朋友。（√）","4. 这个中国朋友的做法代表了中国人的热情。（×）","5. 这个中国朋友的做法有点儿没分寸。（√）","6. 在餐桌上也要讲分寸。（√）","7. 一个劲儿劝人喝酒是没分寸的。（√）","8. 在餐桌上不给别人夹菜是不礼貌的。（×）","9. 老师批评学生，学生和家长都不高兴。（×）","10. 过分热情也是没分寸的表现。（√）","11. 讲分寸就是说话做事要让双方都愉快。（√）"]}},{"type":"mc","title":"四、根据课文内容，选择正确答案","items":[{"n":1,"q":"如果朋友生病了，日本人会怎么做？","extra":["A. 搬到他的房间去照顾他","B. 给他送水、送饭、送药","C. 不去打扰他，让他好好休息","D. 带他去医院"],"text":"如果朋友生病了，日本人会怎么做？","opts":[{"k":"A","t":"搬到他的房间去照顾他"},{"k":"B","t":"给他送水、送饭、送药"},{"k":"C","t":"不去打扰他，让他好好休息"},{"k":"D","t":"带他去医院"}]},{"n":2,"q":"男的认为日本留学生的中国朋友做得怎么样？","extra":["A. 没有分寸","B. 很热情","C. 不够热情","D. 让人烦"],"text":"男的认为日本留学生的中国朋友做得怎么样？","opts":[{"k":"A","t":"没有分寸"},{"k":"B","t":"很热情"},{"k":"C","t":"不够热情"},{"k":"D","t":"让人烦"}]},{"n":3,"q":"在餐桌上的什么行为是欠分寸的做法？","extra":["A. 自己夹菜","B. 使劲让酒","C. 争着付钱","D. 为别人点菜"],"text":"在餐桌上的什么行为是欠分寸的做法？","opts":[{"k":"A","t":"自己夹菜"},{"k":"B","t":"使劲让酒"},{"k":"C","t":"争着付钱"},{"k":"D","t":"为别人点菜"}]},{"n":4,"q":"关于批评学生，下列哪句话是对的？","extra":["A. 老师怎么批评都行","B. 老师说什么都不行","C. 老师可以不讲分寸","D. 老师的话不能超出范围"],"text":"关于批评学生，下列哪句话是对的？","opts":[{"k":"A","t":"老师怎么批评都行"},{"k":"B","t":"老师说什么都不行"},{"k":"C","t":"老师可以不讲分寸"},{"k":"D","t":"老师的话不能超出范围"}]},{"n":5,"q":"关于分寸的解释，下面哪句话是对的？","extra":["A. 分寸就是容忍对方的缺点","B. 分寸就是说话做事让对方满意","C. 分寸就是理解对方","D. 分寸就是说话做事掌握适当的度","第22课 分寸"],"text":"关于分寸的解释，下面哪句话是对的？","opts":[{"k":"A","t":"分寸就是容忍对方的缺点"},{"k":"B","t":"分寸就是说话做事让对方满意"},{"k":"C","t":"分寸就是理解对方"},{"k":"D","t":"分寸就是说话做事掌握适当的度 第22课 分寸"}]}],"ans":{"kind":"seq","vals":["C","A","B","D","D"],"raw":["1. 如果朋友生病了，日本人会怎么做？（C）","- A. 搬到他的房间去照顾他","- B. 给他送水、送饭、送药","- C. 不去打扰他，让他好好休息","- D. 带他去医院","2. 男的认为日本留学生的中国朋友做得怎么样？（A）","- A. 没有分寸","- B. 很热情","- C  bǎng","pos":"","def":"best-sellers list"},{"w":"评价","p":"píngjià","pos":"（名）","def":"evaluation, appraisement"},{"w":"搜索","p":"sōusuǒ","pos":"（动）","def":"to search for"},{"w":"查找","p":"cházhǎo","pos":"（动）","def":"to search for"},{"w":"出版社","p":"chūbǎnshè","pos":"（名）","def":"publisher, publishing house"},{"w":"合算","p":"hésuàn","pos":"（形）","def":"worthwhile"},{"w":"信用卡","p":"xìnyòngkǎ","pos":"（名）","def":"credit card"},{"w":"付款","p":"fù kuǎn","pos":"","def":"to pay a sum of money"},{"w":"快递","p":"kuàidì","pos":"（名）","def":"express delivery"},{"w":"订单","p":"dìngdān","pos":"（名）","def":"(purchase) order"},{"w":"免运费","p":"miǎn yùnfèi","pos":"","def":"free shipping, freight free"},{"w":"注册","p":"zhùcè","pos":"（动）","def":"to register"}],"text":["① 男：我发现在中国买东西，很多地方都可以还价，但是买书不行。","女：你可以试试上网买书啊，比书店便宜多了。我常去的网上书店叫当当网。","男：你每次都在网上书店买书吗？","女：我先到书店看看有什么好书，记下书名，然后再去网上书店买，这样就能买到又便宜又好的书了。一般来说，书店不打折，而网上书店都打折，有时可以打五折、六折，甚至更低，最贵的也可以打到八折。","男：我想买关于中国历史的书，应该怎么买？","女：咱们一起上网看看吧，网址是www.dangdang.com，这个网站还卖别的东西，你先找到图书，然后点击，可以看到图书的分类。","男：嗯，有小说、儿童、生活、教育，唉，工具书是什么？","女：工具书就是字典什么的，是学习的工具。你看，历史在这儿，你点击一下。","男：哦，这儿说历史书有一万三千六百二十七种呢，真不少。","② 男：可是如果我不知道书名，只想了解一下有什么好书，怎么办？","女：你看，这里有最新上架，架就是书架，最新上架就是新书。这儿还有畅销榜，就是买的人最多的书。这是最近一个星期的畅销榜，还有最近两个、三个星期的畅销榜。","男：什么是五星书？我知道五星饭店，五星书是不是最好的书？","女：对，这是根据读者的评价得出来的，如果你觉得这本书非常好，就可以给它五星。如果你愿意，也可以看看读者是怎么评价的。有时候，我不去书店，直接上网买书，就是根据读者的评价，有的书的评价有好几百条，不去书店，也能了解这本书怎么样。","③ 男：我想买一本《上下五千年》，怎么查？","女：你看见这个“搜索”了吗？“搜索”就是查找的意思，在前边打书名，然后点击搜索就行了。你试试。","男：一共有七百多种，怎么这么多？","女：这是不同出版社出版的，也有出版时间不一样的，有的书名也不一样，有《中华上下五千年》，也有《世界上下五千年》。","男：这本是八折，这本只有五折，便宜了一半呢。","女：是啊，在网上买书还是很合算的。","男：要用信用卡付钱吗？","女：可以用信用卡，不过我都选择“货到付款”，就是你拿到书了，再交钱。","男：他们从邮局给我寄书吗？","女：是快递公司送书，一般下了订单三四天以后就能收到书。","男：我还要付钱给快递公司吗？","女：不用，你看，这儿写着“全场免运费”，就是说所有的东西都是不收运费的。","男：这可真是又便宜又方便，我现在就想买。","女：别着急，你先得注册成为当当网的用户，来，我帮你注册。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：网……；分……；怎么这么……；合算；……费","groups":[{"no":"第一组","sentences":["那个网上书店的网址是什么？","我经常上网买东西。","他在网上认识了一个网友，正打算见面呢。"],"src":"课文例句：咱们一起上网看看吧，网址是www.dangdang.com，这个网站还卖别的东 hì","pos":"","def":"to go Dutch"},{"w":"各付各的","p":"gè fù gè de","pos":"","def":"to split the bill"},{"w":"流动性","p":"liúdòngxìng","pos":"（名）","def":"mobility"},{"w":"轮流","p":"lúnliú","pos":"（动）","def":"to do sth. in turn, to take turns"},{"w":"吃亏","p":"chīkuī","pos":"（动）","def":"to suffer losses"},{"w":"一次性","p":"yīcìxìng","pos":"（形）","def":"just once, one-off"},{"w":"远走高飞","p":"yuǎn zǒu gāo fēi","pos":"（成）","def":"to go far away"},{"w":"稳定","p":"wěndìng","pos":"（形）","def":"stable, steady"},{"w":"预期","p":"yùqī","pos":"（动）","def":"to expect, to anticipate"},{"w":"收益","p":"shōuyì","pos":"（名）","def":"profit, earnings, gains"},{"w":"相当于","p":"xiāngdāng yú","pos":"","def":"to be equal to"},{"w":"抚养","p":"fǔyǎng","pos":"（动）","def":"to foster, to raise, to bring up"},{"w":"晚年","p":"wǎnnián","pos":"（名）","def":"one's later years, old age"},{"w":"至于","p":"zhìyú","pos":"（连）","def":"as for, as to"},{"w":"重男轻女","p":"zhòng nán qīng nǚ","pos":"","def":"to regard men as superior to women, to prefer sons to daughters"},{"w":"嫁","p":"jià","pos":"（动）","def":"(of a woman) to marry"},{"w":"增强","p":"zēngqiáng","pos":"（动）","def":"to strengthen, to enhance, to reinforce"}],"text":["几个人一起去饭馆吃饭，通常中国人会由一个人买单，而西方人则喜欢 AA 制，大家各付各的，这是为什么呢？","经济学家常常用“流动性”来回答这个问题。在他们看来，以前的中国是农业社会，人的流动性较差。因此，一个人请客买单时，可以想到被请的人以后也会请他，大家轮流请客就是了，这次你请我，下次我请你，谁也不吃亏。而在西方，人的流动性强，一个人请别人的客，被请的人说不定这辈子再也见不到了，为了大家都不吃亏，各付各的是最好的选择。","实际上，中国一个人买单和西方人各付各的并没有什么不同：西方是一次性的 AA 制，中国人是分成多次的 AA 制，只不过时间拉长了。","“流动性”的概念还可以解释一些其他现象。比如：农村人为什么比城市人更喜欢生小孩？为什么大多数人更喜欢生儿子而不是女儿？跟城市相比，农村的流动性差，儿女们不太可能远走高飞，因此，生孩子能让父母们得到更稳定的预期收益，这就相当于父母先请孩子的客，把孩子抚养大。父母老了以后，再由孩子请父母的客，照顾他们，让他们有一个美好的晚年。至于城市，小孩的流动性大，长大以后说不定会到哪里去，父母想要依靠他们可不容易，预期收益就降低了。在这种情况下，少生儿女或者让儿女早一点儿独立就成为家长最合适的选择。至于“重男轻女”，道理就更简单：女儿长大以后要嫁出去，“流动性”比男孩儿高。","从上面的分析可以看出，如果有一天中国人也开始流行 AA 制，那很可能是因为中国人的“流动性”增强了。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：各……各……；只不过；跟……相比；相当于；至于","groups":[{"no":"第一组","sentences":["咱们各买各的，一个小时以后在商店门口见吧。","我们虽然住在一起，可是各做各的饭，各花各的钱。","他们各有各的房间，谁也不影响谁。"],"src":"课文例句：几个人一起去饭馆吃饭，通常中国人会由一个人买单，而西方人则喜欢AA制，大家各付各的。"},{"no":"第二组","sentences":["这只不过是一次小测验，别那么紧张。","我只不过是普通感冒，不用休息两个星期呀。","他只不过迟到了三分钟，你怎么这么生气？"],"src":"课文例句：西方是一次性的 AA 制，中国人是分成多次的 AA 制，只不过时间拉长了。"},{"no":"第三组","sentences":["跟听力相比，我的口语更好。","跟大城市相比，农村的空气新鲜多了。","跟几十年前相比，现在的气温越来越高。"],"src":"课文例句：跟城市相比，农村的流动性差。"},{"no":"第四组","sentences":["每年中国增加的人口为 1700 多万，相当于一个中等国家的人口。","那棵树有五十多米，相当于十几层楼那么高。","地铁一趟车能装一千多人，相当于十几辆公共汽车。"],"src":"课文例句：生孩子能让父母们得到更稳定的预期收益，这就相当于父母先请孩子的客，把孩子抚养大。"},{"no":"第五组","sentences":["假期我要去旅行，至于去哪儿，还没决定。","我决定参加 HSK 考试，至于他考不考，我不知道。","我必须回家过年，至于怎么回去，到时候再说吧。"],"src":"课文例句：至于城市，小孩的流动性大，长大以后说不定会到哪里去，父母想要依靠他们可不容易，预期收益就降低了。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，在括号中正确的选项后画√","items":[{"n":1,"q":"几个人一起吃饭，（西方人　中国人）喜欢一个人买单，（西方人　中国人）喜欢 AA 制。","extra":[],"text":"几个人一起吃饭，（西方人　中国人）喜欢一个人买单，（西方人　中国人）喜欢 AA 制。"},{"n":2,"q":"跟农村相比，城里人的流动性（强　差）。","extra":[],"text":"跟农村相比，城里人的流动性（强　差）。"},{"n":3,"q":"“流动性”可以解释的现象有：一个人请客还是 AA 制，（城里人　农村人）为什么更喜欢生孩子，为什么很多人喜欢生（女孩儿　男孩儿）。","extra":[],"text":"“流动性”可以解释的现象有：一个人请客还是 AA 制，（城里人　农村人）为什么更喜欢生孩子，为什么很多人喜欢生（女孩儿　男孩儿）。"}],"ans":{"kind":"seq","vals":["√","√","√"],"raw":["1. 几个人一起吃饭，（西方人　中国人√）喜欢一个人买单，（西方人√　中国人）喜欢 AA 制。","2. 跟农村相比，城里人的流动性（强√　差）。","3. “流动性”可以解释的现象有：一个人请客还是 AA 制，（城里人　农村人√）为什么更喜欢生孩子，为什么很多人喜欢生（女孩儿　男孩儿√）。"]}},{"type":"match","title":"三、根据课文内容，先把A或B填入前边的括号里，然后连线","left":["A. 流动性差　　B. 流动性强","（　　）大家轮流请客，谁也不吃亏。","（　　）以后说不定再也见不到了，吃饭各付各的。","（　　）孩子长大后留在父母身边，照顾父母。","（　　）孩子长大后远走高飞。","（　　）女儿要嫁出去。","搭配：少生孩子　喜欢生男孩　一人买单　AA 制　多生孩子"],"right":[],"ans":{"kind":"raw","text":["A. 流动性差　　B. 流动性强","（A）大家轮流请客，谁也不吃亏。　　少生孩子","（B）以后说不定再也见不到了，吃饭各付各的。　喜欢生男孩","（A）孩子长大后留在父母身边，照顾父母。　　一人买单","（B）孩子长大后远走高飞。　　AA 制","（B）女儿要嫁出去。　　多生孩子"],"raw":["A. 流动性差　　B. 流动性强","（A）大家轮流请客，谁也不吃亏。　　少生孩子","（B）以后说不定再也见不到了，吃饭各付各的。　喜欢生男孩","（A）孩子长大后留在父母身边，照顾父母。　　一人买单","（B）孩子长大后远走高飞。　　AA 制","（B）女儿要嫁出去。　　多生孩子"]}},{"type":"tf","title":"四、根据课文内容，判断正误","items":[{"n":1,"q":"几个中国人去餐馆吃饭，只有一个人愿意付钱。","extra":[],"text":"几个中国人去餐馆吃饭，只有一个人愿意付钱。"},{"n":2,"q":"在中国，一个人请客买单时，他认为被请的人以后也会请他 高飞），因此，生孩子能让父母们得到更（稳定）的预期收益，这就（相当于）父母先请孩子的客，把孩子抚养大。父母老了以后，再（由）孩子请父母的客，（照顾）他们，让他们有一个（美好）的晚年。","问：农村的流动性怎么样？有什么表现？“预期收益”指的是什么？","4. （至于）“重男轻女”，道理就更（简单）：女儿长大以后要嫁（出去），“流动性”比男孩儿高。","问：为什么多数人喜欢生儿子而不是女儿？"]}},{"type":"fill","title":"七、选词填空","items":[{"n":1,"q":"我们一起去健身房，不过（　　）运动。","extra":[],"text":"我们一起去健身房，不过（　　）运动。"},{"n":2,"q":"我（　　）开个玩笑，你千万别生气。","extra":[],"text":"我（　　）开个玩笑，你千万别生气。"},{"n":3,"q":"对这个问题，我们（　　）看法。","extra":[],"text":"对这个问题，我们（　　）看法。"},{"n":4,"q":"这种手机大小（　　）信用卡，重量只有 70 克。","extra":[],"text":"这种手机大小（　　）信用卡，重量只有 70 克。"},{"n":5,"q":"（　　）刚来的时候（　　），我能听懂的汉语越来越多了。","extra":[],"text":"（　　）刚来的时候（　　），我能听懂的汉语越来越多了。"},{"n":6,"q":"（　　）超市（　　），自由市场的东西便宜一点儿。","extra":[],"text":"（　　）超市（　　），自由市场的东西便宜一点儿。"},{"n":7,"q":"我们班要一起吃饭，（　　）AA 制还是老师请客，还没决定。","extra":[],"text":"我们班要一起吃饭，（　　）AA 制还是老师请客，还没决定。"},{"n":8,"q":"那是他们国家最大的节日，（　　）中国的春节。","extra":[],"text":"那是他们国家最大的节日，（　　）中国的春节。"},{"n":9,"q":"你丢的（　　）是辆旧自行车，再买一辆就行了。","extra":[],"text":"你丢的（　　）是辆旧自行车，再买一辆就行了。"},{"n":10,"q":"你的收入（　　）我的三倍，肯定比我压力大呀。","extra":[],"text":"你的收入（　　）我的三倍，肯定比我压力大呀。"},{"n":11,"q":"他要结婚了，（　　）新娘是谁，还是秘密。","extra":[],"text":"他要结婚了，（　　）新娘是谁，还是秘密。"}],"bank":["①","请先独立填写答案"],"ans":{"kind":"blanks","vals":[["各做各的"],["只不过"],["各有各的"],["相当于"],["跟","相比"],["跟","相比"],["至于"],["相当于"],["只不过"],["相当于"],["至于"]],"raw":["各V各的　只不过　跟……相比　至于　相当于","1. 我们一起去健身房，不过（各做各的）运动。","2. 我（只不过）开个玩笑，你千万别生气。","3. 对这个问题，我们（各有各的）看法。","4. 这种手机大小（相当于）信用卡，重量只有 70 克。","5. （跟）刚来的时候（相比），我能听懂的汉语越来越多了。","6. （跟）超市（相比），自由市场的东西便宜一点儿。","7. 我们班要一起吃饭，（至于）AA 制还是老师请客，还没决定。","8. 那是他们国家最大的节日，（相当于）中国的春节。","9. 你丢的（只不过）是辆旧自行车，再买一辆就行了。","10. 你的收入（相当于）我的三倍，肯定比我压力大呀。","11. 他要结婚了，（至于）新娘是谁，还是秘密。","要求","① 请先独立填写答案","② 填好后同学之间可以讨论","③ 最后听录音","第25课 孔雀的悲哀"]},"note":"要求　① 请先独立填写答案　② 填好后同学之间可以讨论　③ 最后听录音"}]},{"no":25,"title":"孔雀的悲哀","warm":{"blocks":[{"t":"p","n":"1","text":"你做过心理测试题吗？你相信吗？"},{"t":"p","n":"2","text":"下面是一组爱情心理测试题，请试着选择一下。"},{"t":"p","n":"","text":"（1）假如世界末日来临，你只能救一种动物，你会救哪一种？"},{"t":"p","n":"","text":"a. 兔　　b. 羊　　c. 鹿　　d. 马"},{"t":"p","n":"","text":"（2）如果你必须变成一种动物，你想变成哪一种？"},{"t":"p","n":"","text":"a. 狮子　　b. 猫　　c. 马　　d. 鸽子"},{"t":"p","n":"","text":"（3）如果你有能力使某种动物消失，你会选择哪一种？"},{"t":"p","n":"","text":"a. 狮子　　b. 蛇　　c. 鳄鱼　　d. 鲨鱼"},{"t":"p","n":"","text":"（4）有一天，你碰上了一种会说人话的动物，你希望是哪种动物？"},{"t":"p","n":"","text":"a. 羊　　b. 马　　c. 兔　　d. 鸟"},{"t":"p","n":"","text":"（5）在一个没有人的岛上，你只能选一种动物来陪你，你会选哪一种？"},{"t":"p","n":"","text":"a. 狗　　b. 猪　　c. 母牛　　d. 鸟"}],"table":null},"vocab":[{"w":"孔雀","p":"kǒngquè","pos":"（名）","def":"peacock"},{"w":"大象","p":"dàxiàng","pos":"（名）","def":"elephant"},{"w":"探险","p":"tànxiǎn","pos":"（动）","def":"to explore, to venture into the unknown"},{"w":"按照","p":"ànzhào","pos":"（介）","def":"according to"},{"w":"顺序","p":"shùnxù","pos":"（名）","def":"order, sequence"},{"w":"不出所料","p":"bù chū suǒ liào","pos":"（成）","def":"as expected"},{"w":"金钱","p":"jīnqián","pos":"（名）","def":"money"},{"w":"权力","p":"quánlì","pos":"（名）","def":"power, authority"},{"w":"意味","p":"yìwèi","pos":"（动）","def":"to mean, to imply"},{"w":"不以为然","p":"bù yǐ wéi rán","pos":"（成）","def":"to object to, to disapprove, to take exception to"},{"w":"例外","p":"lìwài","pos":"（名）","def":"exception"},{"w":"轻易","p":"qīngyì","pos":"（副）","def":"easily, rashly"},{"w":"悲哀","p":"bēi'āi","pos":"（名）","def":"sadness"}],"text":["朋友请我做了一个心理小测验。说有五种动物——老虎、猴子、孔雀、大象、狗。你到一个从来没去过的森林探险，带着这五种动物，周围的环境非常危险，你不可能把它们都带到最后，你不得不一一地放弃，你会按照什么样的顺序放弃呢？","我想了一会儿说：“孔雀、老虎、狗、猴子、大象。”朋友大笑起来说：果然不出我所料，你也首先放弃孔雀。知道孔雀代表什么吗？朋友一个一个向我解释：孔雀代表你的爱人，老虎代表金钱和权力，大象代表你的父母，狗代表你的朋友，猴子代表你的孩子。这个问题的答案意味着在困难的环境中你会首先放弃什么，让你看看你自己是什么样的人。","孔雀代表我的爱人？我一下子惊呆了，在困难的环境中我会最先放弃我的爱人，我是这样的人吗？我为什么会这样选择呢？是因为我觉得在困难的环境中孔雀是最不能帮助我的。","我对朋友的解释很不以为然，于是我也让许多人来做这个游戏，没有一个例外，人们首先放弃的都是孔雀，当我最后告诉他们答案时，他们的反应也像我一样，都很吃惊而且不相信。","有一天我又让一个朋友来做这个测验，他考虑了很久以后对我说：猴子、老虎、大象、狗、孔雀。我大吃一惊，他是我遇到的唯一一个选择最后放弃孔雀的人。","“为什么最后放弃孔雀？”我一个劲儿地问。他对我的问题倒吃了一惊，说：“你想想，在这所有的动物中，只有孔雀最没有保护自己的能力，我怎么能轻易放弃，让它陷入危险的环境中呢？”","我立刻明白了我的悲哀。我们在选择时，太多地考虑了别人能给我们什么帮助，而没有想到别人需要我们什么帮助。","（选自紫浣花同名文章）"],"comp":[],"exercises":[{"type":"pattern","title":"一、请仔细听录音，找出每组句子有什么共同的地方","groups":[{"no":"第一组","sentences ,"9. 他们只谈了两个月恋爱，就（轻易）地结婚了。","10. 成功的人都离不开家庭的支持，他也不（例外）。","要求","① 请先独立填写答案","② 填好后同学之间可以讨论","③ 最后听录音"]},"note":"要求　① 请先独立填写答案　② 填好后同学之间可以讨论　③ 最后听录音"}]},{"no":26,"title":"科学的睡眠","warm":{"blocks":[{"t":"p","n":"1","text":"关于睡眠，你知道什么？在你认为对的后面画√，错的后面画×。"},{"t":"opt","k":"A","text":"做梦就是睡眠不好。"},{"t":"opt","k":"B","text":"睡得越多，对身体越好。"},{"t":"opt","k":"C","text":"失眠的时候应该数羊。"},{"t":"opt","k":"D","text":"失眠的时候应该起来运动。"},{"t":"opt","k":"E","text":"黑眼圈是睡眠太少造成的。"},{"t":"opt","k":"F","text":"睡觉不到六小时等于没睡。"},{"t":"opt","k":"G","text":"晚上十点前入睡可以美容。"},{"t":"p","n":"","text":"（答案：见练习第十题）"},{"t":"p","n":"2","text":"你觉得什么是科学的睡眠？"}],"table":null},"vocab":[{"w":"睡眠","p":"shuìmián","pos":"（动）","def":"to sleep"},{"w":"保健","p":"bǎojiàn","pos":"（名）","def":"health protection, health care"},{"w":"信息","p":"xìnxī","pos":"（名）","def":"information, news"},{"w":"姿势","p":"zīshì","pos":"（名）","def":"posture, gesture"},{"w":"侧卧","p":"cèwò","pos":"","def":"to lie on one's side"},{"w":"仰卧","p":"yǎngwò","pos":"","def":"to lie on one's back"},{"w":"皮肤","p":"pífū","pos":"（名）","def":"skin"},{"w":"皱纹","p":"zhòuwén","pos":"（名）","def":"wrinkle"},{"w":"实施","p":"shíshī","pos":"（动）","def":"to implement, to carry out"},{"w":"失眠症","p":"shīmiánzhèng","pos":"","def":"insomnia"},{"w":"臀部","p":"túnbù","pos":"（名）","def":"buttock, rump"},{"w":"曲线","p":"qūxiàn","pos":"（名）","def":"curve, profile"},{"w":"请教","p":"qǐngjiào","pos":"（动）","def":"to consult"}],"text":["① 小雪很注意报纸上的一些美容保健方面的信息，也会耐心地按照报纸上说的去做。","第一天她在《科学报》上看到一条消息：“医学专家研究发现，科学的睡眠姿势应该是向左侧卧，左侧卧可使右脑得到充分的休息，对左脑也有好处，而且可以帮助消化。”这天夜里小雪就是按照报纸上说的向左侧卧睡的。","第二天小雪在《健康报》上看到一条消息：“医学专家研究发现，正确的睡眠姿势应该是向右侧卧，因为人的心脏在左侧。如果人睡眠时向左侧卧，会增加心脏的负担，而向右侧卧就可以减轻心脏的负担，对心脏有好处。”这天夜里小雪就是按照报纸上说的向右侧卧睡的。","第三天小雪在《美容报》上看到一条消息：“美容专家研究发现，睡眠的姿势对美容非常重要。最好的姿势是仰卧，仰卧时人的皮肤最放松，脸上不容易长皱纹。”","② 小雪觉得健康、美容都很重要，她决定每天晚上这三个姿势都要有。于是就买了三个闹钟：第一个闹钟定在夜里一点，第二个定在四点，第三个定在早晨七点。这样，小雪在晚上十点睡觉时是左侧卧，第一个闹钟响了以后，小雪换成右侧卧，第二个闹钟响了以后，小雪换成仰卧，当第三个闹钟响起时，小雪就该起床了。","这样的计划实施一个月以后，小雪得了失眠症。没了睡眠质量，还谈什么健康、美容呢？小雪决定去医院问一下医生。","小雪来医院，大夫检查了一下说：“你啊，最好趴着睡，为什么呢？你的臀部太平了，如果仰着睡不就压得更平了吗？还有，你的背很美，不要因为仰卧破坏了你背部的曲线。趴着睡还可以增加肚子的压力，给你的肚子减肥。”","小雪终于明白了，再请教别人，说不定就该站着睡了。她决定从今天晚上开始只让第三个闹钟响，因为她知道了科学的睡眠姿势，不用再睡得那么累了。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：增加；减轻；容易；谈什么；再……就……","groups":[{"no":"第一组","sentences":["随着人口的增加，污染也越来越厉害了。","跟五年前相比，他的工资增加了 10%。","他一直在减肥，不过体重没有减少，反而增加了。"],"src":"课文例句：如果人睡眠时向左侧卧，会增加心脏的负担。"},{"no":"第二组","sentences":["少留作业，可以减轻孩子的负担。","体重减轻了，心脏的负担也减轻了。","为了减轻工作的压力，他想了不少办法。"],"src":"课文例句：向右侧卧就可以减轻心脏的负担，对心脏有好处。"},{"no":"第三组","sentences":["夏天，吃的东西容易变坏。","你感冒了，吃点儿容易消化的东西吧。","有 HSK 成绩，容易找工作吗？"],"src":"课文例句：仰卧时人的皮肤最放松，脸上不容易长皱纹。"},{"no":"第四组","sentences":["连吃饭都成问题，还谈什么艺术？","没有自信，还谈什么成功？","每天忙得连吃饭的时间都没有，谈什么度假、休闲？"],"src":"课文例句：没了睡眠质量，还谈什么健康、美容呢？"},{"no":"第五组","sentences":["你再不来，我们就走了。","你再不睡觉，明天就该迟到了。","别喝了，再喝就醉了。"],"src":"课文例句：小雪终于明白了，再请教别人，说不定就该站着睡了。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听课文第一段内容，在括号中正确的选项后画√","items":[{"n":1,"q":"课文提到了（一种　两种　三种）报纸。","extra":[],"text":"课文提到了（一种　两种　三种）报纸。"},{"n":2,"q":"报纸提到了三种（睡眠　学习）的姿势。","extra":[],"text":"报纸提到了三种（睡眠　学习）的姿势。"},{"n":3,"q":"三张报纸的看法（一样　不一样）。","extra":[],"text":"三张报纸的看法（一样　不一样）。"}],"ans":{"kind":"seq","vals":["√","√","√"],"raw":["1. 课文提到了（一种　两种　三种√）报纸。","2. 报纸提到了三种（睡眠√　学习）的姿势。","3. 三张报纸的看法（一样　不一样√）。"]}},{"type":"table","title":"三、再听一遍，边听边填表（有多余的选项）","intro":"","bank":[{"k":"A","t":"仰卧"},{"k":"B","t":"向左侧卧"},{"k":"C","t":"向右侧卧"},{"k":"D","t":"减轻心脏负担"},{"k":"E","t":"不长皱纹"},{"k":"F","t":"使右脑得到休息"},{"k":"G","t":"使左脑得到休息"},{"k":"H","t":"可以减肥"},{"k":"I","t":"帮助消化"}],"qtable":[["报纸","睡觉的姿势","这种姿势的好处"],["《科学报》"],["《健康报》"],["《美容报》"]],"ans":{"kind":"table","table":[["报纸","睡觉的姿势","这种姿势的好处"],["《科学报》","B","F"],["《健康报》","C","D"],["《美容报》","A","E"]],"bank":[{"k":"A","t":"仰卧"},{"k":"B","t":"向左侧卧"},{"k":"C","t":"向右侧卧"},{"k":"D","t":"减轻心脏负担"},{"k":"E","t":"不长皱纹"},{"k":"F","t":"使右脑得到休息"},{"k":"G","t":"使左脑得到休息"},{"k":"H","t":"可以减肥"},{"k":"I","t":"帮助消化"}]}},{"type":"misc","title":"四、先猜一猜,再跟同学讨论一下","items":[{"n":1,"q":"小雪会用哪种姿势睡觉?","extra":[],"text":" text":"“餐具卫生消毒不好”占13.3%"},{"t":"p","n":"","text":"“纸巾和一次性筷子要另收费”占6.4%"},{"t":"p","n":"","text":"“设最低消费标准”占4.1%"},{"t":"note","text":"其他占1.9%"},{"t":"p","n":"2","text":"阅读上面的消费者满意度调查，你有什么想法？"}],"table":null},"vocab":[{"w":"化妆品","p":"huàzhuāngpǐn","pos":"（名）","def":"cosmetics"},{"w":"欣赏","p":"xīnshǎng","pos":"（动）","def":"to appreciate, to enjoy, to admire"},{"w":"口红","p":"kǒuhóng","pos":"（名）","def":"lipstick"},{"w":"眼圈","p":"yǎnquān","pos":"（名）","def":"rim of the eye"},{"w":"提醒","p":"tíxǐng","pos":"（动）","def":"to remind, to warn"},{"w":"毛病","p":"máobìng","pos":"（名）","def":"weakness, defect"},{"w":"看上","p":"kànshàng","pos":"（动）","def":"to take a fancy to, to settle on"},{"w":"过分","p":"guòfèn","pos":"（形）","def":"excessive"},{"w":"推荐","p":"tuījiàn","pos":"（动）","def":"to recommend"},{"w":"冷淡","p":"lěngdàn","pos":"（形）","def":"indifferent, aloof"},{"w":"省得","p":"shěngde","pos":"（连）","def":"so as to avoid"},{"w":"难处","p":"nánchu","pos":"（名）","def":"difficulty, trouble, problem"},{"w":"扣","p":"kòu","pos":"（动）","def":"to deduct, to dock"},{"w":"奖金","p":"jiǎngjīn","pos":"（名）","def":"bonus, premium, reward"}],"text":["① A（老张）：小刘，你刚买的化妆品呢？拿出来让我欣赏欣赏。","B（小刘）：咳，什么都没买，还生了一肚子气。","A：怎么了？现在的售货员不是挺热情的吗？","B：就是太热情了我才生气的。我本来是想买一支口红，刚一靠近化妆品柜台，一下子就上来三位小姐，这个说我们这个新产品是去黑眼圈的，您试试吧；那个说，这是专门去皱纹的，现在正优惠呢。这不是在提醒我：你有黑眼圈了，你长皱纹了。有这些毛病我自己还不知道呀！本来看着自己一天天变老，心里就够难受的了，这不是让我更烦吗？","A：是够让人生气的。我上星期天也遇上过一件烦人的事，我带女儿去买衣服，她试了一件，没看上，售货员一个劲儿劝我买，说我穿上肯定好。你说说，我女儿才二十岁，我都快五十了，穿的衣服能一样吗？","C：老张、小刘，要我说呀，售货员热情点儿，总比以前的冷淡好。那时候，他们多一句话也不愿意说，顾客还不是要生一肚子气？","B：看来你是没受过这种过分热情的气。","② C：我平时倒是不怎么逛商店，可有一次在饭店把我气坏了。那天我陪几个客人去吃饭，饭店的服务员特别热情，我心里还挺高兴。就让她推荐了几个菜，没想到她光推荐贵的，不点吧，在客人面前丢面子；点吧，花那么多钱又心疼。","A：其实不管是商店还是饭店，他们的唯一目的就是多卖钱。","B：这倒也没什么错，总比态度冷淡要好。不过我很希望能自己随便挑，随便看，需要售货员帮助的时候，他能热情介绍。","C：看来，售货员也该好好了解了解顾客的心理，省得过分热情，顾客还不满意。","A：其实售货员也有他们的难处，我的邻居就是售货员，有一次我跟他聊起来，他说如果他们不像现在这样给顾客介绍、推荐，经理就该扣他们奖金了。","B：这么说，是商店的经理们该学学顾客心理学了。","C：是啊，看来卖东西也不是件容易的事，既要热情，又不能过分，得让顾客高高兴兴地花钱，不能让人觉得你在骗他。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：欣赏；看上；总比；过分；省得","gro qǐshì","pos":"（名）","def":"announcement, notice"},{"w":"没准儿","p":"méizhǔnr","pos":"（动）","def":"maybe, probably"},{"w":"胶卷","p":"jiāojuǎn","pos":"（名）","def":"film, roll of camera film"},{"w":"洗（胶卷）","p":"xǐ（jiāojuǎn）","pos":"（动）","def":"to develop (a film)"},{"w":"侵犯","p":"qīnfàn","pos":"（动）","def":"to infringe on, to violate"},{"w":"隐私权","p":"yǐnsīquán","pos":"（名）","def":"privacy, right of privacy"},{"w":"为难","p":"wéinán","pos":"（动）","def":"to feel embarrassed or awkward, to find things difficult"}],"text":["记者：人们总说这个难，那个难，什么上学难，找工作难，看病难。可前两天却有位观众跟我说，想做件好事也挺难的。","今天我就给您讲讲做好事难的故事。王先生在长城上捡到一台照相机，而且很可能是两个外国人丢的。王先生是个热心人，拾金不昧，想尽快把相机还给失主。可怎么还？还给谁？王先生觉得真难。","老王：相机是在长城上捡到的，是两个外国人的，外国人丢了东西咱更得还给人家，让人家也知道知道咱中国人是拾金不昧的。","记者：怎么办？王先生首先想到的是长城地区的派出所。","回答是：没人报案，没办法找到失主，可以交到失物招领处。交到失物招领处吧，王先生可真不放心。咱中国人丢了东西都不一定能想到上失物招领处去找，更别说对什么都不熟悉的外国人了。于是好心的王先生决定还是自己去找失主。别的线索没有，王先生只记着那辆车。","老王：我去找车管局，外国人开的那辆车的车牌是红色的，北京这样的车可不多，一查就能缩小范围。可车管局的工作人员说这得保密，不给我查，看来找车管局行不通。","记者：王先生又想可以找报社登个启事，看报纸的人多，没准儿就有人认识失主。可他们的人说：“我们得考虑一下能不能登，现在还不能决定。”","记者：王先生说我捡着东西的都这么着急，丢了东西的不是更着急吗？这一等也不知道要等到什么时候。又有朋友给王先生出主意说，相机里还有 28 张照完了的胶卷，洗出来一看不就什么都清楚了吗？","王先生怀疑这是否侵犯了别人的隐私权。看来这个办法也不行。为了把这台相机还给失主，王先生跑了十几天，找了不少人，可这好事却没办成。没办法只有去失物招领处了。失物招领处的工作人员说：“其实我们也挺为难的，我们也希望有更好的办法和外国失主联系上。”"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：尽快；保密；没准儿；登；为难","groups":[{"no":"第一组","sentences":["我想尽快熟悉这里，就骑车到处跑、到处看。","我把旅行计划寄给你，希望你尽快给我回答。","这个问题，我们一定会尽快解决。"],"src":"课文例句：王先生是个热心人，拾金不昧，想尽快把相机还给失主。"},{"no":"第二组","sentences":["你放心，我肯定给你保密，跟谁都不说。","这件事你得给我保密啊。","他们打算结婚，可现在还保密呢。"],"src":"课文例句：可车管局的工作人员说这得保密，不给我查。"},{"no":"第三组","sentences":["咱们参加唱中国歌比赛吧，没准儿还能得奖呢。","他没准儿不来了吧，快打个电话问问。","A：你决定出国留学了吗？"],"src":"课文例句：王先生又想可以找报社登个启事，看报纸的人多，没准儿就有人认识失主。"},{"no":"第四组","sentences":["报纸上登了这次会议的照片。","你的文章登出来了吗？","他在杂志上登了征婚启事，希望能找到理想的爱人。"],"src":"课文例句：王先生又想可以找报社登个启事，看报纸的人多，没准儿就有人认识失主。"},{"no":"第五组","sentences":["大家都想跟明星合影，让他很为难。","让警察帮忙找失主，警察也很为难。","到底是出国留学还是在国内找工作，一家人都感到为难。"],"src":"课文例句：其实我们也挺为难的，我们也希望有更好的办法和外国失主联系上。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":n ）","def":"touching, moving, heart-warming"},{"w":"西式","p":"xīshì","pos":"（形）","def":"Western-style"},{"w":"中式","p":"zhōngshì","pos":"（形）","def":"Chinese-style"},{"w":"结合","p":"jiéhé","pos":"（动）","def":"to combine, to unite, to integrate"},{"w":"拜天地","p":"bài tiāndì","pos":"","def":"traditional Chinese wedding custom for the bride and groom to give thanks to the heaven and earth"},{"w":"交杯酒","p":"jiāobēijiǔ","pos":"（名）","def":"traditional Chinese wedding custom for bridge and groom to link arms to drink their first cup of wine together as a couple"},{"w":"婚纱","p":"hūnshā","pos":"（名）","def":"wedding dress"},{"w":"喜宴","p":"xǐyàn","pos":"（名）","def":"wedding banquet"},{"w":"敬酒","p":"jìng jiǔ","pos":"","def":"to propose or drink a toast"},{"w":"皇历","p":"huánglì","pos":"（名）","def":"almanac, lunar calendar including dos and don'ts for each day"},{"w":"吉利","p":"jílì","pos":"（形）","def":"auspicious, lucky"},{"w":"周年","p":"zhōunián","pos":"（名）","def":"anniversary"},{"w":"个性","p":"gèxìng","pos":"（名）","def":"personality, individuality"},{"w":"海底","p":"hǎidǐ","pos":"（名）","def":"seabed, seafloor"}],"text":["① 女：听众朋友，过几天就是“五一”了。“五一”是一年当中很多人选择结婚的日子。我们今天请来了著名的婚礼主持人史先生。史先生已经做了十几年婚礼主持人，主持过一千多个婚礼。大家都说婚礼是个很花钱的事，如果婚礼出了什么问题，多半是钱的问题，是这样的吗，史先生？","男：不是这么回事，婚礼办得好坏不是钱决定的。前年我主持过一个婚礼，花了二十七万，除了豪华以外，我什么都没记住。我常对新郎新娘们说，婚礼的好坏不在于吃五百元一桌还是一千元一桌的饭，也不在于接新娘的车是不是豪华，而在于能不能让你记一辈子。","女：那有没有给您印象深的简朴的婚礼呢？","男：有啊。我主持过的最简朴的婚礼只花了一千多元。在一个很小的饭馆，来了十几个人，都是非常好的朋友。交换信物的时候，新娘给新郎她小时候穿的第一双鞋，她说：“这是我妈妈留给我的，陪伴我二十六年，我现在把它送给你，希望能和你一辈子走下去。”新郎给新娘他的第一张照片，他小时候特别苦，上中学了才第一次照相。","女：的确挺感人的。其实婚礼并不一定要豪华，更重要的是自己的感受。","② 女：您主持了十几年婚礼，现在人们更喜欢什么样的婚礼呢？","男：有人喜欢西式的，有人喜欢中式的，不少外国人都喜欢中式的。中国年轻人更喜欢中西结合的婚礼，既有中式的拜天地、喝交杯酒，也有西式的穿婚纱、交换信物。","女：那他们到底穿什么衣服呢？","男：不少人在婚礼开始的时候穿西式的婚纱，喜宴开始的时候换上中式服装，要不给别人敬酒不方便。","女：现在有不少人都选择节假日，或者根据皇历挑“吉利”的日子办婚礼，您对这么做有什么看法？","男：我觉得挑一个纪念日可能更有意义，比如俩人认识两周年纪念日，不一定大家都在节假日办婚礼，根据皇历挑日子就更没必要了。过去人们不愿意在晚上办婚礼，认为不吉利，现在越来越多的新人在晚上办婚礼了，这样做最大的好处就是大家下了班就可以过来，而且晚上灯光很漂亮。","女：我有一些朋友不愿意办婚礼，除了怕麻烦以外，还觉得不少婚礼都缺少特点。","男：你说的不错，现在个性婚礼也渐渐成为时尚了。我就主持过海底婚礼、足球场上的婚礼、热气球上的婚礼。","女：史先生，您今天讲的一定会给准备结婚的听众朋友很多帮助，我代表大家谢谢您。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：主持；多半；在于；……式；个性","groups":[{"no":"第一组","sentences":["这个会议是公司总经理主持的。","今天晚会的主持人是两位留学生，他们用汉语主持晚会。","我从来没主持过节目，真有点儿紧张。"],"src":"课文例句：史先生已经做了十几年婚礼主持人，主持过一千多个婚礼。"},{"no":"第二组","sentences":["如果我没接电话，多半是正在上课。","我们学校有 3000 多学生，多半是女生。","我在安排活动时，多半提前一个星期就作计划。"],"src":"课文例句：如果婚礼出了什么问题，多半是钱的问题。"},{"no":"第三组","sentences":["他能取得这么大的成功，原因就在于坚持。","成功的意义不在于挣了多少钱，而在于是否觉得幸福。","幸福不仅在于享受，更在于创造价值。"],"src":"课文例句：婚礼的好坏不在于吃五百元一桌还是一千元一桌的饭，也不在于接新娘的车是不是豪华，而在于能不能让你记一辈子。"},{"no":"第四组","sentences":["在中式婚礼中，新娘要穿红衣服。","他很会做西式点心，特别是蛋糕。","学校附近有几家日式餐厅。"],"src":"课文例句：中国年轻人更喜欢中西结合的婚礼，既有中式的拜天地、喝交杯酒，也有西式的穿婚纱、交换信物。"},{"no":"第五组","sentences":["每个孩子都是不同的，应该允许他们发展个性。","很多婚礼都差不多，缺少个性。","年轻人喜欢选择个性化的生活方式。"],"src":"课文例句：你说的不错，现在个性婚礼也渐渐成为时尚了。"}],"instr":"请仔细听录音，找出每组句子有什么共同的地方","ans":null},{"type":"multi","title":"二、听全文，在括号中正确的选项后画√","items":[{"n":1,"q":"对话中的女的是（电台记者　要结婚的人）。","extra":[],"text":"对话中的女的是（电台记者　要结婚的人）。"},{"n":2,"q":"史先生的工作是（婚礼主持人　婚姻介绍人）。","extra":[],"text":"史先生的工作是（婚礼主持人　婚姻介绍人）。"},{"n":3,"q":"他们讨论的话题是（西方人　现代人）的婚礼。","extra":[],"text":"他们讨论的话题是（西方人　现代人）的婚礼。"}],"ans":{"kind":"seq","vals":["√","√","√"],"raw":["1. 对话中的女的是（电台记者√　要结婚的人）。","2. 史先生的工作是（婚礼主持人√　婚姻介绍人）。","3. 他们讨论的话题是（西方人　现代人√）的婚礼。"]}},{"type":"tf","title":"三、根据课文第一段内容，判断正误","items":[{"n":1,"q":"“五一”节时，结婚的人很多。","extra":[],"text":"“五一”节时，结婚的人很多。"},{"n":2,"q":"简朴的婚礼也会给人留下深刻印象。","extra":[],"text":"简朴的婚礼也会给人留下深刻印象。"},{"n":3,"q":"花钱少的婚礼肯定办不好。","extra":[],"text":"花钱少的婚礼肯定办不好。"},{"n":4,"q":"花了二十七万的婚礼其实并不豪华。","extra":[],"text":"花了二十七万的婚礼其实并不豪华。"},{"n":5,"q":"一千元一桌的饭还不如五百元一桌的好吃。","extra":[],"text":"一千元一桌的饭还不如五百元一桌的好吃。"},{"n":6,"q":"史先生主持过的最简朴的婚礼花了不到一千元。","extra":[],"text":"史先生主持过的最简朴的婚礼花了不到一千元。"},{"n":7,"q":"这个简朴的婚礼很感人。","extra":[],"text":"这个简朴的婚礼很感人。"},{"n":8,"q":"新娘结婚的时候二十六岁。","extra":[],"text":"新娘结婚的时候二十六岁。"},{"n":9,"q":"婚礼上，妈妈送给新娘她小时候穿的鞋。","extra":[],"text":"婚礼上，妈妈送给新娘她小时候穿的鞋。"},{"n":10,"q":"新郎把自己的相片送给新娘做信物。","extra":[],"text":"新郎把自己的相片送给新娘做信物。 2 lind"},{"w":"天堂","p":"tiāntáng","pos":"（名）","def":"paradise, heaven"},{"w":"天使","p":"tiānshǐ","pos":"（名）","def":"angel"},{"w":"地狱","p":"dìyù","pos":"（名）","def":"hell, inferno"},{"w":"鄙视","p":"bǐshì","pos":"（动）","def":"to despise, to look down upon"},{"w":"灵魂","p":"línghún","pos":"（名）","def":"soul, spirit"},{"w":"赛跑","p":"sàipǎo","pos":"（动）","def":"to run a race"},{"w":"速度","p":"sùdù","pos":"（名）","def":"speed"},{"w":"肉体","p":"ròutǐ","pos":"（名）","def":"flesh, human body"},{"w":"养成","p":"yǎngchéng","pos":"（动）","def":"to form, to acquire, to contract"},{"w":"献出","p":"xiànchū","pos":"（动）","def":"to devote, to offer, to dedicate"},{"w":"刹那","p":"chànà","pos":"（名）","def":"instant, split second"},{"w":"羽毛","p":"yǔmáo","pos":"（名）","def":"feather, plume"},{"w":"狂奔","p":"kuángbēn","pos":"（动）","def":"to run rapidly, to run like mad"}],"text":["一天，盲人带着他的导盲犬过马路时，被一辆失去控制的汽车撞死，他的导盲犬为了保护主人，也被撞死了。","主人和狗一起到了天堂门前。","一个天使拦住他俩，说：“对不起，现在天堂只剩下一个位置，你们两个中必须有一个去地狱。”","主人一听，连忙问：“我的狗又不知道什么是天堂，什么是地狱，能不能让我来决定谁去天堂呢？”","天使鄙视地看了这个主人一眼，她说：“很抱歉，每个灵魂都是平等的，你们要通过比赛决定谁能上天堂。”","主人失望地问：“什么比赛呢？”","天使说：“这个比赛很简单，就是赛跑，从这里跑到天堂的大门，谁先到达，谁就可以上天堂。不过，你也别担心，因为你已经死了，所以不再是盲人，而且灵魂的速度跟肉体没关系，越善良的人跑得越快。”","主人想了想，同意了。","天使让主人和狗准备好，就宣布赛跑开始。她以为主人为了进天堂，会拼命往前跑，谁知道主人一点儿也不忙，慢慢地往前走着。更令天使吃惊的是，那条导盲犬也没有跑，它在旁边慢慢跟着，一步都不离开主人。天使突然明白了：多年来这条导盲犬已经养成了习惯，永远跟着主人，在主人的前方保护他。自私的主人，正是利用了这一点，他只要在天堂门口叫狗停下就可以自己进天堂了。","天使看着这条狗，心里很难过，她大声对狗说：“你已经为主人献出了生命，现在，你这个主人不再是盲人，你也不用领着他走路了，你快跑进天堂吧！”","可是，无论是主人还是他的狗，都像是没有听到天使的话一样，仍然慢慢地往前走，好像散步似的。","果然，离终点还有几步的时候，主人发出一声命令，狗听话地坐下了，天使鄙视地看着主人。","这时，主人笑了，他对天使说：“我终于把我的狗送到天堂了，我最担心的就是它根本不想上天堂，只想跟我在一起……所以我才想帮它决定，请你照顾好它。”","主人又说：“能用比赛的方式决定真是太好了，只要我再让它往前走几步，它就可以上天堂了。不过它陪伴了我那么多年，这是我第一次可以用自己的眼睛看着它，所以我忍不住想要慢慢地走，多看它一会儿。如果可以的话，我真希望永远看着它走下去。不过天堂到了，那才是它该去的地方，请你照顾好它。”","说完，主人向狗发出了前进的命令，就在狗到达终点的一刹那，主人像一片羽毛似的落向了地狱的方向。他的狗见了，急忙转过身，追着主人狂奔。天使张开翅膀追过去，想要抓住导盲犬，不过那是世界上最善良的灵魂，速度远比所有的天使都快。","导盲犬又跟主人在一起了，即使在地狱，导盲犬也永远守护着它的主人。"],"comp":[],"exercises":[{"type":"pattern","title":"一、句式练习：决定；谁……谁……；养成；像……似的；远比","groups":[{"no":"第一组","sentences":["毕业以后去   if(!vs.length) return;

  const en = vs.filter(v=>/^en/i.test(v.lang||''));
  V.zh = pick(zh, ZH_NAMES) || best(zh);
  V.en = pick(en, EN_NAMES) || best(en);
  V.ready = true;
  paintVoice();
}
function shortName(v){ return v ? String(v.name).replace(/\s*\(.*?\)/g,'').replace(/\s*Online.*$/i,'').trim() : '未检测到'; }
function paintVoice(){
  const el = $('#voicetag');
  if(!SPEAK_OK){ el.classList.add('warn'); el.querySelector('span').textContent='浏览器不支持朗读'; return; }
  if(!V.zh && !V.en){ el.classList.add('warn'); el.querySelector('span').textContent='未检测到语音'; return; }
  el.classList.remove('warn');
  el.querySelector('span').textContent = '中文 ' + shortName(V.zh) + ' · 英文 ' + shortName(V.en);
  el.title = '点击重新检测语音';
  document.querySelectorAll('.vzh').forEach(x=>x.textContent = shortName(V.zh));
  document.querySelectorAll('.ven').forEach(x=>x.textContent = shortName(V.en));
}
function voiceFor(lang){ return lang==='en' ? (V.en || V.zh) : (V.zh || V.en); }

let single = null;
function stopRead(){
  if(SPEAK_OK) speechSynthesis.cancel();
  if(single){ single.classList.remove('reading'); single = null; }
  stopSeq(true);
}
function cleanText(t){
  return String(t||'').replace(/^§/,'').replace(/[（(]\s*(?:　|\s)*[）)]/g,' ').replace(/\s+/g,' ').trim();
}
function speak(text, lang, done){
  if(!SPEAK_OK){ if(done) done(); return; }
  const fire = () => {
    const u = new SpeechSynthesisUtterance(text || '');
    const v = voiceFor(lang);
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = lang==='en' ? 'en-US' : 'zh-CN'; }
    u.rate = state.rate; u.pitch = 1;
    u.onend = u.onerror = () => { if(done) done(); };
    try { speechSynthesis.speak(u); } catch(e){ if(done) done(); }
  };
  if(speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(fire,60); }
  else fire();
}
function readNode(node){
  const txt = cleanText(node.dataset.rdText || node.textContent);
  if(!txt) return;
  if(node.classList.contains('reading')){ stopWarm(); stopRead(); return; }
  stopWarm();
  stopRead();
  node.classList.add('reading'); single = node;
  speak(txt, node.dataset.rd || 'zh', () => { node.classList.remove('reading'); if(single===node) single=null; });
}

/* ---------------- 畅所欲言 · 连读 ---------------- */
const wseq = { active:false, token:0 };
function warmBtn(){ return document.getElementById('warm-read'); }
function paintWarmBtn(){
  const b = warmBtn(); if(!b) return;
  b.classList.toggle('primary', wseq.active);
  const l = b.querySelector('.lbl'); if(l) l.textContent = wseq.active ? '停止' : '连读';
}
function stopWarm(){
  wseq.active = false; wseq.token++;
  document.querySelectorAll('#warm .reading').forEach(n=>n.classList.remove('reading'));
  paintWarmBtn();
}
function readWarm(){
  if(wseq.active){ stopWarm(); stopRead(); return; }
  stopRead();
  const nodes = Array.from(document.querySelectorAll('#warm .warm .rd[data-rd="zh"]'))
    .filter(n=>cleanText(n.dataset.rdText || n.textContent));
  if(!nodes.length || !SPEAK_OK) return;
  wseq.active = true;
  const my = ++wseq.token;
  paintWarmBtn();
  const step = k => {
    if(!wseq.active || my !== wseq.token) return;
    nodes.forEach(n=>n.classList.remove('reading'));
    if(k >= nodes.length){ stopWarm(); return; }
    const n = nodes[k];
    n.classList.add('reading');
    n.scrollIntoView({block:'center', behavior:'smooth'});
    const t0 = Date.now();
    speak(cleanText(n.dataset.rdText || n.textContent), 'zh', ()=>{
      if(!wseq.active || my !== wseq.token) return;
      if(Date.now() - t0 < 200){ stopWarm(); return; }
      setTimeout(()=>{ if(wseq.active && my === wseq.token) step(k+1); }, 240);
    });
  };
  step(0);
}

/* ---------------- 播放器（课文顺序朗读） ---------------- */
const seq = { jobs:[], i:0, active:false, paused:false, token:0 };
function curLesson(){ return DATA.find(x=>x.no===state.no) || DATA[0]; }
function paraNodes(){ return Array.from(document.querySelectorAll('.para')); }

function buildJobs(){
  const L = curLesson();
  const nodes = paraNodes();
  return L.text.map((t,i)=>({ text:t.replace(/^§/,''), node:nodes[i]||null }));
}
function stopSeq(silent){
  seq.active=false; seq.paused=false; seq.token++;
  if(SPEAK_OK && !silent) speechSynthesis.cancel();
  document.querySelectorAll('.para.playing').forEach(x=>x.classList.remove('playing'));
  $('#player').classList.remove('playing');
  setPMain(false);
}
function highlight(i){
  paraNodes().forEach((n,k)=>n.classList.toggle('playing', k===i));
  const n = paraNodes()[i];
  if(n && $('#player').classList.contains('show')) n.scrollIntoView({block:'center',behavior:'smooth'});
}
function updatePlayer(){
  const L = curLesson();
  $('#p-title').textContent = '第' + L.no + '课 · 课文';
  $('#p-sub').textContent = '第 ' + (seq.i+1) + ' / ' + L.text.length + ' 段';
  $('#p-prog').style.width = (L.text.length ? ((seq.i + (seq.active&&!seq.paused?0.5:0)) / L.text.length * 100) : 0) + '%';
}
function setPMain(playing){
  $('#pmain').innerHTML = playing
    ? '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
}
function playFrom(i){
  const jobs = buildJobs();
  if(!jobs.length) return;
  stopWarm();
  seq.jobs = jobs; seq.active=true; seq.paused=false; seq.token++; seq.fails=0;
  $('#player').classList.add('show'); $('#player').classList.add('playing');
  document.body.classList.add('has-player');
  setPMain(true);
  runJob(Math.max(0, Math.min(i, jobs.length-1)));
}
function runJob(i){
  if(!seq.active) return;
  if(i >= seq.jobs.length){ stopSeq(true); return; }
  seq.i = i; highlight(i); updatePlayer();
  const my = ++seq.token;
  const job = seq.jobs[i];
  const t0 = Date.now();
  speak(job.text, 'zh', () => {
    if(my !== seq.token || !seq.active || seq.paused) return;
    if(Date.now() - t0 < 200){ seq.fails = (seq.fails||0) + 1; } else { seq.fails = 0; }
    if(seq.fails >= 3){ stopSeq(true); $('#p-sub').textContent='未检测到可用中文语音'; return; }
    setTimeout(()=>{ if(seq.active && !seq.paused && my===seq.token) runJob(i+1); }, 300);
  });
}
function togglePlay(){
  if(seq.active && !seq.paused){           // 暂停
    seq.paused = true; seq.token++;
    if(SPEAK_OK) speechSynthesis.cancel();
    $('#player').classList.remove('playing'); setPMain(false);
  } else if(seq.active && seq.paused){      // 继续（重读当前段）
    seq.paused=false; $('#player').classList.add('playing'); setPMain(true);
    runJob(seq.i);
  } else {
    playFrom(0);
  }
}

function mcBlock(items, ansVals, derived, ghost){
  return `<ol class="items">${items.map((it,i)=>{
    const a = ansVals[i] || '';
    const opts = (it.opts||[]).map(o=>`
        <div class="optline" data-optc="${esc(o.k)}">
          <span class="k">${esc(o.k)}</span><span class="tx rd" data-rd="zh">${esc(o.t)}</span></div>`).join('');
    const ans = ghost ? '' : `<div class="ansline"><span class="lab">答案</span>
        <span class="blank mc" data-a="${esc(a)}"></span>
        ${derived?'<span class="derived">据课文</span>':''}</div>`;
    return `<li data-mc="${i}"><div class="q rd" data-rd="zh">${esc(it.q)}</div>
      <div class="opts">${opts}</div>${ans}</li>`;
  }).join('')}</ol>`;
}
function syncMC(){
  document.querySelectorAll('li[data-mc]').forEach(li=>{
    const b = li.querySelector('.ansline .blank');
    const on = b && b.classList.contains('on');
    const ans = b ? (b.dataset.a||'') : '';
    const set = ans ? ans.split(/[、,，\s]+/).filter(Boolean) : [];
    li.querySelectorAll('.optline').forEach(o=>o.classList.toggle('correct', on && set.includes(o.dataset.optc)));

function renderComp(L){

  return `<section class="sec" id="comp">
    <div class="sechead"><span class="sn">04</span><h3>理解练习</h3><span class="sen">Comprehension</span>
      <div class="right"><span class="note">点击“答案”后的空白显示选项</span></div></div>
    <div class="exsec">${mcBlock(L.comp, L.comp.map(c=>c.a||''), L.comp.some(c=>c.derived))}</div>
  </section>`;
}

function blanked(text, answers, cands){
  // answers === null → 该题没有逐空答案，只留不可点击的虚线位
  const ghost = (answers === null);
  let i = 0;
  const parts = String(text).replace(/\*\*/g,'').split(/[（(]\s*(?:　|\s)*[）)]/);
  let html = esc(parts[0]);
  for(let k=1;k<parts.length;k++){
    const a = ghost ? '' : String(answers[i] || '').replace(/\*\*/g,'');
    const c = (!ghost && cands && cands[i]) ? cands[i] : '';
    i++;
    html += (ghost ? '<span class="blank ghost"></span>'
                   : `<span class="blank${c?' cand':''}" data-a="${esc(a)}" data-c="${esc(c)}">${esc(c)}</span>`) + esc(parts[k]);
  }
  return html;
}

function rawAns(a){
  if(!a || a.kind!=='raw' || !(a.text||[]).length) return '';
  // 1–3 课答案用 (**词**) 标注：转成高亮；整行加粗的词库行则丢弃
  const fmt = t => esc(t).replace(/\(\*\*(.*?)\*\*\)/g, '<b class="ahl">$1</b>').replace(/\*\*/g,'');
  const rows = a.text.filter(t=>!/^\s*\*\*.*\*\*\s*$/.test(t));
  if(!rows.length) return '';
  return `<div class="rawans">
    <button class="btn small rawtog"><span class="lbl">显示参考答案</span></button>
    <div class="rawbody">${rows.map(t=>`<div class="rl rd" data-rd="zh">${fmt(t)}</div>`).join('')}</div></div>`;
}

function rawQ(a){
  const q = (a && a.qtext) || [];
  if(!q.length) return '';
  let head = '', rest = q;
  if(q.length > 1 && /[？?：:]\s*$/.test(q[0])){ head = q[0]; rest = q.slice(1); }
  const short = rest.length > 3 && rest.every(t=>t.length <= 22);
  const cells = rest.map(t=>`<div class="rl rd" data-rd="zh">${blanked(t, null)}</div>`).join('');
  return `<div class="rawq${short?' cols':''}">` +
    (head ? `<div class="rl rqh rd" data-rd="zh">${blanked(head, null)}</div>` : '') + cells + `</div>`;
}

function tableBlock(ex, a){
  const at = a.table || [];
  const qt = (ex.qtable && ex.qtable.length) ? ex.qtable : at;
  const bank = (ex.bank && ex.bank.length)
    ? `<div class="bank">${ex.bank.map(o=>`<span><b>${esc(o.k)}</b>${esc(o.t)}</span>`).join('')}</div>` : '';
  const intro = ex.intro ? `<div class="q rd" data-rd="zh">${esc(ex.intro)}</div>` : '';
  if(!qt.length) return intro + bank;
  const ghost = (a.kind !== 'table');
  // 学生册的空模板常常只留第一列，按整表最大列数补齐，避免右侧缺格
  const cols = Math.max(1, ...qt.map(r=>r.length), ...at.map(r=>r.length));
  const rows = qt.map((r,i)=>{
    let tds = '';
    for(let j=0;j<cols;j++){
      const c = r[j] || '';
      const ansCell = (at[i] && at[i][j]) || '';
      if(i===0) tds += `<th>${esc(c || ansCell)}</th>`;
      else if(j===0) tds += `<td>${esc(c || ansCell)}</td>`;
      else if(c) tds += `<td>${esc(c)}</td>`;
      else tds += `<td>${ghost ? '<span class="blank ghost"></span>'
                              : `<span class="blank" data-a="${esc(ansCell)}"></span>`}</td>`;
    }
    return `<tr>${tds}</tr>`;
  }).join('');
  return intro + bank + `<table class="ftab"><tbody>${rows}</tbody></table>`;
}

function renderEx(L){
  if(!L.exercises.length) return '';
  const cards = L.exercises.map(ex=>{
    const a = ex.ans || {};
    const ghost = (a.kind === 'raw');
    const gb = '<span class="blank ghost"></span>';
    let body = '';
    if(ex.type==='pattern'){
      body = `<div class="groups">${(ex.groups||[]).map(g=>`
        <div class="grp"><div class="gno">${esc(g.no)}</div>
          <ol>${g.sentences.map(s=>`<li class="rd" data-rd="zh">${esc(s)}</li>`).join('')}</ol>
          ${g.src?`<div class="src rd" data-rd="zh">${esc(g.src)}</div>`:''}</div>`).join('')}</div>`;
    } else if(ex.type==='table'){
      body = tableBlock(ex, a);
    } else if(ex.type==='match'){
      const pairs = a.vals || [];
      const table = a.table || null;
      const left = ex.left || [];
      const right = ex.right || [];
      const nk = (s)=>String(s||'').replace(/^\d+\s*[.．、]\s*/,'').replace(/\s+/g,'');
      const findAns = (l)=>{
        const k = nk(l);
        if(table){ const row = table.find(r=>nk(r[0])===k); if(row) return row[1]; }
        const p = pairs.find(p=>nk(p[0])===k); return p ? p[1] : '';
      };
      body = `<div class="match">
        <div class="mcol">${left.map(l=>`<div class="mitem"><span class="t rd" data-rd="zh">${esc(l)}</span>
          ${ghost?gb:`<span class="blank" data-a="${esc(findAns(l))}"></span>`}</div>`).join('')}</div>
        <div class="mcol">${right.map(r=>`<div class="mitem right"><span class="t rd" data-rd="zh">${esc(r)}</span></div>`).join('')}</div>
      </div>`;
    } else if(ex.type==='cloze' || ex.type==='fill'){
      const bank = (ex.bank && ex.bank.length) ? `<div class="bank">${ex.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div>` : '';
      const vals = a.vals || [];
      body = bank + `<ol class="items">${(ex.items||[]).map((it,i)=>{
        const tx = it.text || it.q || '';
        const inner = it.cand ? blanked(tx, it.ansx||[], it.cand)
                              : blanked(tx, ghost?null:(vals[i]||[]));
        return `
        <li><div class="q rd" data-rd="zh" data-rd-text="${esc(tx)}">${inner}</div>
          ${it.ask?`<div class="ask rd" data-rd="zh">问：${esc(it.ask)}</div>`:''}</li>`;}).join('')}</ol>`;
    } else if(ex.type==='mc'){
      body = mcBlock(ex.items||[], a.vals||[], a.derived, ghost);
    } else if(ex.type==='order'){
      body = `<ol class="items">${(ex.items||[]).map(it=>`<li><div class="q rd" data-rd="zh">${esc(it.q)}</div></li>`).join('')}</ol>`;
    } else {
      // multi / tf / misc
      const vals = a.vals || [];
      body = `<ol class="items">${(ex.items||[]).map((it,i)=>{
        const v = vals[i] || '';
        // misc 多为整段短文/提示，空位统一用不可点虚线位
        if(ex.type==='misc')
          return `<li><div class="q">${blanked(it.text || it.q, null)}</div></li>`;
        if(ghost) return `<li><div class="q"><span class="rd" data-rd="zh">${esc(it.q)}</span>${gb}</div></li>`;
        const cls = ex.type==='tf' ? 'blank tf' : 'blank multi';
        // 多选题：空白 = 未勾选，揭示时显示 ×
        const aa = (ex.type==='multi' && !v) ? '×' : v;
        return `<li><div class="q"><span class="rd" data-rd="zh">${esc(it.q)}</span>
          <span class="${cls}" data-a="${esc(aa)}"></span></div></li>`;
      }).join('')}</ol>`;
    }
    if(ghost) body = rawQ(a) + body + rawAns(a);
    const tag = ({pattern:'句式',match:'连线',cloze:'填空',fill:'选词',multi:'多选',tf:'判断',mc:'选择',order:'排序',table:'填表',misc:'练习'})[ex.type] || '练习';
    return `<div class="exsec">
      <div class="exhead"><h4>${esc(ex.title)}</h4><span class="tag">${tag}</span>
        ${a.derived?'<span class="tag" style="background:#fff6e9;color:#a8560b">答案据课文</span>':''}</div>
      ${ex.type==='pattern'?'<div class="exinstr">听录音，找出每组句子的共同点（可点击句子朗读）。</div>':''}
      ${ex.note?`<div class="exinstr rd" data-rd="zh">${esc(ex.note)}</div>`:''}
      ${body}</div>`;
  }).join('');
  return `<section class="sec" id="ex">
    <div class="sechead"><span class="sn">05</span><h3>练习</h3><span class="sen">Exercises</span>
      <div class="right"><span class="note">点击空白显示答案</span></div></div>
    ${cards}
  </section>`;
}

function homeStats(){
  const t = {v:0, p:0, e:0, q:0};
  DATA.forEach(L=>{
    t.v += L.vocab.length;
    t.p += L.text.filter(x=>!x.startsWith('§')).length;
    t.e += L.exercises.length;
    t.q += L.comp.length + L.exercises.reduce((n,x)=>
      n + (x.items ? x.items.length : (x.left ? x.left.length : (x.groups ? x.groups.length : 0))), 0);
  });
  return t;
}
function homeHTML(){
  const s = homeStats();
  const st = (n,label)=>`<span class="stat"><b>${n}</b><span>${label}</span></span>`;
  const cards = DATA.map(L=>{
    const paras = L.text.filter(x=>!x.startsWith('§')).length;
    return `<a class="ucard" data-no="${L.no}">
      <div class="uc-top"><span class="uc-no">第 ${L.no} 课</span><span class="uc-book">Listening Practice</span></div>
      <div class="uc-t">${esc(L.title)}</div>
      <div class="uc-meta">
        <span>${L.vocab.length} 个生词</span><span>${paras} 段课文</span><span>${L.exercises.length} 组练习</span>
      </div>
      <div class="uc-go">进入课文 <i>→</i></div>
    </a>`;
  }).join('');
  return `
  <section class="home-hero">
    <div class="home-brand">
      ${LOGO ? `<img class="home-logo" src="${LOGO}" alt="CreativeLearner">` : ''}
      <div class="home-titles">
        <div class="home-kicker">发展汉语（第二版）· 中级听力 II</div>
        <h1 class="home-title">中级听力 II · 网络课件</h1>
        <p class="home-sub">课文全文与逐句朗读、生词表（中英对照，可点读）、理解练习与课后练习（答案默认留空，点击显示）。
          朗读由浏览器在线语音合成，无需任何音频文件。 · Powered by CreativeLearner</p>
      </div>
    </div>
    <div class="home-stats">
      ${st(DATA.length,'课')}${st(s.v,'个生词')}${st(s.p,'段课文')}${st(s.e,'组练习')}${st(s.q,'道题目')}
    </div>
  </section>

  <section class="home-sec">
    <div class="home-sechead">课程目录 · Contents<span class="line"></span></div>
    <div class="home-grid">${cards}</div>
  </section>

  <section class="home-tips">
    <h4>使用说明</h4>
    <div class="tipgrid">
      <div class="tip"><b>点读与连读</b><p>课文、生词、题目、选项任意一句都可单击朗读；
        课文区「整篇连播」按段顺序播放，底部播放条可暂停、上下段切换、0.8×–1.1× 变速；
        畅所欲言与生词表各有「连读」按钮。</p></div>
      <div class="tip"><b>答案交互</b><p>所有答案默认留空，点击空白处显示；右上角悬浮的「显示全部答案」可一键展开/收起。
        选择题展开后同时高亮正确项；标「答案据课文」的题目为教材未给答案、依课文推导。</p></div>
      <div class="tip"><b>朗读语音</b><p>中文优先使用微软「云扬」，英文使用「Sonia」，均来自 Edge 在线语音，
        需联网。点击右上角语音标签可重新检测。</p></div>
      <div class="tip"><b>界面与快捷键</b><p><kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 上/下段；
        ☰ 收起/展开左侧栏（默认展开）；右上角 A− / A+ 调整字号。</p></div>
    </div>
  </section>
  <div class="footer">发展汉语（第二版）中级听力 II · 网络课件 · Powered by CreativeLearner</div>`;
}
function bindHome(){
  $('#wrap').querySelectorAll('.ucard').forEach(c=>{
    c.onclick = ()=>{ state.home = false; state.no = +c.dataset.no; renderAll(); closeSide(); };
  });
}

function renderAll(){
  stopWarm();
  stopSeq(false);
  $('#player').classList.remove('show');
  document.body.classList.remove('has-player');
  const hb = $('#homebtn');
  if(state.home){
    document.body.classList.add('onhome');
    if(hb) hb.classList.add('on');
    $('#crumb').textContent = '目录首页';
    document.title = '发展汉语 · 中级听力 II · 网络课件';
    $('#wrap').innerHTML = homeHTML();
    renderSide();
    bindHome();
    window.scrollTo({top:0});
    return;
  }
  document.body.classList.remove('onhome');
  if(hb) hb.classList.remove('on');
  const L = curLesson();
  state.no = L.no;
  $('#crumb').innerHTML = `<b>第 ${L.no} 课</b> · ${esc(L.title)}`;
  document.title = `第${L.no}课 ${L.title} · 发展汉语中级听力II`;
  const html = `
    <section class="hero">
      <div class="eyebrow">发展汉语 · 中级听力 II<span class="line"></span></div>
      <h2>第 ${L.no} 课　${esc(L.title)}</h2>
      <p class="sub">课文 ${L.text.length} 段 · 生词 ${L.vocab.length} 个 · 练习 ${L.exercises.length} 组</p>
      <div class="meta">
        <span class="chip">中文朗读 <b class="vzh">加载中</b></span>
        <span class="chip">英文朗读 <b class="ven">加载中</b></span>
        <span class="chip">在线语音 · 无需音频文件</span>
      </div>
    </section>
    ${renderWarm(L)}${renderVocab(L)}${renderText(L)}${renderComp(L)}${renderEx(L)}
    <div class="note" style="margin-top:28px">内容据《发展汉语（第二版）中级听力 II》整理；朗读由浏览器在线语音合成，需联网（推荐 Edge）。</div>`;
  $('#wrap').innerHTML = html;
  renderSide();
  bindLesson();
  applyReveal();
  updateNav();
  window.scrollTo({top:0});
}

function bindLesson(){
  const L = curLesson();
  $('#wrap').querySelectorAll('.para').forEach(p=>{
    const i = +p.dataset.i;
    p.querySelector('.ptext').onclick = () => {
      if(p.classList.contains('playing')){ stopSeq(false); return; }
      playFrom(i);
    };
    p.querySelector('.pbtn').onclick = (e)=>{ e.stopPropagation(); playFrom(i); };
  });
  const pa = $('#playAll'); if(pa) pa.onclick = ()=> playFrom(0);
  const rv = $('#readVocab');
  if(rv){
    let playing=false, k=0, tok=0;
    rv.onclick = ()=>{
      if(playing){ playing=false; tok++; speak('', 'zh'); rv.textContent='▶ 连读生词'; return; }
      const words = L.vocab.map(v=>v.w);
      if(!words.length) return;
      stopRead(); playing=true; k=0; const my=++tok;
      rv.textContent='■ 停止';
      const step = ()=>{
        if(!playing || my!==tok || k>=words.length){ if(my===tok){ rv.textContent='▶ 连读生词'; playing=false; } return; }
        speak(words[k++], 'zh', ()=> setTimeout(step, 240));
      };
      step();
    };
  }
  // 选择题选项高亮
  $('#wrap').querySelectorAll('.ansline .blank').forEach(b=>{
    b.addEventListener('click', ()=> setTimeout(syncMC, 0));
  });
}

/* 空白显示 */
function setBlank(b, on){
  const a = b.dataset.a || '';
  const c = b.dataset.c || '';
  if(on){ b.textContent = a || '—'; b.classList.add('on'); }
  else { b.textContent = c; b.classList.remove('on'); }
}
function applyReveal(){
  document.querySelectorAll('.blank').forEach(b=>{
    if(!b.classList.contains('ghost')) setBlank(b, state.revealAll);
  });
  document.querySelectorAll('.rawans').forEach(r=>{
    r.classList.toggle('on', state.revealAll);
    const l = r.querySelector('.lbl');
    if(l) l.textContent = state.revealAll ? '收起参考答案' : '显示参考答案';
  });
  $('#sw-all').setAttribute('aria-pressed', state.revealAll);
  syncMC();
}

/* 导航高亮 */
let io = null;
function updateNav(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        document.querySelectorAll('#lessonnav a').forEach(a=>a.classList.toggle('on', a.dataset.target===e.target.id));
      }
    });
  }, {rootMargin:'-70px 0px -70% 0px', threshold:0});
  document.querySelectorAll('.sec').forEach(s=>io.observe(s));
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', e=>{
  const wr = e.target.closest('#warm-read');
  if(wr){ e.preventDefault(); readWarm(); return; }
  const bx = e.target.closest('.warm .opt .bx');
  if(bx){ bx.classList.toggle('ticked'); return; }
  const rt = e.target.closest('.rawtog');
  if(rt){
    const box = rt.closest('.rawans');
    box.classList.toggle('on');
    const l = rt.querySelector('.lbl');
    if(l) l.textContent = box.classList.contains('on') ? '收起参考答案' : '显示参考答案';
    return;
  }
  const bl = e.target.closest('.blank');
  if(bl){
    e.preventDefault(); e.stopPropagation();
    if(bl.classList.contains('ghost')) return;
    setBlank(bl, !bl.classList.contains('on')); return;
  }
  const rd = e.target.closest('[data-rd]');
  if(rd){ e.preventDefault(); e.stopPropagation(); readNode(rd); return; }
});

$('#pmain').onclick = togglePlay;
$('#pprev').onclick = ()=>{ if(seq.active){ runJob(Math.max(0, seq.i-1)); } };
$('#pnext').onclick = ()=>{ if(seq.active){ runJob(Math.min(seq.jobs.length-1, seq.i+1)); } };
$('#prate').querySelectorAll('button').forEach(b=>{
  if(+b.dataset.rate===state.rate) { $('#prate').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }
  b.onclick = ()=>{
    state.rate = +b.dataset.rate; localStorage.setItem('dcl_rate', state.rate);
    $('#prate').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  };
});
$('#sw-all').onclick = ()=>{ state.revealAll = !state.revealAll; applyReveal(); };
$('#homebtn').onclick = ()=>{ state.home = true; renderAll(); closeSide(); };
$('#brand').onclick = ()=>{ state.home = true; renderAll(); closeSide(); };
$('#fsup').onclick = ()=>{ state.fs = Math.min(1.35, +(state.fs+0.05).toFixed(2)); document.documentElement.style.setProperty('--fs', state.fs); localStorage.setItem('dcl_fs', state.fs); };
$('#fsdown').onclick = ()=>{ state.fs = Math.max(0.85, +(state.fs-0.05).toFixed(2)); document.documentElement.style.setProperty('--fs', state.fs); localStorage.setItem('dcl_fs', state.fs); };
function closeSide(){
  $('#side').classList.remove('open');
  $('#scrim').classList.remove('show');
  $('#menubtn').classList.remove('on');
}
function isMobile(){ return window.matchMedia('(max-width:980px)').matches; }
$('#menubtn').onclick = ()=>{
  if(isMobile()){
    const open = !$('#side').classList.contains('open');
    $('#side').classList.toggle('open', open);
    $('#scrim').classList.toggle('show', open);
    $('#menubtn').classList.toggle('on', open);
  } else {
    const off = document.body.classList.toggle('nav-off');
    $('#menubtn').classList.toggle('on', !off);
  }
};
$('#scrim').onclick = closeSide;
$('#side').addEventListener('click', e=>{
  if(isMobile() && e.target.closest('.lessonbtn, #lessonnav a')) closeSide();
});
$('#menubtn').classList.add('on');   // 默认展开
$('#voicetag').onclick = ()=>{ initVoices(); setTimeout(initVoices, 300); };

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT' || e.target.isContentEditable) return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.key==='ArrowLeft'){ if(seq.active) runJob(Math.max(0, seq.i-1)); }
  else if(e.key==='ArrowRight'){ if(seq.active) runJob(Math.min(seq.jobs.length-1, seq.i+1)); }
});

/* ---------------- 启动 ---------------- */
document.documentElement.style.setProperty('--fs', state.fs);
if(SPEAK_OK){
  initVoices();
  speechSynthesis.onvoiceschanged = initVoices;
  setTimeout(initVoices, 300);
  setTimeout(initVoices, 1000);
}
renderAll();
paintVoice();
</script>
</body>
</html>
